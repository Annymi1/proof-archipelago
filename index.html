  const R=5,Cn=7,rows=[...Array(R)].map(()=>[...Array(Cn)].map(()=>Math.random()<.5?1:0)),d=Array(Cn).fill(null);
  function render(){
    const c=40,ox=44,oy=26,W=ox+Cn*c+70,Hh=oy+(R+1)*c+30;const svg=sv('svg',{viewBox:`0 0 ${W} ${Hh}`,role:'group','aria-label':'diagonal table'});
    for(let j=0;j<Cn;j++)svg.append(sv('text',{x:ox+j*c+c/2,y:oy-8,'text-anchor':'middle',class:'svg-m'},j));
    rows.forEach((row,i)=>{svg.append(sv('text',{x:ox-8,y:oy+i*c+c/2+5,'text-anchor':'end',class:'svg-b'},'s'+i));row.forEach((v,j)=>{svg.append(sv('rect',{x:ox+j*c,y:oy+i*c,width:c,height:c,class:'bitc'+(i===j?' dg':'')}),sv('text',{x:ox+j*c+c/2,y:oy+i*c+c/2+5,'text-anchor':'middle',class:'svg-b'},v));});svg.append(sv('text',{x:ox+Cn*c+8,y:oy+i*c+c/2+5,class:'svg-m'},'…'));});
    const yd=oy+R*c+10;svg.append(sv('text',{x:ox-8,y:yd+c/2+5,'text-anchor':'end',class:'svg-b'},'d'));
    d.forEach((v,j)=>{const bad=j<R&&v!=null&&v===rows[j][j];const r=sv('rect',{x:ox+j*c,y:yd,width:c,height:c,class:'bitc '+(bad?'dbad':'d'),tabindex:0,role:'button','aria-label':'d place '+j});
      const go=()=>{d[j]=d[j]==null?0:d[j]===0?1:null;render();};r.addEventListener('click',go);r.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});
      svg.append(r,sv('text',{x:ox+j*c+c/2,y:yd+c/2+5,'text-anchor':'middle',class:'svg-b',style:'pointer-events:none'},v==null?'?':v));});
    box.replaceChildren(h('p',{class:'meta'},'Click a cell of d: ? → 0 → 1. Blue frames are the diagonal. Places 5 and 6 can be anything.'),h('div',{class:'scroll'},svg),
      h('button',{class:'btn primary',style:'margin-top:8px',onclick:check},'Check d'));
  }
  api.onHint=()=>{const i=d.findIndex((v,j)=>j<R&&(v==null||v===rows[j][j]));if(i<0)return 'd differs from every row on the diagonal. Press “Check d”.';
    d[i]=1-rows[i][i];render();return `Place ${i}: s${i} has ${rows[i][i]} on the diagonal, so d gets ${1-rows[i][i]} there.`;};
  function check(){for(let i=0;i<R;i++){if(d[i]==null)return api.info(`Fill place ${i} of d.`);if(d[i]===rows[i][i])return api.mistake(`d agrees with s${i} at place ${i} (both ${d[i]}). Flip it.`);}api.info('d differs from every row sᵢ at place i, so d is not in the list.');setTimeout(done,600);}
  render();
};

/* ---- truth table builder ---- */
C.ttable=function(box,L,api,done){
  let k=0;
  function round(){
    const R=L.rounds[k],n=R.vars.length,N=1<<n;
    const rows=[...Array(N)].map((_,i)=>R.vars.map((_,j)=>!((i>>(n-1-j))&1)));
    const val=rows.map(v=>R.cols.map(c=>!!c.f(...v)));
    const st=rows.map((_,i)=>R.cols.map((c,j)=>c.given?val[i][j]:null));
    const rowName=v=>R.vars.map((x,j)=>x+' = '+TV(v[j])).join(', ');
    let locked=false;const cells=[];
    const paint=(b,i,j)=>{const s=st[i][j];b.textContent=s===null?'·':TV(s);b.dataset.v=s===null?'':TV(s);};
    const tb=h('table',{class:'tt'},
      h('thead',{},h('tr',{},R.vars.map(v=>h('th',{class:'tv'},v)),R.cols.map(c=>h('th',{class:c.given?'tg':''},c.t)))),
      h('tbody',{},rows.map((v,i)=>h('tr',{},v.map(b=>h('td',{class:'tv'},TV(b))),R.cols.map((c,j)=>{
        if(c.given)return h('td',{class:'tg'},TV(val[i][j]));
        const b=h('button',{class:'ttc',type:'button','aria-label':`row ${i+1}, column ${c.t}`,onclick:()=>{if(locked)return;st[i][j]=st[i][j]===null?true:st[i][j]===true?false:null;paint(b,i,j);b.classList.remove('bad');}},'·');
        cells.push({b,i,j});return h('td',{},b);})))));
    const check=h('button',{class:'btn primary',onclick:run},'Check the table');
    const after=h('div',{});
    box.replaceChildren(h('div',{class:'stage-tag'},`Table ${k+1} of ${L.rounds.length}`),h('p',{class:'q mono'},R.f),
      h('p',{class:'meta'},'Tap a cell: · → T → F → ·',R.cols.some(c=>c.given)?' Grey columns are given.':null),h('div',{class:'scroll'},tb),h('div',{class:'row',style:'margin-top:10px'},check),after);
    api.onHint=()=>{if(locked)return 'Look at the last column: all T → valid; some T → satisfiable, not valid; no T → unsatisfiable.';
      for(let j=0;j<R.cols.length;j++){if(R.cols[j].given)continue;const cs=cells.filter(c=>c.j===j);
        if(cs.some(c=>st[c.i][c.j]!==val[c.i][c.j])){cs.forEach(c=>{st[c.i][c.j]=val[c.i][c.j];paint(c.b,c.i,c.j);c.b.classList.remove('bad');c.b.classList.add('hinted');});return ['Column ',h('span',{class:'mono'},R.cols[j].t),' is filled in. Use it for the next column.'];}}
      return 'Every cell is right. Press “Check the table”.';};
    function run(){
      const empty=cells.filter(c=>st[c.i][c.j]===null).length;
      if(empty)return api.info(`${empty} cell(s) are still empty.`);
      const bad=cells.filter(c=>st[c.i][c.j]!==val[c.i][c.j]);
      if(bad.length){bad.forEach(c=>c.b.classList.add('bad'));return api.mistake(`${bad.length} cell(s) are wrong — marked in red. X → Y is F only in the row T → F; work column by column, left to right.`);}
      locked=true;check.disabled=true;cells.forEach(c=>{c.b.disabled=true;c.b.classList.add('ok');});api.clear();ask();
    }
    function ask(){
      const last=val.map(r=>r[r.length-1]),cls=last.every(x=>x)?0:last.some(x=>x)?1:2;
      const fr=rows.filter((_,i)=>!last[i]).map(rowName);
      const q=R.q||{q:'So the formula is …',opts:CLS,a:cls,
        why:cls===0?'Every row of the last column is T.':cls===2?'No row of the last column is T.':`It is T in some rows and F in ${fr.length>1?'the rows':'the row'}: ${fr.join(' · ')}. One F row is exactly the counter-example you write for “not valid”.`};
      const why=h('div',{class:'why',hidden:true});
      const last1=k===L.rounds.length-1;
      const next=h('button',{class:'btn primary',hidden:true,onclick:()=>{k++;if(k<L.rounds.length)round();else done();}},last1?'Finish':'Next table →');
      const btns=q.opts.map((o,idx)=>h('button',{class:'btn',onclick:e=>{
        if(idx===q.a){btns.forEach(b=>b.disabled=true);e.currentTarget.className='btn ok';why.hidden=false;why.replaceChildren(h('b',{},'Why: '),q.why);next.hidden=false;next.focus();api.clear();}
        else{e.currentTarget.className='btn no';e.currentTarget.disabled=true;api.mistake(R.q?'Compare the two columns row by row.':idx===0?'There is an F in the last column.':idx===2?'There is a T in the last column.':cls===0?'Is there any F in the last column?':'Is there any T in the last column?');}}},o));
      after.replaceChildren(h('p',{class:'q',style:'margin-top:14px'},q.q),h('div',{class:'opts'},btns),why,h('div',{class:'row',style:'margin-top:12px'},next));
    }
  }
  round();
};

/* ---- counter-model lab ---- */
C.cmodel=function(box,L,api,done){
  let k=0,miss=0,wrong=0;
  function round(){
    const R=L.rounds[k],bin=R.kind===2,menu=bin?BP:UP;
    const mk=lab=>h('select',{class:'gap','aria-label':lab},h('option',{value:''},'choose …'),menu.map((p,i)=>h('option',{value:String(i)},p[0])));
    const sP=mk(bin?'P(x, y)':'P(x)'),sQ=bin?null:mk('Q(x)');
    const out=h('div',{style:'margin-top:10px'}),fin=h('div',{});let solved=false;
    const ev=h('button',{class:'btn primary',onclick:evaluate},'Evaluate');
    const val=h('button',{class:'btn',onclick:claim},'No counter-model exists: it is valid');
    const hint=null;
    api.onHint=()=>R.hint||(R.valid?'Try to break it. If every attempt fails for the same reason, that reason is why it is valid.':'Make the part before the main → true and the part after it false.');
    box.replaceChildren(h('div',{class:'stage-tag'},`Formula ${k+1} of ${L.rounds.length} · domain ℕ`),h('p',{class:'q mono',style:'font-size:15.5px'},R.f),
      h('div',{class:'cmsel'},h('label',{},h('span',{class:'mono'},bin?'P(x, y) ::= ':'P(x) ::= '),sP),sQ?h('label',{},h('span',{class:'mono'},'Q(x) ::= '),sQ):null),
      h('div',{class:'row',style:'margin-top:10px'},ev,val,hint),out,fin);
    function evaluate(){
      if(solved)return;
      if(sP.value===''||(sQ&&sQ.value===''))return api.info(bin?'Choose P first.':'Choose P and Q first.');
      const P=menu[+sP.value][1],Q=sQ?menu[+sQ.value][1]:null;
      const parts=R.parts(P,Q),w=R.whole(parts.map(p=>p[1]));
      out.replaceChildren(h('table',{class:'t mono cmt'},h('tbody',{},parts.map(p=>h('tr',{},h('td',{},p[0]),h('td',{class:p[1]?'tvT':'tvF'},TV(p[1])))),
        h('tr',{},h('td',{},h('b',{},'whole formula')),h('td',{class:w?'tvT':'tvF'},h('b',{},TV(w)))))));
      if(!w){solved=true;[ev,val,hint].forEach(b=>b&&(b.disabled=true));sP.disabled=true;if(sQ)sQ.disabled=true;api.info('Counter-model found: this interpretation makes the formula false, so it is not valid.');finish();}
      else{if(!R.valid)miss++;api.info('The formula is TRUE under this interpretation. Try another one — or decide that none exists.');}
    }
    function claim(){
      if(solved)return;
      if(R.valid){solved=true;[ev,val,hint].forEach(b=>b&&(b.disabled=true));sP.disabled=true;if(sQ)sQ.disabled=true;api.clear();finish();}
      else{wrong++;api.mistake('It is not valid: a counter-model exists. Keep searching — the 💡 hint helps.');}
    }
    function finish(){
      const lastR=k===L.rounds.length-1;
      fin.replaceChildren(h('div',{class:'why'},h('b',{},R.valid?'Valid. ':'Why: '),R.why),
        h('div',{class:'row',style:'margin-top:12px'},h('button',{class:'btn primary',onclick:()=>{k++;if(k<L.rounds.length){api.clear();round();}else{api.stars=miss<=2&&!wrong?3:miss<=6&&wrong<=1?2:1;api.summary=`Unsuccessful tries: ${miss} · wrong “valid” claims: ${wrong}`;done();}}},lastR?'Finish':'Next formula →')));
    }
  }
  round();
};

/* ---- Venn painter ---- */
C.venn=function(box,L,api,done){
  let k=0,uid=0;
  const CIR=[[150,130],[250,130],[200,215]],RR=80;
  const REG=[[1,0,0,105,110,'A only'],[0,1,0,295,110,'B only'],[0,0,1,200,270,'C only'],[1,1,0,200,95,'A ∩ B, not C'],[1,0,1,145,200,'A ∩ C, not B'],[0,1,1,255,200,'B ∩ C, not A'],[1,1,1,200,160,'A ∩ B ∩ C'],[0,0,0,44,300,'outside A, B, C']];
  function round(){
    const R=L.rounds[k],p='vn'+String(L.id).replace(/\W/g,'')+'x'+(uid++);
    const sh=REG.map(()=>false),truth=REG.map(r=>!!R.f(!!r[0],!!r[1],!!r[2]));let locked=false;const bad=new Set();
    const svg=sv('svg',{viewBox:'0 0 400 340',role:'img','aria-label':'Venn diagram: sets A, B, C inside the domain D',class:'vsvg'});
    const chips=REG.map((r,ri)=>h('button',{class:'btn chip2',type:'button','aria-pressed':'false',onclick:()=>toggle(ri)},`${ri+1} · ${r[5]}`));
    function draw(){
      const defs=sv('defs',{});
      CIR.forEach(([x,y],i)=>defs.append(sv('clipPath',{id:`${p}c${i}`},sv('circle',{cx:x,cy:y,r:RR})),
        sv('mask',{id:`${p}m${i}`,maskUnits:'userSpaceOnUse',x:0,y:0,width:400,height:340},sv('rect',{x:0,y:0,width:400,height:340,fill:'#fff'}),sv('circle',{cx:x,cy:y,r:RR,fill:'#000'}))));
      const kids=[defs,sv('rect',{x:16,y:16,width:368,height:308,rx:14,class:'vdom'})];
      REG.forEach((r,ri)=>{if(!sh[ri])return;let el=sv('rect',{x:16,y:16,width:368,height:308,rx:14,class:'vfill'+(bad.has(ri)?' bad':'')});
        for(let i=0;i<3;i++)el=sv('g',r[i]?{'clip-path':`url(#${p}c${i})`}:{mask:`url(#${p}m${i})`},el);kids.push(el);});
      CIR.forEach(([x,y])=>kids.push(sv('circle',{cx:x,cy:y,r:RR,class:'vcir'})));
      kids.push(sv('text',{x:76,y:54,class:'vlab'},'A'),sv('text',{x:310,y:54,class:'vlab'},'B'),sv('text',{x:268,y:306,class:'vlab'},'C'),sv('text',{x:30,y:42,class:'svg-m'},'D'));
      REG.forEach((r,ri)=>kids.push(sv('text',{x:r[3],y:r[4]+4,'text-anchor':'middle',class:'vnum'+(bad.has(ri)?' bad':'')},String(ri+1))));
      svg.replaceChildren(...kids);
      chips.forEach((c,ri)=>{c.className='btn chip2'+(sh[ri]?' sel':'')+(bad.has(ri)?' no':'');c.setAttribute('aria-pressed',String(sh[ri]));c.disabled=locked;});
    }
    function toggle(ri){if(locked||ri<0)return;sh[ri]=!sh[ri];bad.delete(ri);draw();}
    svg.addEventListener('click',e=>{if(locked)return;const m=svg.getScreenCTM();if(!m)return;const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(m.inverse());
      if(q.x<16||q.x>384||q.y<16||q.y>324)return;const bits=CIR.map(([x,y])=>(q.x-x)**2+(q.y-y)**2<=RR*RR?1:0);toggle(REG.findIndex(r=>r[0]===bits[0]&&r[1]===bits[1]&&r[2]===bits[2]));});
    const check=h('button',{class:'btn primary',onclick:run},'Check');
    const after=h('div',{});
    api.onHint=()=>{if(locked)return R.q?'Compare your picture with the picture of A itself.':null;const ri=REG.findIndex((_,i)=>sh[i]!==truth[i]);
      if(ri<0)return 'Your picture is right. Press Check.';sh[ri]=truth[ri];bad.delete(ri);draw();return ['Region ',String(ri+1),' is fixed. ',truth[ri]?'It belongs to the set.':'It is not in the set.'];};
    box.replaceChildren(h('div',{class:'stage-tag'},`Picture ${k+1} of ${L.rounds.length}`),h('p',{class:'q mono',style:'font-size:18px'},R.t),svg,h('div',{class:'chips2'},chips),h('div',{class:'row',style:'margin-top:10px'},check),labOf({lab:['vennlab',{f:R.lab||R.t}]},L,api),after);
    draw();
    function run(){
      if(!sh.some(x=>x))return api.info('Shade at least one region first.');
      bad.clear();REG.forEach((_,ri)=>{if(sh[ri]!==truth[ri])bad.add(ri);});
      if(bad.size){draw();return api.mistake(`${bad.size} region(s) wrong — their numbers are red. Test one point of each region: is it in the set?`);}
      locked=true;check.disabled=true;draw();api.clear();
      const lastR=k===L.rounds.length-1;
      const next=h('button',{class:'btn primary',onclick:()=>{k++;if(k<L.rounds.length)round();else done();}},lastR?'Finish':'Next picture →');
      if(!R.q){after.replaceChildren(h('div',{class:'why'},h('b',{},'Right. '),R.why),h('div',{class:'row',style:'margin-top:12px'},next));next.focus();return;}
      next.hidden=true;const why=h('div',{class:'why',hidden:true});
      const btns=R.q.opts.map((o,idx)=>h('button',{class:'btn',onclick:e=>{if(idx===R.q.a){btns.forEach(b=>b.disabled=true);e.currentTarget.className='btn ok';why.hidden=false;why.replaceChildren(h('b',{},'Why: '),R.q.why);next.hidden=false;next.focus();api.clear();}else{e.currentTarget.className='btn no';e.currentTarget.disabled=true;api.mistake('Compare your picture with A itself.');}}},o));
      after.replaceChildren(h('p',{class:'q',style:'margin-top:14px'},R.q.q),h('div',{class:'opts'},btns),why,h('div',{class:'row',style:'margin-top:12px'},next));
    }
  }
  round();
};

<script>
/* ================= toys: poke the idea and watch it change ================= */
const TOYS={};
let TOYUID=0;
const tfc=b=>h('span',{class:'tfc '+(b?'t':'f')},TV(b));
const seg=(opts,cur,on)=>h('div',{class:'seg',role:'group'},opts.map(([v,lab])=>h('button',{class:'btn'+(v===cur?' sel':''),type:'button','aria-pressed':String(v===cur),onclick:()=>on(v)},lab)));
const stepper=(lab,val,lo,hi,on)=>h('span',{class:'stp'},h('span',{class:'mono'},lab),h('button',{class:'btn mini',type:'button','aria-label':lab+' minus',disabled:val<=lo,onclick:()=>on(val-1)},'−'),h('b',{class:'mono'},String(val)),h('button',{class:'btn mini',type:'button','aria-label':lab+' plus',disabled:val>=hi,onclick:()=>on(val+1)},'+'));
const isPrime=n=>{if(n<2)return false;for(let d=2;d*d<=n;d++)if(n%d===0)return false;return true;};
const SUPD='⁰¹²³⁴⁵⁶⁷⁸⁹',SUBD='₀₁₂₃₄₅₆₇₈₉',sup=n=>String(n).split('').map(c=>SUPD[+c]??c).join(''),sub=n=>String(n).split('').map(c=>SUBD[+c]??c).join(''),lg=(b,a)=>`log${sub(b)} ${a}`;
const factor=n=>{const f={};let d=2;while(n>1&&d*d<=n){while(n%d===0){f[d]=(f[d]||0)+1;n/=d;}d++;}if(n>1)f[n]=(f[n]||0)+1;return f;};
const factStr=n=>{const f=factor(n);const SUP='⁰¹²³⁴⁵⁶⁷⁸⁹';const sup=k=>k===1?'':String(k).split('').map(c=>SUP[+c]).join('');return Object.keys(f).map(p=>p+sup(f[p])).join(' · ')||String(n);};

/* ---- ch. 1 · implication as a promise ---- */
TOYS.impl={name:'Promise machine',run(box){
  let P=true,Q=true;const seen=new Set();
  const ROWS=[[true,true],[true,false],[false,true],[false,false]];
  const STM=[['P ⇒ Q','the promise',(p,q)=>IMP(p,q)],['¬Q ⇒ ¬P','contrapositive',(p,q)=>IMP(!q,!p)],['Q ⇒ P','converse',(p,q)=>IMP(q,p)],['¬P ⇒ ¬Q','inverse',(p,q)=>IMP(!p,!q)],['P ∧ ¬Q','negation',(p,q)=>p&&!q]];
  const STORY={TT:'It rains and you bring the umbrella: promise kept.',TF:'It rains and there is no umbrella: the ONLY way to break the promise.',FT:'No rain, umbrella anyway: nobody can say the promise was broken.',FF:'No rain, no umbrella: the promise was never tested — it stands.'};
  function draw(){
    seen.add(TV(P)+TV(Q));const all=seen.size===4;
    const tbl=h('table',{class:'t mono'},h('thead',{},h('tr',{},h('th',{},'P'),h('th',{},'Q'),STM.map(s=>h('th',{},s[0])))),
      h('tbody',{},ROWS.map(([p,q])=>{const key=TV(p)+TV(q),vis=seen.has(key);return h('tr',{class:(p===P&&q===Q?'cur':'')+(vis?'':' unseen')},h('td',{},TV(p)),h('td',{},TV(q)),STM.map(s=>h('td',{},vis?tfc(s[2](p,q)):'?')));})));
    box.replaceChildren(
      h('p',{class:'ru'},'P = “it rains”, Q = “I take an umbrella”. P ⇒ Q is the promise “if it rains, I take an umbrella”.'),
      h('div',{class:'row'},h('button',{class:'btn sw',onclick:()=>{P=!P;draw();}},'P · rain ',tfc(P)),h('button',{class:'btn sw',onclick:()=>{Q=!Q;draw();}},'Q · umbrella ',tfc(Q))),
      h('p',{class:'story'},STORY[TV(P)+TV(Q)]),
      h('div',{class:'lamps'},STM.map(s=>h('div',{class:'lamp '+(s[2](P,Q)?'t':'f')},h('span',{class:'mono'},s[0]),h('span',{class:'ru'},s[1]),tfc(s[2](P,Q))))),
      h('div',{class:'scroll'},tbl),
      h('p',{class:all?'why':'ru',style:'margin-top:8px'},all?'All 4 rows seen. The contrapositive matches P ⇒ Q in every row: they are equivalent. The converse and the inverse differ from it in rows TF and FT — they match EACH OTHER. The negation P ∧ ¬Q is T only in the broken row.':`Seen ${seen.size} of 4 rows — flip the switches to uncover the table.`));
  }
  draw();}};

/* ---- ch. 1 · prime balance for logarithms ---- */
TOYS.logbal={name:'Prime balance',run(box){
  let b=4,a=8,m=1,n=1;
  const PRE=[[4,8],[4,6],[20,50],[9,27],[25,125],[29,125],[2,3],[8,4]];
  const num=(v,on,lab)=>{const i=h('input',{type:'number',min:2,max:999,value:v,'aria-label':lab,style:'width:5.5em'});i.addEventListener('change',()=>{const x=Math.max(2,Math.min(999,Math.round(+i.value||2)));on(x);});return i;};
  function draw(){
    const fb=factor(b),fa=factor(a),ps=[...new Set([...Object.keys(fb),...Object.keys(fa)].map(Number))].sort((x,y)=>x-y);
    const eb=p=>fb[p]||0,ea=p=>fa[p]||0;
    let verdict;const lone=ps.find(p=>!eb(p)||!ea(p));
    if(lone!==undefined)verdict=`The prime ${lone} appears in ${eb(lone)?b:a} but not in ${eb(lone)?a:b}. For m, n ≥ 1 it divides ${eb(lone)?'bᵐ':'aⁿ'} and never ${eb(lone)?'aⁿ':'bᵐ'}: no setting balances. ${lg(b,a)} is irrational.`;
    else{const [x0,y0]=[ea(ps[0]),eb(ps[0])];const bad=ps.find(p=>ea(p)*y0!==eb(p)*x0);

        h('div',{class:'dots'},L.cards.map((_,i)=>h('button',{class:'dot2'+(i===k?' on':''),type:'button','aria-label':'card '+(i+1),onclick:()=>{k=i;show();}})))),
      h('h3',{class:'th'},K.h),K.book?h('p',{class:'ids book'},'≙ MCS book (2018): ',K.book):null,
      (K.p||[]).map(t=>h('p',{class:'tp'},t)),
      K.pic?PICS[K.pic]():null,
      K.try?h('div',{class:'try'},h('b',{},'Poke it'),h('ul',{},K.try.map(t=>h('li',{},t)))):null,
      K.toy?tb:null,
      h('div',{class:'row',style:'margin-top:14px'},k>0?h('button',{class:'btn',onclick:()=>{k--;show();}},'← Back'):null,
        h('button',{class:'btn primary',onclick:()=>{if(k<L.cards.length-1){k++;show();window.scrollTo({top:0});}else{api.stars=3;api.summary='Lighthouse done — come back whenever something slips your mind.';done();}}},k<L.cards.length-1?'Next card →':'Finish')));

     lines:['The proof is by the WOP.','Let EF(n) mean that F(n) is even.','Let C ::= {n ∈ ℕ | NOT(EF(n))} be the set of counterexamples.','We prove by contradiction that C is empty. So assume that C is not empty.','By the WOP, there is a least nonnegative integer m ∈ C.','Then m > 0, since F(0) = 0 is an even number.','Since m is the minimum counterexample, F(k) is even for all k < m.','In particular, F(m − 1) and F(m − 2) are both even.','But by the definition, F(m) equals the sum F(m − 1) + F(m − 2) of two even numbers, and so it is also even.','That is, EF(m) is true.','This contradicts the condition in the definition of m that NOT(EF(m)) holds.','This contradiction implies that C must be empty. Hence F(n) is even for all n ∈ ℕ.'],
     bug:[7,8],hint:'The least counterexample is m = 1. Read lines 8 and 9 with m = 1.',
     miss:{5:'True: F(0) = 0 is even, so 0 ∉ C and m > 0.',6:'True, by the choice of m.',4:'Fine: the WOP gives the least element of a nonempty C ⊆ ℕ.'},
     explain:'Line 8 assumes m ≥ 2. For m = 1, m − 2 = −1 is not a natural number, and line 9 uses F(m) = F(m − 1) + F(m − 2), which the definition gives only for m > 1. The case m = 1 was never handled — and m = 1 IS the least counterexample, since F(1) = 1 is odd.'}]},

lgc:[
  {id:'lgc_s1',title:'Simplify the if',ru:'Упрости условие if',type:'stages',kind:'book story',book:'§3.2, pp. 52–53',lab:['formula'],
   brief:'From the book: a program says  if ( x > 0 || (x <= 0 && y > 100) ). Let A be “x > 0” and B be “y > 100”. Is the condition equivalent to the simpler A OR B?',

   stages:[

      q:{q:'Compare the last two columns. The two conditions are …',opts:['equivalent: the same value in every row','not equivalent','equivalent only when A is true'],a:0,why:'The columns agree in all four rows, so the formulas are equivalent and the program can be simplified.'}}]},
    {type:'mc',tag:'Back to the code',qs:[

     {q:'The book also proves it by cases. If A is F, then A ∨ (¬A ∧ B) becomes …',opts:['F ∨ (T ∧ B), which is equivalent to B — and so is A ∨ B','always T','always F','¬B'],a:0,why:'Case A = T: both sides are T. Case A = F: both sides reduce to B. Every case agrees, so they are equivalent.'}]}]},

set:[
  {id:'set_s1',title:'The bogus iff chain',ru:'Ложная цепочка iff',type:'bughunt',kind:'find the bug',book:'Problem 4.15, pp. 123–124',lab:['vennlab','formula'],
   brief:'False theorem: (A ∪ B) × (C ∪ D) = (A × C) ∪ (B × D). The proof is a chain of iff’s, and one link is only a one-way implication. Find it.',
   lesson:'In a chain of iff’s, EVERY link must hold in both directions. One link that is only ⇒ turns the chain into a proof of ⊆, not of =.',
   rounds:[{src:'Problem 4.15 (b)',claim:'L ::= (A ∪ B) × (C ∪ D),  R ::= (A × C) ∪ (B × D).  “Proof” that L = R:',
     lines:['(x, y) ∈ R','iff (x, y) ∈ (A × C) ∪ (B × D)','iff (x, y) ∈ A × C, or (x, y) ∈ B × D','iff (x ∈ A and y ∈ C) or else (x ∈ B and y ∈ D)','iff (x ∈ A or x ∈ B), and (y ∈ C or y ∈ D)','iff x ∈ A ∪ B and y ∈ C ∪ D','iff (x, y) ∈ L.'],bug:[4],
     miss:{1:'Definition of R: fine.',2:'Definition of ∪: fine.',3:'Definition of ×: fine.',5:'Definition of ∪: fine.',6:'Definition of ×: fine.'},
     hint:'Try x ∈ A only and y ∈ D only. Which line is still true, and which is not?',
     explain:'(x ∈ A ∧ y ∈ C) ∨ (x ∈ B ∧ y ∈ D) implies (x ∈ A ∨ x ∈ B) ∧ (y ∈ C ∨ y ∈ D), but not the other way round: x ∈ A, y ∈ D satisfies the second and not the first. So the chain only proves R ⊆ L.',
     q:{q:'A = {1}, B = {2}, C = {3}, D = {4}. Which pair is in L but not in R?',opts:['(1, 4)','(1, 3)','(2, 4)','(3, 1)'],a:0,why:'1 ∈ A ∪ B and 4 ∈ C ∪ D, so (1, 4) ∈ L. But (1, 4) ∉ A × C (4 ∉ C) and ∉ B × D (1 ∉ B).'}}]},
  {id:'set_s2',title:'Reverse the arrows',ru:'Разверни стрелки',type:'mc',kind:'book problem',book:'Problem 4.16, p. 124',lab:['arrows'],
   brief:'R⁻¹ is R with every arrow reversed: b R⁻¹ a iff a R b. Out-arrows of R become in-arrows of R⁻¹. Fill the book’s table.',
   lesson:'Reversing arrows swaps “out” and “in”: total (≥ 1 out) ↔ surjection (≥ 1 in), function (≤ 1 out) ↔ injection (≤ 1 in), bijection ↔ bijection.',
   opts:['total','a function','a surjection','an injection','a bijection'],
   qs:[
    {q:'R is total iff R⁻¹ is …',a:2,why:'Total: every a has ≥ 1 arrow OUT. Reversed, every a has ≥ 1 arrow IN: R⁻¹ is a surjection (the book’s example).'},
    {q:'R is a function iff R⁻¹ is …',a:3,why:'Function: ≤ 1 arrow out of each a. Reversed: ≤ 1 arrow into each a — an injection.'},
    {q:'R is a surjection iff R⁻¹ is …',a:0,why:'Surjection: every b has ≥ 1 arrow in. Reversed: every b has ≥ 1 arrow out — R⁻¹ is total.'},
    {q:'R is an injection iff R⁻¹ is …',a:1,why:'Injection: ≤ 1 arrow into each b. Reversed: ≤ 1 arrow out of each b — R⁻¹ is a function.'},
    {q:'R is a bijection iff R⁻¹ is …',a:4,why:'A bijection is exactly one arrow out of each a and exactly one into each b. Reversing keeps “exactly one” on both sides.'}]},

ind:[
  {id:'ind_s1',title:'Bill’s courtyard',ru:'Двор с памятником Биллу',type:'stages',kind:'book story',book:'§5.1.5, pp. 141–144',lab:['dominoes'],
   brief:'A 2ⁿ × 2ⁿ courtyard must be covered with L-shaped tiles, leaving one central square for a statue of Bill. Tile it yourself, see why the obvious induction gets stuck, then watch the stronger claim do the work.',
   lesson:'If the inductive step is stuck, try a STRONGER hypothesis: “Bill anywhere” instead of “Bill in the centre”. The stronger P(n) gives you more to use in the step — and the original theorem is a special case.',
   stages:[
    {type:'courtyard',tag:'Tile it · n = 2',n:2,bill:[1,1]},
    {type:'mc',tag:'The doomed attempt',qs:[
     {q:'P(n) ::= “there is a tiling of the 2ⁿ × 2ⁿ courtyard with Bill in the centre”. Why does the inductive step get stuck?',opts:['Split the 2ⁿ⁺¹ courtyard into four 2ⁿ quarters: none of them has Bill in ITS centre, so P(n) says nothing about them','The base case P(0) is false','4ⁿ⁺¹ − 1 is not divisible by 3','L-tiles cannot be rotated'],a:0,
      why:'Bill sits in a corner of one quarter, and the other quarters have no Bill at all. P(n) only talks about courtyards with Bill in the centre, so it cannot be applied to the quarters.'},
     {q:'What does the book do instead?',opts:['Strengthen P(n): for EVERY position of Bill there is a tiling of the rest','Weaken P(n): only for n ≤ 3','Use strong induction with the same P(n)','Prove it by the WOP with the same P(n)'],a:0,
      why:'With “Bill anywhere”, each quarter becomes a smaller courtyard with exactly one occupied square — and P(n) applies to all four.'}]},
    {type:'courtyard',tag:'Watch the stronger claim · n = 3',n:3,mode:'auto',bill:[5,2]},
    {type:'input',tag:'Count',qs:[{q:'How many L-tiles cover a 2⁴ × 2⁴ = 16 × 16 courtyard (Bill takes one square)?',a:85,why:'(4⁴ − 1)/3 = 255/3 = 85.',hint:'Every tile covers 3 squares, and 16·16 − 1 squares are free.'}]}]},
  {id:'ind_s2',title:'The unstacking game',ru:'Игра в разборку стопки',type:'stages',kind:'book story',book:'§5.2.5, Th 5.2.1, pp. 151–152',lab:['dominoes'],
   brief:'A stack of 10 boxes. A move splits one stack into two stacks of heights a and b and scores a·b points. Play twice, with two different strategies, and compare.',
   lesson:'Every way of unstacking n boxes scores n(n − 1)/2. The proof is STRONG induction: the first split gives a and b with a + b = n + 1, and you need P(a) and P(b) for any smaller a, b.',
   stages:[
    {type:'stacking',tag:'Play · n = 10',n:10},
    {type:'input',tag:'Predict',qs:[{q:'What will you score for a stack of 20 boxes?',a:190,why:'n(n − 1)/2 = 20·19/2 = 190, whatever you do.',hint:'Your two games with 10 boxes both gave 45 = 10·9/2.'}]},
    {type:'mc',tag:'The proof',qs:[
     {q:'Which induction proves “every way of unstacking n boxes scores n(n − 1)/2”?',opts:['Strong induction: the first split makes stacks of sizes a and b, and the proof needs P(a) and P(b)','Ordinary induction from P(n) to P(n + 1)','No induction: just check n = 1, …, 10'],a:0,
      why:'a and b can be any sizes with a + b = n + 1, so the step needs P(k) for every k ≤ n: strong induction.'},
     {q:'In the step: ab + a(a − 1)/2 + b(b − 1)/2 equals …',opts:['(a + b)(a + b − 1)/2 = (n + 1)n/2','ab(a + b)','(a² + b²)/2','n²/2'],a:0,
      why:'ab + (a² − a + b² − b)/2 = ((a + b)² − (a + b))/2 = (n + 1)n/2. That is P(n + 1).'}]}]},
  {id:'ind_s3',title:'Horses and a missing 1',ru:'Лошади и пропавшая единица',type:'bughunt',kind:'find the bug',book:'§5.1.6 and Problem 5.7, pp. 145–146, 156–157',lab:['sumcheck','dominoes'],
   brief:'Two induction proofs of false theorems from the book. In both, the step quietly fails for one small n. Find the line.',
   lesson:'The step P(n) → P(n + 1) must work for EVERY n from the base on. Check the smallest n by hand: “…” and “the remaining terms” hide the cases where nothing remains.',
   rounds:[
    {src:'§5.1.6 · False Theorem 5.1.3',claim:'False theorem: in every set of n ≥ 1 horses, all the horses are the same colour.',
     lines:['Base case n = 1: in a set of one horse, the horse has the same colour as itself.','Inductive step: assume P(n) for some n ≥ 1, and take n + 1 horses h₁, h₂, …, hₙ, hₙ₊₁.','By P(n), the first n horses h₁, …, hₙ are the same colour.','By P(n), the last n horses h₂, …, hₙ₊₁ are the same colour.','So h₁ is the same colour as the remaining horses besides hₙ₊₁, that is h₂, …, hₙ — and so is hₙ₊₁.','Hence all n + 1 horses are the same colour, and P(n + 1) holds.'],bug:[4],
     miss:{0:'The base case is true.',2:'This is a correct use of P(n): those are n horses.',3:'This is a correct use of P(n): those are n horses.'},
     hint:'Take n = 1: the horses are just h₁ and h₂. What are “the remaining horses”?',
     explain:'For n = 1 there are no “remaining horses” h₂, …, hₙ: the two groups {h₁} and {h₂} share nobody, so nothing links their colours. The step P(1) → P(2) fails, and the chain of dominoes breaks right after the first one.',
     q:{q:'A student says: “The mistake is that P(n) is false for n ≥ 2, and the proof assumes it.” Why gets this no credit?',opts:['Assuming P(n) is exactly what an inductive step does; the error is that the implication P(1) → P(2) is not proved','Because P(n) is actually true','Because the base case should be n = 0','Because the student should use strong induction'],a:0,
      why:'An inductive step proves P(n) → P(n + 1); it is allowed to assume P(n). The real gap is one specific n where that implication was not shown.'}},
    {src:'Problem 5.7',claim:'False theorem: for all n ≥ 0, 2 + 3 + 4 + ⋯ + n = n(n + 1)/2.',
     lines:['Let P(n) ::= 2 + 3 + 4 + ⋯ + n = n(n + 1)/2.','Base case: P(0) holds, since both sides equal 0 (a sum with no terms is 0).','Inductive step: suppose P(n) holds for some n ≥ 0.','2 + 3 + ⋯ + n + (n + 1) = [2 + 3 + ⋯ + n] + (n + 1)','= n(n + 1)/2 + (n + 1), by P(n)','= (n + 1)(n + 2)/2, so P(n + 1) holds. By induction, P(n) for all n ∈ ℕ.'],bug:[3],
     miss:{1:'Strictly speaking this is fine: for n = 0 the sum has no terms, so it is 0, and 0·1/2 = 0.',2:'Assuming P(n) for one n is how the step starts.',4:'Given the line above, this is just P(n).',5:'The algebra is right.'},
     hint:'Run the step with n = 0. Which terms does the sum 2 + 3 + ⋯ + (n + 1) have when n + 1 = 1?',
     explain:'For n = 0 the left side is “2 + ⋯ + 1”, a sum with NO terms, so it equals 0 — not [2 + ⋯ + 0] + 1 = 1. The splitting step is false for n = 0, so P(0) → P(1) is not proved. Indeed P(1) says 0 = 1.',
     lab:['sumcheck',{f:6}]},
   ]},

str:[
  {id:'str_s1',title:'Bad definitions',ru:'Плохие определения',type:'mc',kind:'book story',book:'§7.3.2, pp. 226–227',lab:['collatz','recmatch'],
   brief:'Four function “definitions” from the book that look fine and are not. For each, say what goes wrong. The lab lets you unfold each one.',
   lesson:'A recursive definition is good when it follows the recursive structure of the data type: base cases, and every recursive call on an argument built EARLIER. No base, calls that go up, overlapping cases — each breaks uniqueness or existence.',
   qs:[
    {q:'f1(n) ::= 2 + f1(n − 1). What is wrong?',opts:['No base case: f1(n) = 2n + c works for EVERY constant c, so f1 is not uniquely defined','It is inconsistent','Nothing: f1(n) = 2n','It is undefined only at 0'],a:0,lab:['collatz',{f:'f1'}],why:'If some f1 satisfies the equation, so does f1 + c. Nothing pins down the value.'},
    {q:'f2(n) ::= 0 if n = 0, and f2(n + 1) otherwise. What is wrong?',opts:['The calls go UP: any function that is 0 at 0 and constant elsewhere fits, and evaluation never ends','It has no base case','It is inconsistent at n = 6','Nothing: f2 is constantly 0'],a:0,lab:['collatz',{f:'f2'}],why:'f2(1) = f2(2) = f2(3) = … never reaches the base case. As a program, it is undefined everywhere except at 0.'},

    {q:'f4(n) ::= 1 if n ≤ 1;  f4(n/2) if n > 1 is even;  f4(3n + 1) if n > 1 is odd (Collatz). What is the honest status?',opts:['The constant 1 satisfies it, but nobody knows whether it is the ONLY such function: the odd case calls a larger argument','It is inconsistent','It has no base case','It is a perfectly good recursive definition on ℕ'],a:0,lab:['collatz',{f:'f4',n:27}],why:'Because 3n + 1 > n, induction on ℕ cannot justify the definition. It has been checked up to over 10¹⁸, but not proved.'}]},
