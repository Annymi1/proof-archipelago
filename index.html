<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#d6e5ee">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1826">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Proofs">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Proof Archipelago</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Onest:wght@500;700;800&family=Golos+Text:wght@400;700&display=swap">
<style>
/* Layout: a sea chart. Map view = five chapter islands on one voyage route; island view = a trail of level nodes;
   level view = a play board with hearts, an instruction card and live feedback. Island colours follow the chapter tabs. */
:root{
  --sea:#d6e5ee; --sea-line:#c1d5e1; --paper:#fbfcfc; --ink:#13213a; --pencil:#556378; --rule:#d0dae3;
  --accent:#1e5bd0; --on-accent:#ffffff; --accent-soft:#e0e9fb;
  --good:#13804a; --good-soft:#dcf1e4; --bad:#c2372c; --bad-soft:#f9e1de; --gold:#c98f0a; --heart:#d93a52;
  --i-ind:#e9785f; --i-ind-s:#fbe3dc; --i-mac:#dda722; --i-mac-s:#f8edc9; --i-rit:#ec8636; --i-rit-s:#fbe4cf;
  --i-str:#4b9fd4; --i-str-s:#dbeefa; --i-inf:#8a72d0; --i-inf-s:#e9e3f8; --i-skl:#2a9a8a; --i-skl-s:#d6f0eb;
  --i-prf:#d4609a; --i-prf-s:#f9e0ec; --i-wop:#4f9f45; --i-wop-s:#dff0da; --i-lgc:#8a9a1e; --i-lgc-s:#eef2d0; --i-set:#a8743f; --i-set-s:#f3e6d6;
  --sq-a:#d9e3fa; --sq-b:#f6eac6; --water:#4f8fdc; --glass:#eef3f9;
  --f-disp:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sea:#0d1826; --sea-line:#16263b; --paper:#16212f; --ink:#e7edf5; --pencil:#9cadc4; --rule:#27364c;
    --accent:#7ea6ff; --on-accent:#0c1430; --accent-soft:#1f2b48;
    --good:#58cf8c; --good-soft:#143224; --bad:#ff7d72; --bad-soft:#3b1d1c; --gold:#f3c34f; --heart:#ff6f86;
    --i-ind:#f08f78; --i-ind-s:#3a2420; --i-mac:#eec04e; --i-mac-s:#352c14; --i-rit:#f6a15a; --i-rit-s:#3a2716;
    --i-str:#6cb8ea; --i-str-s:#14303f; --i-inf:#a593ea; --i-inf-s:#272240; --i-skl:#4cc3b2; --i-skl-s:#12302c;
    --i-prf:#ef8dbb; --i-prf-s:#3a1e2c; --i-wop:#79c46c; --i-wop-s:#183018; --i-lgc:#b9c94a; --i-lgc-s:#2a2f12; --i-set:#d19c66; --i-set-s:#33261a;
    --sq-a:#25304d; --sq-b:#3a321e; --water:#3f80cc; --glass:#1f2633;
    color-scheme:dark;
  }
}
/* Russian: Bricolage Grotesque and Atkinson Hyperlegible have no Cyrillic letters, so a Russian page would mix them with
   whatever the device has. In Russian the whole text uses a pair that covers both alphabets (loaded only when needed). */
:root:lang(ru){
  --f-disp:"Onest","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-theme="dark"]{
  --sea:#0d1826; --sea-line:#16263b; --paper:#16212f; --ink:#e7edf5; --pencil:#9cadc4; --rule:#27364c;
  --accent:#7ea6ff; --on-accent:#0c1430; --accent-soft:#1f2b48;
  --good:#58cf8c; --good-soft:#143224; --bad:#ff7d72; --bad-soft:#3b1d1c; --gold:#f3c34f; --heart:#ff6f86;
  --i-ind:#f08f78; --i-ind-s:#3a2420; --i-mac:#eec04e; --i-mac-s:#352c14; --i-rit:#f6a15a; --i-rit-s:#3a2716;
  --i-str:#6cb8ea; --i-str-s:#14303f; --i-inf:#a593ea; --i-inf-s:#272240; --i-skl:#4cc3b2; --i-skl-s:#12302c;
  --i-prf:#ef8dbb; --i-prf-s:#3a1e2c; --i-wop:#79c46c; --i-wop-s:#183018; --i-lgc:#b9c94a; --i-lgc-s:#2a2f12; --i-set:#d19c66; --i-set-s:#33261a;
  --sq-a:#25304d; --sq-b:#3a321e; --water:#3f80cc; --glass:#1f2633;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--sea);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.5;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;margin-bottom:14px}
.brand h1{font-family:var(--f-disp);font-weight:800;font-size:clamp(28px,5vw,42px);line-height:1;margin:0;letter-spacing:-.02em}
.brand p{margin:6px 0 0;color:var(--pencil);font-size:14px}
.hdr-r{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.score{display:flex;gap:14px;font-family:var(--f-disp);font-weight:700;font-size:18px;align-items:center}
.score .star{color:var(--gold)}
.ru{color:var(--pencil);font-size:.88em}
p.ru{margin:3px 0 0}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:18px clamp(14px,2.6vw,26px)}
.btn{font:inherit;font-size:14.5px;color:var(--ink);background:var(--paper);border:1.5px solid var(--rule);border-radius:10px;padding:8px 14px;cursor:pointer;line-height:1.25;text-align:left;touch-action:manipulation}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.ok{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:700}
.btn.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.btn.sel{border-color:var(--accent);background:var(--accent-soft)}
.btn:focus-visible,select:focus-visible,input:focus-visible,.isl:focus-visible,.node:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.col{display:grid;gap:8px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
input[type=number],input[type=text],select{font:inherit;font-family:var(--f-mono);padding:7px 10px;border:1.5px solid var(--rule);border-radius:9px;background:var(--paper);color:var(--ink)}
input[type=number]{width:6em}

/* map */
.sea{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--sea-line);background:var(--sea)}
.sea svg{display:block;width:100%;height:auto}
.wave{fill:none;stroke:var(--sea-line);stroke-width:2}
.route{fill:none;stroke:var(--pencil);stroke-width:2.5;stroke-dasharray:2 9;stroke-linecap:round;opacity:.7}
.isl{cursor:pointer}
.isl .land{stroke:var(--ink);stroke-width:2.2}
.isl:hover .land{stroke-width:3.4}
.isl .ring{fill:none;stroke:var(--ink);stroke-width:1;opacity:.25}
.isl-name{font-family:var(--f-disp);font-weight:800;font-size:22px;fill:var(--ink)}
.isl-sub{font-family:var(--f-mono);font-size:12px;fill:var(--pencil)}
.isl-stars{font-family:var(--f-disp);font-weight:700;font-size:15px;fill:var(--ink)}
.ship{fill:var(--paper);stroke:var(--ink);stroke-width:2}
.legend-list{display:grid;gap:8px;margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.legend-list button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border-left:6px solid var(--ic)}
.legend-list .t{font-family:var(--f-disp);font-weight:700;font-size:16px}
.tip{margin-top:14px;font-size:14px}
.reset{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--pencil)}

/* island */
.band{border-radius:16px;padding:18px clamp(14px,2.6vw,26px);background:var(--ics);border:1.5px solid var(--ic);margin-bottom:16px}
.band h2{font-family:var(--f-disp);font-weight:800;font-size:clamp(26px,4.4vw,36px);margin:0;line-height:1.05;letter-spacing:-.01em}
.band .ch{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--pencil);margin-bottom:4px}
.trail{list-style:none;margin:0;padding:0;display:grid;gap:12px;position:relative}
.trail::before{content:"";position:absolute;left:35px;top:20px;bottom:20px;border-left:3px dotted var(--pencil);opacity:.5}
.node{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;background:var(--paper);border:1.5px solid var(--rule);border-radius:14px;padding:10px 14px 10px 10px;font:inherit;color:var(--ink);text-align:left;cursor:pointer;position:relative}
.node:hover:not(:disabled){border-color:var(--ic)}
.node:disabled{cursor:not-allowed;opacity:.55}
.node .num{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:19px;background:var(--ics);border:2px solid var(--ic);margin-left:4px}
.node.boss .num{border-radius:12px;background:var(--ic);color:var(--paper)}
.node .tt{font-family:var(--f-disp);font-weight:700;font-size:18px;line-height:1.15}
.node .meta{font-size:13px;color:var(--pencil)}
.stars{font-size:18px;letter-spacing:2px;color:var(--rule);white-space:nowrap}
.stars b{color:var(--gold);font-weight:400}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;padding:1px 7px;border-radius:99px;background:var(--bad-soft);color:var(--bad);margin-left:6px;vertical-align:middle}

/* level */
.lvbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}
.lvbar h2{font-family:var(--f-disp);font-weight:800;font-size:clamp(22px,3.6vw,30px);margin:0;line-height:1.1}
.hearts{font-size:24px;letter-spacing:3px;color:var(--heart)}
.hearts .lost{color:var(--rule)}
.brief{background:var(--ics);border:1.5px solid var(--ic);border-radius:14px;padding:12px 16px;margin-bottom:14px}
.brief p{margin:0}
.stage-tag{font-family:var(--f-mono);font-size:12px;color:var(--pencil);margin-bottom:8px}
.feedback{min-height:1.6em;margin-top:12px;padding:10px 14px;border-radius:10px;font-size:14.5px}
.feedback:empty{display:none}
.feedback.bad{background:var(--bad-soft);color:var(--ink);border-left:5px solid var(--bad)}
.feedback.good{background:var(--good-soft);color:var(--ink);border-left:5px solid var(--good)}
.feedback.info{background:var(--accent-soft);color:var(--ink);border-left:5px solid var(--accent)}
.feedback.hint{background:var(--paper);color:var(--ink);border:1.5px solid var(--gold);border-left:5px solid var(--gold)}
.lvtools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.hintb{border-color:var(--gold)}
.hl{outline:3px solid var(--gold)!important;outline-offset:2px}
.side-h{font-family:var(--f-disp);font-weight:800;font-size:20px;margin:26px 0 2px}
.side-p{margin:0 0 10px;color:var(--pencil);font-size:14px}
.tag.side{background:var(--i-mac-s);color:var(--ink)}
.node.side .num{border-style:dashed}
.labsub{display:block;font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--pencil)}
.labgo{margin-top:8px}
.q{font-size:17px;font-weight:700;margin:0 0 4px}
.opts{display:grid;gap:8px;margin-top:12px}
.why{margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--good-soft);font-size:14.5px}
.fig{margin:8px 0}
.fig svg{display:block;max-width:100%;height:auto}
.proof{counter-reset:ln;display:grid;gap:6px;margin:0;padding:0;list-style:none}
.proof li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start;padding:8px 10px;border-radius:9px;background:var(--good-soft);font-size:14.5px}
.proof li::before{counter-increment:ln;content:counter(ln);font-family:var(--f-mono);color:var(--good);font-weight:600}
.proof li.empty{background:transparent;border:1.5px dashed var(--rule);color:var(--pencil)}
.proof .rsn{display:block;font-family:var(--f-mono);font-size:12.5px;color:var(--good);margin-top:2px}
.pool{display:grid;gap:8px}
.reasons{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.reasons .btn{font-family:var(--f-mono);font-size:13px;padding:6px 10px}
.two{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.h3{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--pencil);margin:0 0 8px}
.result{text-align:left}
.result .big{font-family:var(--f-disp);font-weight:800;font-size:clamp(28px,5vw,40px);margin:0;line-height:1.05}
.result .stars{font-size:38px}
.lesson{margin-top:12px;padding:12px 16px;border-radius:12px;background:var(--accent-soft)}
.lesson b{color:var(--accent)}

/* custom boards */
.board svg{display:block;width:100%;max-width:420px;height:auto}
.sq{stroke:var(--rule);stroke-width:1}
.sq.plain{fill:var(--paper)} .sq.even{fill:var(--sq-a)} .sq.odd{fill:var(--sq-b)}
.robot-body{fill:var(--accent);stroke:var(--ink);stroke-width:1.5}
.robot-eye{fill:var(--on-accent)}
.tgt{fill:none;stroke-width:2.5}
.tgt.open{stroke:var(--bad)} .tgt.done{stroke:var(--good)}
.tgt-t{font-family:var(--f-disp);font-weight:800;font-size:15px}
.tgt-t.open{fill:var(--bad)} .tgt-t.done{fill:var(--good)}
.svg-m{fill:var(--pencil);font-family:var(--f-mono);font-size:11px}
.svg-b{fill:var(--ink);font-family:var(--f-mono);font-size:14px;font-weight:600}
.svg-t{fill:var(--ink);font-family:var(--f-body);font-size:13px}
.jug-glass{fill:var(--glass);stroke:var(--ink);stroke-width:2}
.jug-water{fill:var(--water)}
.amounts{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.amt{border:1.5px solid var(--rule);border-radius:12px;padding:10px;background:var(--paper);display:grid;gap:6px;align-content:start;min-height:96px}
.amt .n{font-family:var(--f-disp);font-weight:800;font-size:24px;line-height:1}
.amt.done{border-color:var(--good);background:var(--good-soft)}
.amt.off{opacity:.55}
.amt.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.amt .btn{font-size:13px;padding:6px 9px}
.wcards{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.wcard{border:1.5px solid var(--rule);border-radius:12px;padding:10px 12px;background:var(--paper);display:grid;gap:6px}
.wcard.need{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.wcard .nm{font-family:var(--f-disp);font-weight:800;font-size:18px}
.chip{display:inline-block;font-family:var(--f-mono);font-size:12.5px;padding:2px 8px;border-radius:7px;background:var(--sea);border:1px solid var(--rule);margin:0 3px 3px 0}
.chip.x{text-decoration:line-through;opacity:.5}
.chip.keep{background:var(--good-soft);border-color:var(--good)}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th,table.t td{border-bottom:1px solid var(--rule);padding:5px 8px;text-align:left;vertical-align:top}
table.t th{font-size:12px;color:var(--pencil);font-weight:600}
.scroll{overflow-x:auto}
.mline{stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.matchsvg{display:block;width:100%;max-width:520px;height:auto;margin:0 auto}
.pname{cursor:pointer}
.pname rect{fill:var(--paper);stroke:var(--ink);stroke-width:1.5}
.pname.sel rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:3}
.stone{fill:var(--pencil);stroke:var(--ink);stroke-width:1;cursor:pointer}
.stone:hover{fill:var(--bad)}
.stone-hit{fill:transparent;cursor:pointer}
.nimsvg{display:block;width:100%;height:auto}
.stone.hint{fill:var(--bad-soft);stroke:var(--bad);stroke-width:2}
.bitc{fill:var(--paper);stroke:var(--rule);cursor:default}
.bitc.dg{stroke:var(--accent);stroke-width:2.5}
.bitc.d{fill:var(--good-soft);stroke:var(--good);cursor:pointer}
.bitc.dbad{fill:var(--bad-soft);stroke:var(--bad);cursor:pointer}
.arr{stroke:var(--ink);stroke-width:1.8;fill:none}
.mk{fill:var(--ink)}
.dot{fill:var(--paper);stroke:var(--ink);stroke-width:1.5}
/* write mode */
.keys{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:5px;padding:8px 0 10px;background:var(--paper);border-bottom:1px solid var(--rule);margin-bottom:12px}
.btn.key{font-family:var(--f-mono);font-size:16px;min-width:38px;padding:6px 8px;text-align:center}
.cloze{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.cl{margin:0;font-family:var(--f-mono);font-size:14px;line-height:2.1}
.gapw{display:inline;white-space:normal}
.gap{font-family:var(--f-mono);font-size:14px;padding:3px 7px;border:1.5px dashed var(--accent);border-radius:7px;background:var(--accent-soft);color:var(--ink);max-width:100%}
select.gap{font-family:var(--f-body);max-width:calc(100% - 2ch)}
.gapw.ok .gap{border:1.5px solid var(--good);background:var(--good-soft)}
.gapw.self .gap{border:1.5px solid var(--good);background:var(--good-soft);border-style:dashed}
.gapw.miss .gap{border:1.5px solid var(--bad);background:var(--bad-soft)}
.gapw.ask .gap{border:1.5px solid var(--gold)}
.model{display:inline;font-family:var(--f-mono);font-size:13px;color:var(--good);margin-left:6px}
.gapw.miss .model{color:var(--bad)}
.btn.mini{font-size:12px;padding:3px 8px;margin-left:4px}
.modelproof{margin-top:12px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--good);background:var(--paper)}
.modelproof p{margin:0 0 4px;font-family:var(--f-mono);font-size:13.5px}
.tag.write{background:var(--i-skl-s);color:var(--i-skl)}
/* truth tables, counter-models, Venn */
table.tt{border-collapse:separate;border-spacing:3px;font-family:var(--f-mono);font-size:13px;margin:4px 0}
table.tt th{font-size:12px;font-weight:600;color:var(--pencil);padding:2px 6px;vertical-align:bottom;text-align:center;max-width:9em}
table.tt td{text-align:center;padding:0}
table.tt .tv{font-weight:700;color:var(--ink);min-width:26px}
table.tt th.tv{color:var(--ink)}
table.tt .tg{color:var(--pencil);background:var(--sea);border-radius:6px;min-width:34px;height:32px}
.ttc{font:inherit;font-family:var(--f-mono);font-weight:700;font-size:14px;width:38px;height:32px;border:1.5px dashed var(--accent);border-radius:7px;background:var(--accent-soft);color:var(--ink);cursor:pointer;touch-action:manipulation}
.ttc[data-v="T"],.ttc[data-v="F"]{border-style:solid;background:var(--paper)}
.ttc[data-v="F"]{color:var(--pencil)}
.ttc.bad{border-color:var(--bad);background:var(--bad-soft)}
.ttc.ok{border-color:var(--good);background:var(--good-soft)}
.ttc:disabled{cursor:default}
.cmsel{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:10px}
.cmsel label{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cmt td:last-child{width:3em;text-align:center;font-weight:700}

  {id:'ind2',title:'Find the bug',ru:'Найди ошибку',type:'mc',
   brief:'Each “proof” below is broken. Pick the real problem.',
   lesson:'An induction proof needs a true base case that matches the claim, and a step that works for every n from the base on, including the smallest one.',
   qs:[
    {q:'“All horses have the same colour.” Step: from n + 1 horses remove the first → n horses, same colour (IH); remove the last → same colour (IH); the groups overlap, so all n + 1 have one colour. Where is the bug?',
     opts:['The base case n = 1 is false','The step fails for n = 1: the groups {h₁} and {h₂} do not overlap','You may not use the IH twice','Horses cannot be counted'],a:1,
     why:'For n + 1 = 2 each group has one horse and they share nobody, so nothing links the two colours. The step has to work for every n ≥ base.'},
    {q:'Claim: n² + n + 1 is even for every n ∈ ℕ. Step: if n² + n + 1 is even, then (n+1)² + (n+1) + 1 = (n² + n + 1) + 2(n + 1) is even. What is wrong?',
     opts:['Nothing, it is a valid proof','The algebra in the step is wrong','There is no base case, and P(0) is false: 1 is odd','It needs strong induction'],a:2,
     why:'The step is correct, but a step without a true base proves nothing. In fact n² + n + 1 = n(n + 1) + 1 is always odd.'},
    {q:'Strong induction: base P(0); step: P(n + 1) is proved from P(n − 1) for every n ≥ 1. What is missing?',
     opts:['Nothing','A base case P(1): from P(0) the step only reaches 2, 4, 6, …','The IH must be P(n) only','The claim must start at 1'],a:1,
     why:'Every step jumps by 2. From P(0) you reach only even numbers, so P(1) needs its own base case.'},
    {q:'“Assume P(n) holds for all n ∈ ℕ. Then P(n + 1) holds, so the claim is proved.” What is wrong?',
     opts:['The IH is the claim itself — circular','Nothing','It should say n ≥ 1','It should use WOP'],a:0,
     why:'The IH is P(n) for one fixed n. Assuming it for all n assumes what you want to prove.'},
   ]},
  {id:'ind3',title:'Ordinary or strong?',ru:'Обычная или сильная?',type:'mc',
   brief:'For each claim: is the previous case P(n) enough, or does P(n + 1) need cases further back?',
   lesson:'Strong induction is the same proof with a bigger IH: P(0), …, P(n). Use it when n + 1 depends on n − 3, on two previous values, or on factors of n + 1.',
   opts:['ordinary is enough','needs strong'],
   qs:[
    {q:'Σᵢ₌₁ⁿ i = n(n + 1)/2',a:0,why:'Σ up to n + 1 = Σ up to n + (n + 1): only P(n) is used.'},
    {q:'Every n ≥ 12 is 4a + 5b, proved the stamp way: n + 1 = (n − 3) + 4',a:1,why:'This proof builds n + 1 from n − 3, so it uses P(n − 3), not P(n): strong induction with base cases 12–15. (A step from P(n) alone exists too: swap a 4 for a 5, or three 5s for four 4s.)'},
    {q:'Every n ≥ 2 is a product of primes',a:1,why:'If n + 1 = a·b, you need P(a) and P(b) for smaller a, b — any of them.'},
    {q:'2ⁿ ≥ n + 1',a:0,why:'2ⁿ⁺¹ = 2·2ⁿ ≥ 2(n + 1) ≥ n + 2 uses only P(n).'},
    {q:'Fibonacci: F(n) < 2ⁿ',a:1,why:'F(n + 1) = F(n) + F(n − 1) needs the two previous cases.'},
    {q:'3 divides n³ + 2n',a:0,why:'(n+1)³ + 2(n+1) = (n³ + 2n) + 3(n² + n + 1): only P(n).'},
   ]},
  {id:'ind4',title:'Boss: the doubling sum',ru:'Босс: сумма степеней двойки',type:'order',boss:true,
   brief:'Build the proof of Σₖ₌₀ⁿ 2ᵏ = 2ⁿ⁺¹ − 1 for all n ∈ ℕ. Click the lines in the right order; after a line with an equality, pick its reason. Some lines are traps.',
   lesson:'Method · predicate · base for the first n · IH marked · the step splits off the last term and uses the IH · conclusion with ∎.',
   lines:[
    {t:'Proof. By induction on n, with P(n) ::= Σₖ₌₀ⁿ 2ᵏ = 2ⁿ⁺¹ − 1.'},
    {t:'Base case n = 0: Σₖ₌₀⁰ 2ᵏ = 2⁰ = 1 and 2¹ − 1 = 1, so P(0) holds.'},
    {t:'Inductive step: let n ≥ 0 and assume P(n) (IH).'},
    {t:'Σₖ₌₀ⁿ⁺¹ 2ᵏ = Σₖ₌₀ⁿ 2ᵏ + 2ⁿ⁺¹',r:'split off the last term'},
    {t:'= (2ⁿ⁺¹ − 1) + 2ⁿ⁺¹',r:'by the IH'},
    {t:'= 2·2ⁿ⁺¹ − 1 = 2ⁿ⁺² − 1, so P(n + 1) holds.',r:'algebra'},
    {t:'By induction, P(n) holds for all n ∈ ℕ. ∎'},
   ],
   distractors:[
    {t:'Assume P(n) holds for all n ∈ ℕ.',why:'That is the claim itself (circular). The IH is P(n) for one fixed n.'},
    {t:'Base case n = 1: 1 + 2 = 3 = 2² − 1.',why:'The claim starts at n = 0, so the base case is n = 0.'},
    {t:'Check n = 0, 1, 2, 3: it works, so it always works.',why:'Examples are not a proof.'},
   ],
   reasons:['split off the last term','by the IH','algebra','by WOP','by definition of P']},
]},

{id:'mac',name:'Invariant Harbor',ru:'Гавань инвариантов',ch:'Ch. 6.1–6.3 · State machines',c:'mac',x:470,y:210,levels:[
  {id:'mac1',title:'The bishop robot',ru:'Робот-слон',type:'robot',
   brief:'The robot moves only diagonally: (±1, ±1). Visit the targets A and B. One target can never be reached: declare it and choose the invariant that proves it.',
   lesson:'P ::= “m + n is even”. Every move changes m + n by +2, 0 or −2, P(0, 0) is true, so P holds in every reachable state. (1, 0) has m + n = 1, so it is unreachable.'},
  {id:'mac2',title:'Die Hard jugs',ru:'Кувшины',type:'jugs',
   brief:'Part 1: jugs of 5 l and 3 l. Get exactly 4 l in the big jug. Part 2: jugs of 18 l and 12 l. Can you get 4 l? If not, say why.',
   lesson:'New amounts are always sums and differences of old amounts and the jug sizes, so “gcd(a, b) divides both amounts” is preserved. gcd(5, 3) = 1 lets you reach 4; gcd(18, 12) = 6 never does.'},
  {id:'mac3',title:'Read the gauges',ru:'Производные величины',type:'mc',
   brief:'A derived variable is a number computed from the state. Classify each one: what does every possible move do to it? Pick the strongest property that holds.',
   lesson:'“none” needs one move up and one move down. ↑s, ↑w and const need algebra for every type of move. Termination needs an ℕ-valued strictly decreasing variable.',
   opts:['↑s strictly increasing','↑w weakly increasing','↓s strictly decreasing','↓w weakly decreasing','const','none'],
   qs:[
    {q:'Coins (h heads, t tails). Moves: flip x heads and y tails with x + y = 10; or, if h ≥ 1, add h + 1 tails. Variable C = h + t.',a:1,why:'Flip: (h − x + y) + (t + x − y) = h + t, no change. Add: up by h + 1. Never down, and not ↑s because flipping keeps it equal.'},
    {q:'Coins. Variable H = h.',a:5,why:'Flip 10 heads: h goes down by 10. Flip 10 tails: h goes up by 10.'},
    {q:'Coins. Variable H mod 2.',a:4,why:'Flip: new h = h + 2y − 10, the difference is even. Add: h unchanged. So the parity of h never changes.'},
    {q:'Coins. Variable C mod 2.',a:5,why:'Flip keeps C. Add changes C by h + 1: when h is even, the parity of C flips both ways (0 → 1 → 0).'},
    {q:'Euclid: (x, y) → (y, x mod y) while y > 0. Variable y.',a:2,why:'x mod y < y. This is the countdown that proves termination.'},
    {q:'Euclid. Variable x + y.',a:3,why:'y + (x mod y) ≤ y + x, but (12, 18) → (18, 12) keeps 30.'},
    {q:'Euclid. Variable x.',a:5,why:'(12, 18) → (18, 12) raises x; (48, 18) → (18, 12) lowers it.'},
    {q:'Piggy bank: start 0, moves +2 and +3. Variable n.',a:0,why:'Every move adds 2 or 3, both > 0.'},
   ]},
  {id:'mac4',title:'Boss: one lonely head',ru:'Босс: ровно один орёл',type:'order',boss:true,
   brief:'From (98 heads, 4 tails), with the moves “flip 10” and “add h + 1 tails”, prove that a state with exactly one head is not reachable.',
   lesson:'Invariant proof: name P · show every move type keeps P · P(start) · Invariant Principle · the target breaks P.',
   lines:[
    {t:'Let P((h, t)) ::= “h is even”.'},
    {t:'Flip x heads and y tails (x + y = 10): the new h is h − x + y = h + 2y − 10.',r:'def. of the move'},
    {t:'The difference 2y − 10 is even, so h keeps its parity.',r:'algebra'},
    {t:'Add h + 1 tails: h does not change.',r:'def. of the move'},
    {t:'So P is preserved, and P((98, 4)) is true because 98 is even.'},
    {t:'So P holds in every reachable state.',r:'Invariant Principle'},
    {t:'Exactly one head means h = 1, which is odd, so that state is not reachable. ∎'},
   ],
   distractors:[
    {t:'We tried 50 random moves and never got one head.',why:'Experiments are not a proof.'},
    {t:'H = h is strictly decreasing, so it can never reach 1.',why:'False: flipping 10 tails raises h. And decreasing would make 1 easier to reach.'},
    {t:'P is preserved because it holds in every reachable state.',why:'Circular: reachable states are what the Invariant Principle gives you at the end.'},
   ],
   reasons:['def. of the move','algebra','Invariant Principle','by the IH','by WOP']},
]},

{id:'str',name:'Recursion Reef',ru:'Риф рекурсии',ch:'Ch. 7 · Recursive data',c:'str',x:680,y:420,levels:[
  {id:'str1',title:'Unboxing',ru:'Распаковка строк',type:'mc',
   brief:'A string is ⟨a, s⟩ (a letter on the left of a smaller string) or λ. Pick the next rewriting step.',
   lesson:'Every rule eats the leftmost letter: ⟨a, s⟩ · t = ⟨a, s · t⟩ · |⟨a, s⟩| = 1 + |s| · f*(⟨a, s⟩) = ⟨f(a), f*(s)⟩.',
   qs:[
    {q:'⟨a, ⟨b, λ⟩⟩ · “c”: first step?',opts:['⟨a, ⟨b, λ⟩ · “c”⟩ — def. of ·','⟨b, ⟨a, λ⟩⟩ · “c”','“c” · ⟨a, ⟨b, λ⟩⟩','⟨a, ⟨b, “c”⟩⟩ in one jump'],a:0,why:'⟨a, s⟩ · t = ⟨a, s · t⟩: the left letter stays outside, · moves inside.'},
    {q:'⟨a, ⟨b, λ⟩ · “c”⟩: next?',opts:['⟨a, ⟨b, λ · “c”⟩⟩ — def. of ·','⟨a, ⟨b, λ⟩⟩ · “c”','⟨a, “c” · ⟨b, λ⟩⟩'],a:0,why:'Same rule on the inner ⟨b, λ⟩ · “c”.'},
    {q:'⟨a, ⟨b, λ · “c”⟩⟩: last step?',opts:['⟨a, ⟨b, “c”⟩⟩ = “abc” — λ · t = t','⟨a, ⟨b, λ⟩⟩ — t disappears','⟨a, ⟨b, ⟨c, λ⟩⟩⟩ · λ'],a:0,why:'Base rule of ·.'},
    {q:'|⟨a, ⟨b, λ⟩⟩|: first step?',opts:['1 + |⟨b, λ⟩|','|a| + |⟨b, λ⟩|','2','1 + 1'],a:0,why:'|⟨a, s⟩| = 1 + |s|. |a| is not defined: a is a letter, not a string.'},
    {q:'f(a) = 0, f(b) = 1. f*(⟨a, ⟨b, λ⟩⟩) = ?',opts:['⟨0, f*(⟨b, λ⟩)⟩','⟨f*(a), ⟨b, λ⟩⟩','f(⟨a, ⟨b, λ⟩⟩)','⟨0, ⟨b, λ⟩⟩'],a:0,why:'f* applies f to the first letter and recurses on the rest.'},
   ]},
  {id:'str2',title:'Which variable?',ru:'По какой переменной?',type:'mc',
   brief:'Before you write a structural induction, decide what to induct on and what you need. Includes the midterm trap with “if … then”.',
   lesson:'Induct on the variable the definitions recurse on. If the claim starts with “if s is in a recursively defined set”, induct on that set’s own constructors, and the “if” disappears.',
   qs:[
    {q:'(r · s) · t = r · (s · t). Induct on …',opts:['r','s','t','|t|'],a:0,why:'· recurses on its left argument; r is the leftmost string on both sides.'},
    {q:'Constructor case of |s · t| = |s| + |t|. Which line uses the IH?',opts:['1 + |s′ · t| = 1 + |s′| + |t|','|⟨a, s′⟩ · t| = |⟨a, s′ · t⟩|','|⟨a, s′ · t⟩| = 1 + |s′ · t|','1 + |s′| + |t| = |⟨a, s′⟩| + |t|'],a:0,why:'Every other line is a definition. Mark the IH line in the exam.'},
    {q:'rev(s · t) = rev(t) · rev(s). Which lemmas do you need first?',opts:['associativity of · and t · λ = t','rev(rev(s)) = s','|rev(s)| = |s|','none'],a:0,why:'Base: rev(t) = rev(t) · λ. Step: (rev(t) · rev(s′)) · ⟨a, λ⟩ must be regrouped.'},
    {q:'“If s ∈ RecMatch, then s has as many [ as ].” What do you induct on?',opts:['Structural induction on the definition of RecMatch: cases λ and [u]v','Structural induction on s ∈ A* with cases λ and ⟨a, s′⟩','Ordinary induction on the number of [','Nothing — it is obvious'],a:0,why:'The premise is itself recursively defined. Inducting on its constructors removes the “if”: in the case [u]v you get P(u) and P(v) as two IHs.'},

  {id:'str3',title:'Well-defined?',ru:'Корректно ли определение?',type:'mc',

   lesson:'Base case · every call on a smaller argument · stays in the domain · overlapping cases agree. And watch out: a product with base 0 is 0 forever.',

    {q:'p(0) = 0;  p(n) = p(n − 2) + 1 for n ≥ 1',a:3,why:'p(1) = p(−1) + 1, and −1 ∉ ℕ.'},

    {q:'F(0) = 0, F(1) = 1;  F(n) = F(n − 1) + F(n − 2) for n ≥ 2',a:0,why:'Two base cases, two smaller calls.'},

    {q:'a(0) = 0;  a(n + 1) = a(n)·(n + 1). (This one is about the values.) Is it well-defined?',opts:['✓ well-defined, but every value is 0','✗ not well-defined','✓ it is n!','✓ it is (n + 1)!'],a:0,why:'0 · anything = 0. The midterm trap: with base 0, all such product sequences are the same sequence 0, 0, 0, …'},

  {id:'str4',title:'Nim duel',ru:'Ним против компьютера',type:'nim',

  {id:'str5',title:'Boss: Ex1',ru:'Босс: Ex1',type:'stages',boss:true,
   brief:'Two structural induction proofs. Click lines in order and give a reason for every equality. The second one has an “if … then”, like on the midterm.',
   lesson:'Predicate · base λ · constructor with the IH marked · reasons on every line · conclusion. For “if s ∈ RecMatch”, induct on RecMatch’s constructors: two IHs for [u]v.',
   stages:[

     ],

     ],
     reasons:['def. of *','def. of ∘ and the IH','def. of g*, right to left','def. of f*, right to left','by the IH only','def. of ·']},
    {type:'order',tag:'Proof 2 · if s ∈ RecMatch, then #[(s) = #](s)',
     lines:[
      {t:'Proof. By structural induction on the definition of RecMatch, with P(s) ::= #[(s) = #](s).'},
      {t:'Base case s = λ: #[(λ) = 0 = #](λ), so P(λ) holds.'},

      {t:'Constructor case s = [u]v: assume P(u).',why:'[u]v has two parts, so you need the IH for both u and v.'},

{id:'inf',name:'Diagonal Deep',ru:'Диагональная бездна',ch:'Ch. 8 · Infinity & halting',c:'inf',x:260,y:430,levels:[
  {id:'inf1',title:'Arrow shapes',ru:'Стрелки: inj, surj, bij',type:'mc',

    {q:'The full DNF of P ↔ Q is …',opts:['(P ∧ Q) ∨ (¬P ∧ ¬Q)','(P ∨ Q) ∧ (¬P ∨ ¬Q)','(P ∧ ¬Q) ∨ (¬P ∧ Q)'],a:0,why:'One and-clause per T row: TT and FF. The other two describe P ⊕ Q.'},
    {q:'Course convention: the DNF of an unsatisfiable formula is …',opts:['F','T','it does not exist'],a:0,why:'There are no T rows, so no clauses: the empty disjunction is F.'},
    {q:'If SAT has a polynomial-time algorithm, then …',opts:['P = NP','SAT ∉ NP','nothing follows'],a:0,why:'Every NP problem reduces to SAT in polynomial time. Whether P = NP is still an open problem.'},
   ]},
  {id:'lgc4',title:'English → logic',ru:'Перевод на язык логики',type:'mc',
   brief:'Pick the formula that says exactly the same thing.',
   lesson:'“Q if P” = P → Q · “Q only if P” = Q → P · “All X are Y” = ∀x.(X → Y) · “Some X is Y” = ∃x.(X ∧ Y) · ∃∀ ⇒ ∀∃, not back.',
   qs:[
    {q:'“You may enter only if you have a ticket.” (E: enter, T: ticket)',opts:['E → T','T → E','E ↔ T','E ∧ T'],a:0,why:'“Q only if P” is Q → P: entering requires a ticket.'},
    {q:'“You may enter if you have a ticket.”',opts:['T → E','E → T','E ∨ T'],a:0,why:'“Q if P” is P → Q: a ticket is enough.'},
    {q:'“A ticket is necessary but not sufficient for entering.”',opts:['(E → T) ∧ ¬(T → E)','(T → E) ∧ ¬(E → T)','¬(E ↔ T)'],a:0,why:'Necessary: E → T. Not sufficient: not (T → E).'},
    {q:'“All X are Y.”',opts:['∀x.(X(x) → Y(x))','∀x.(X(x) ∧ Y(x))','∃x.(X(x) → Y(x))'],a:0,why:'With ∧ it would say that everything is both X and Y.'},
    {q:'“Some X is Y.”',opts:['∃x.(X(x) ∧ Y(x))','∃x.(X(x) → Y(x))','∀x.(X(x) → Y(x))'],a:0,why:'With → any x that is not X makes it true, so it says almost nothing.'},
    {q:'“No X is Y.”',opts:['∀x.(X(x) → ¬Y(x))','∀x.(¬X(x) → Y(x))','∃x.(X(x) ∧ ¬Y(x))'],a:0,why:'Every X fails to be Y.'},
    {q:'“Everyone has some dream.” (dreams(p, d))',opts:['∀p ∃d. dreams(p, d)','∃d ∀p. dreams(p, d)'],a:0,why:'∃d ∀p says that one dream is shared by all. The order of quantifiers matters.'},
    {q:'“If you can solve any one of the exercises, you pass.”',opts:['(∃x. solve(x)) → pass','(∀x. solve(x)) → pass','∀x.(solve(x) ∧ pass)'],a:0,why:'Here “any one” means “at least one”: solving one exercise is enough. A bare “any” can also mean “every”, so check which one is meant.'},
    {q:'“No lecture was attended by all students.” (A(s, l): s attended l)',opts:['∀l ∃s. ¬A(s, l)','∃l ∀s. ¬A(s, l)','∀l ∀s. ¬A(s, l)'],a:0,why:'¬∃l ∀s. A(s, l), then push ¬ inside: flip each quantifier, negate the body.'},
   ]},
  {id:'lgc5',title:'Counter-model lab',ru:'Лаборатория контрмоделей',type:'cmodel',
   brief:'Domain ℕ. Choose what P and Q mean, then evaluate. Goal: make the whole formula FALSE — that is a counter-model. If no choice can do it, the formula is valid: say so.',
   lesson:'Counter-model for α → β: make α true and β false. Simple predicates on ℕ (even/odd, x = 0, x < y) are almost always enough. ∀ does not distribute over ∨, ∃ not over ∧; ∃y∀x ⇒ ∀x∃y is valid, the converse is not.',
   rounds:[
    {f:'∀x.(P(x) ∨ Q(x))  →  (∀x.P(x)) ∨ (∀x.Q(x))',kind:1,
     parts:(P,Q)=>[['hypothesis  ∀x.(P(x) ∨ Q(x))',AL(x=>P(x)||Q(x))],['conclusion  (∀x.P(x)) ∨ (∀x.Q(x))',AL(P)||AL(Q)]],whole:v=>IMP(v[0],v[1]),
     hint:'Let P and Q split ℕ between them, so that neither holds everywhere.',
     why:'P = even, Q = odd: every x is even or odd (T), but neither ∀x.P nor ∀x.Q holds (F). ∀ does not distribute over ∨.'},
    {f:'(∀x.(P(x) → Q(x)))  ∨  (∀x.(Q(x) → P(x)))',kind:1,
     parts:(P,Q)=>[['left  ∀x.(P(x) → Q(x))',AL(x=>IMP(P(x),Q(x)))],['right  ∀x.(Q(x) → P(x))',AL(x=>IMP(Q(x),P(x)))]],whole:v=>v[0]||v[1],
     hint:'You need one x with P but not Q, and another x with Q but not P.',
     why:'P = even, Q = odd: x = 0 breaks P → Q and x = 1 breaks Q → P. (Midterm 2024, 4.4: “has a counter-model” is TRUE. With ∀ outside the whole disjunction it would be valid.)'},
    {f:'∃x.(P(x) ∧ Q(x))  →  (∃x.P(x)) ∧ (∃x.Q(x))',kind:1,valid:true,
     parts:(P,Q)=>[['hypothesis  ∃x.(P(x) ∧ Q(x))',EX(x=>P(x)&&Q(x))],['conclusion  (∃x.P(x)) ∧ (∃x.Q(x))',EX(P)&&EX(Q)]],whole:v=>IMP(v[0],v[1]),
     why:'Valid: a witness x₀ with P(x₀) ∧ Q(x₀) is a witness for ∃x.P and for ∃x.Q at once. No interpretation can break it.'},
    {f:'(∃x.P(x)) ∧ (∃x.Q(x))  →  ∃x.(P(x) ∧ Q(x))',kind:1,
     parts:(P,Q)=>[['hypothesis  (∃x.P(x)) ∧ (∃x.Q(x))',EX(P)&&EX(Q)],['conclusion  ∃x.(P(x) ∧ Q(x))',EX(x=>P(x)&&Q(x))]],whole:v=>IMP(v[0],v[1]),
     hint:'The two witnesses may be different numbers.',
     why:'P = (x = 0), Q = (x > 0): each has a witness, but no single x has both. ∃ does not distribute over ∧ — this is the converse of the previous one.'},
    {f:'(∀x ∃y. P(x, y))  →  (∃y ∀x. P(x, y))',kind:2,
     parts:P=>[['hypothesis  ∀x ∃y. P(x, y)',P[0]],['conclusion  ∃y ∀x. P(x, y)',P[1]]],whole:v=>IMP(v[0],v[1]),
     hint:'Let y depend on x — something like “y is bigger than x”.',
     why:'P(x, y) ::= x < y: every x has a bigger y (T), but no single y is bigger than every x (F).'},
    {f:'(∃y ∀x. P(x, y))  →  (∀x ∃y. P(x, y))',kind:2,valid:true,
     parts:P=>[['hypothesis  ∃y ∀x. P(x, y)',P[1]],['conclusion  ∀x ∃y. P(x, y)',P[0]]],whole:v=>IMP(v[0],v[1]),
     why:'Valid: if one y₀ works for every x, then for each x just take y = y₀.'},
   ]},
  {id:'lgc6',title:'Boss: Ex2 2024',ru:'Босс: Ex2 мидтерма 2024',type:'stages',boss:true,tag:'midterm 2024',
   brief:'Ex2.1: prove that (P → Q) → ((P → R) → (P → (Q ∧ R))) is valid. Ex2.2: show that ((P → Q) → (P → R)) → (P → (Q ∧ R)) is not valid.',
   lesson:'Valid: cases on a key variable (or a table), true in every case, “the cases are exhaustive”. Not valid: ONE falsifying assignment, evaluated explicitly.',
   stages:[
    {type:'order',tag:'Ex2.1 · valid by cases',
     lines:[
      {t:'Proof. By cases on P, then on Q.'},
      {t:'Case P = F: every implication with hypothesis P is true, so the formula is T → (T → T) = T.',r:'false hypothesis ⇒ implication true'},
      {t:'Case P = T, Q = F: P → Q = F, so the main implication has a false hypothesis and is T.',r:'false hypothesis ⇒ implication true'},
      {t:'Case P = T, Q = T: P → R has the value of R, and P → (Q ∧ R) has the value of R; the formula is T → (R → R) = T.',r:'T → X has the value of X'},
      {t:'The cases are exhaustive and in each the formula is true, so it is valid. ∎'},
     ],
     distractors:[
      {t:'Take P = Q = R = T: the formula is true, so it is valid.',why:'One satisfying assignment only shows SATISFIABLE. Valid needs every assignment.'},
      {t:'Case P = F: then P → Q is false.',why:'With P = F, P → Q is TRUE: a false hypothesis.'},
     ],
     reasons:['false hypothesis ⇒ implication true','T → X has the value of X','De Morgan','by the WOP']},
    {type:'ttable',tag:'Ex2.2 · the table',rounds:[
     {f:'((P → Q) → (P → R)) → (P → (Q ∧ R))',vars:['P','Q','R'],cols:[
      {t:'P → Q',f:(P,Q,R)=>IMP(P,Q),given:true},{t:'P → R',f:(P,Q,R)=>IMP(P,R),given:true},{t:'Q ∧ R',f:(P,Q,R)=>Q&&R,given:true},
      {t:'(P→Q) → (P→R)',f:(P,Q,R)=>IMP(IMP(P,Q),IMP(P,R))},{t:'P → (Q∧R)',f:(P,Q,R)=>IMP(P,Q&&R)},{t:'whole',f:(P,Q,R)=>IMP(IMP(IMP(P,Q),IMP(P,R)),IMP(P,Q&&R))}]}]},
    {type:'mc',tag:'Ex2.2 · what you write',qs:[
     {q:'Ex2.2 is worth 1 point. What do you write?',opts:['P = T, Q = F, R arbitrary: P → Q = F, so (P → Q) → (P → R) = T; Q ∧ R = F, so P → (Q ∧ R) = F; the formula is T → F = F — not valid.','“The table is too big, but it is clearly not valid.”','“It is not valid, because Ex2.1 is valid.”'],a:0,why:'One falsifying assignment, and every subformula evaluated. That is the whole answer.'}]},
   ]},
]},

{id:'set',name:'Set Shoals',ru:'Мели множеств',ch:'Ch. 4 · Sets, relations, counting',c:'set',zone:1,levels:[
  {id:'set1',title:'Element or subset?',ru:'Элемент или подмножество?',type:'mc',
   brief:'∈ asks “is it one of the elements?”, ⊆ asks “are all its elements inside?”. True or false?',
   lesson:'Element ≠ singleton: 1 ≠ {1}, ∅ ≠ {∅}. ∅ is a subset of every set. pow(X) holds the subsets of X as its elements. Order and repetition do not matter in sets, but they do in sequences.',
   opts:WT,
   qs:[
    {q:'∅ ∈ {∅}',a:0,why:'{∅} has exactly one element, and it is ∅.'},
    {q:'∅ ⊆ ∅',a:0,why:'∅ is a subset of every set (vacuously).'},
    {q:'∅ = {∅}',a:1,why:'|∅| = 0 but |{∅}| = 1.'},
    {q:'{1} ∈ {1, 2}',a:1,why:'The elements are 1 and 2; the set {1} is not one of them. ({1} ⊆ {1, 2} is true.)'},
    {q:'1 ∈ {{1}, {2}}',a:1,why:'The elements are the sets {1} and {2}, not the number 1.'},
    {q:'{1} ∈ {{1}, {2}}',a:0,why:'{1} is one of the two elements.'},
    {q:'{1, 2} ∈ pow({1, 2, 3})',a:0,why:'pow(X) holds the subsets of X, and {1, 2} ⊆ {1, 2, 3}.'},
    {q:'{∅} ⊆ pow(X) for every set X',a:0,why:'Its only element ∅ is in pow(X), because ∅ ⊆ X.'},
    {q:'|pow(pow(∅))| = 2',a:0,why:'pow(∅) = {∅}, so pow(pow(∅)) = {∅, {∅}}.'},
    {q:'(1, 2) = (2, 1)',a:1,why:'In a sequence the order counts. As sets, {1, 2} = {2, 1}.'},
    {q:'{a, a, b} = {b, a}',a:0,why:'Order and repetition do not matter in a set.'},
   ]},
  {id:'set2',title:'Venn painter',ru:'Раскрась диаграмму Венна',type:'venn',
   brief:'Shade exactly the regions of the set. Tap a region in the picture or its button below; tap again to clear it. D is the domain.',
   lesson:'Same picture = same set: that is what element chasing proves line by line. ∩ → and, ∪ → or, − → and not, complement → not (needs the domain D).',
   rounds:[
    {t:'A ∩ (B ∪ C)',f:(a,b,c)=>a&&(b||c),why:'Inside A, and inside B or C.'},
    {t:'(A ∩ B) ∪ (A ∩ C)',f:(a,b,c)=>(a&&b)||(a&&c),why:'The same picture as A ∩ (B ∪ C): distributivity, Th 4.1.2.'},
    {t:'A − (B ∪ C)',f:(a,b,c)=>a&&!(b||c),why:'Only the part of A outside both B and C.'},
    {t:'(A − B) ∩ (A − C)',f:(a,b,c)=>a&&!b&&a&&!c,why:'The same picture as A − (B ∪ C): De Morgan inside.'},
    {t:'D − (A ∩ B)',f:(a,b,c)=>!(a&&b),why:'Everything except the lens A ∩ B — the outside region too. De Morgan: it equals (D − A) ∪ (D − B).'},
    {t:'(A − B) ∪ B',f:(a,b,c)=>(a&&!b)||b,
     q:{q:'So is (A − B) ∪ B = A for all sets?',opts:['No: the picture is A ∪ B. Counterexample: A = ∅, B = {1}','Yes, always'],a:0,why:'With A = ∅, B = {1}: the left side is {1}, the right side is ∅. One concrete element on one side only disproves an identity.'}},
   ]},
  {id:'set3',title:'Arrow rules',ru:'Свойства отношений',type:'mc',
   brief:'Fix the domain and codomain first, then check: total (≥ 1 out), function (≤ 1 out), injective (≤ 1 in), surjective (≥ 1 in).',
   lesson:'function [≤ 1 out] · total [≥ 1 out] · injective [≤ 1 in] · surjective [≥ 1 in] · bijection: total injective surjective function. Every ✗ needs one concrete counterexample. The same formula changes properties with the domain.',
   opts:ARROWS,
   qs:[
    {q:'S: ℤ → ℤ, x S y iff x = 100 − y',a:0,why:'Each x has exactly one y = 100 − x, and each y comes from exactly one x. (Midterm 2024, 4.5)'},
    {q:'R: ℕ → ℕ, x R y iff x = 100 − y',a:4,why:'x = 101 would need y = −1 ∉ ℕ. Each x has at most one y, so it is a function — not total.'},
    {q:'T: ℤ → ℤ, x T y iff x = 100y',a:4,why:'x = 17 is not 100y for any integer y.'},
    {q:'f: ℤ → ℤ, f(x) = 2x + 1',a:1,why:'Only odd numbers are hit: 0 is missed. On ℝ the same formula is a bijection.'},
    {q:'f: ℝ → ℝ, f(x) = eˣ',a:1,why:'Strictly increasing, but only positive values: −1 is missed.'},
    {q:'f: ℕ → ℕ, f(n) = ⌊n/2⌋',a:2,why:'0 and 1 both go to 0; every m is hit, by 2m.'},
    {q:'f: ℝ → ℝ, f(x) = x²',a:3,why:'1 and −1 both go to 1; −1 is never hit.'},
    {q:'R: ℝ → ℝ, x R y iff y² = x',a:5,why:'x = 1 has two values, y = 1 and y = −1.'},
    {q:'f: ℝ⁺ → ℝ⁺, f(x) = 1/x²',a:0,why:'On positive reals it is strictly decreasing and hits every y (x = 1/√y). On ℝ the same formula is not even total (x = 0).'},
    {q:'E: ∅ → {1, 2}, the empty relation',a:1,why:'With an empty domain every relation is a total function (vacuously) and injective; but 1 and 2 are never hit.'},
   ]},
  {id:'set4',title:'Count it',ru:'Посчитай',type:'input',
   brief:'How many? Type a number.',
   miss:'Not it. Count independent choices: k choices with n options each give nᵏ.',
   lesson:'|pow(A)| = 2^|A| · |A × B| = |A|·|B| · total functions |B|^|A| · relations 2^(|A|·|B|) · injections n(n − 1)… · pigeonhole: m objects in b boxes put ⌈m/b⌉ in one box.',
   qs:[
    {q:'|A| = 3, |B| = 4. How many total functions A → B?',a:64,why:'4·4·4 = 4³: one value for each of the 3 elements.'},
    {q:'Same sets. How many relations A → B?',a:4096,why:'A relation is its graph, a subset of A × B: 2^(3·4) = 2¹² = 4096.'},
    {q:'Same sets. How many total injective functions A → B?',a:24,why:'4·3·2: each next element has one option fewer.'},
    {q:'How many subsets of {1, …, 10} contain 1?',a:512,why:'1 is in; choose freely among 2, …, 10: 2⁹ = 512.'},
    {q:'A = {1, 2, 3}, B = {2, 3, 4}. |pow(A × B)| = ?',a:512,why:'|A × B| = 9, so 2⁹ = 512.'},
    {q:'How many total functions ∅ → {1, 2}?',a:1,why:'Exactly one, the empty function: |B|⁰ = 1. (Ex3 2024, part 2)'},
    {q:'At least how many integers guarantee that two of them have the same remainder mod 4?',a:5,why:'Pigeonhole: 5 objects in 4 boxes put ⌈5/4⌉ = 2 in one box. Four integers can all differ (0, 1, 2, 3).'},
   ]},
  {id:'set5',title:'Boss: element chasing',ru:'Босс: погоня за элементом',type:'stages',boss:true,tag:'midterm 2024',
   brief:'Prove A − (B ∪ C) = (A − B) ∩ (A − C) by a chain of iffs, then answer the Ex3 questions.',
   lesson:'For every x: x ∈ LHS ⟺ … ⟺ x ∈ RHS · unfold the operations into ∧ ∨ ¬ · name the propositional law · fold back · “every link is an iff”. Examples disprove identities, they never prove them.',
   stages:[
    {type:'order',tag:'Step 1 · the chain',
     lines:[
      {t:'We show that for every x: x ∈ A − (B ∪ C) iff x ∈ (A − B) ∩ (A − C).'},
      {t:'x ∈ A − (B ∪ C) ⟺ x ∈ A ∧ ¬(x ∈ B ∨ x ∈ C)',r:'def. of − and ∪'},
      {t:'⟺ x ∈ A ∧ (x ∉ B ∧ x ∉ C)',r:'De Morgan'},
      {t:'⟺ (x ∈ A ∧ x ∉ B) ∧ (x ∈ A ∧ x ∉ C)',r:'idempotence, assoc., comm. of ∧'},
      {t:'⟺ x ∈ (A − B) ∩ (A − C)',r:'def. of − and ∩'},
      {t:'Every link is an iff, so A − (B ∪ C) = (A − B) ∩ (A − C). ∎'},
     ],
     distractors:[
      {t:'Take A = {1, 2}, B = {1}, C = {2}: both sides are ∅, so the identity holds.',why:'An example is not a proof. Examples can only DISPROVE an identity.'},
      {t:'⟺ x ∈ A ∧ (x ∉ B ∨ x ∉ C)',why:'De Morgan turns ¬(X ∨ Y) into ¬X ∧ ¬Y, not ∨.'},
      {t:'A − (B ∪ C) = (A ∧ ¬B) ∧ (A ∧ ¬C)',why:'Type error: ∧ and ¬ are for propositions. You intersect SETS; write x ∈ … on every line.'},
     ],
     reasons:['def. of − and ∪','De Morgan','idempotence, assoc., comm. of ∧','def. of − and ∩','distributivity']},
    {type:'mc',tag:'Step 2 · Ex3 and two traps',qs:[
     {q:'Ex3 2024: |A| = k, |B| = n. Why is the number of total functions A → B equal to n · n ⋯ n = nᵏ?',opts:['A total function picks exactly one value f(aᵢ) ∈ B for each of the k elements: k independent choices with n options each, and different choices give different functions','Because every element of B is hit exactly once','Because |A × B| = k·n'],a:0,why:'Equivalently, f ↦ (f(a₁), …, f(aₖ)) is a bijection from B^A to Bᵏ.'},
     {q:'Ex3 2024, part 2: and if A = ∅?',opts:['|B^A| = 1: the empty relation is a total function (vacuously)','|B^A| = 0: there is nothing to map','It is undefined'],a:0,why:'|B|⁰ = 1, and indeed there is exactly one function: the empty one.'},
     {q:'(A ∪ B) × (C ∪ D) = (A × C) ∪ (B × D) for all sets?',opts:['False: A = {1}, B = {2}, C = {3}, D = {4}; (1, 4) is only on the left','True: × distributes over ∪'],a:0,why:'On the left the two coordinates are chosen independently. (Problem 4.15)'},
     {q:'Midterm 2024, 4.6: “There is a finite set A with |A| = |pow(A)|.”',opts:['False: |pow(A)| = 2ⁿ > n','True: take A = ∅'],a:0,why:'|pow(∅)| = 1 ≠ 0, and n < 2ⁿ for every n.'}]},
   ]},
]},

{id:'dck',name:'Skeleton Dock',ru:'Док скелетов',ch:'Write mode · midterm 1',c:'skl',zone:1,write:true,levels:[
  {id:'dck1',title:'Ex1 · WOP · Σ (2k − 1) = n²',ru:'WOP: сумма нечётных',type:'cloze',keys:'MT1',
   brief:'The same sum as in the induction skeleton — now by the WOP. Fill the gaps; ASCII works too: != for ≠, ^2 for ², emptyset for ∅.',
   lesson:'C with ≠ · nonempty · WOP · least m · base: both sides at 0 · m − 1 ∉ C · add the last term · m satisfies the formula · contradiction · C = ∅.',
   lines:['Proof. Let C ::= {c ∈ ℕ | Σₖ₌₁ᶜ (2k − 1) {neq} c²}, the set of counterexamples.',
    'By contradiction, assume C is {ne}. By the {wop}, C has a {least} element m.',
    'm ≠ 0: for n = 0 the left side is {l0} (empty sum) and the right side is {r0}.',
    'So m ≥ 1, hence m − 1 ∈ ℕ, and since m − 1 < m, m − 1 {notin} C: Σₖ₌₁ᵐ⁻¹ (2k − 1) = {ih}.',
    'Adding 2m − 1: Σₖ₌₁ᵐ (2k − 1) = (m − 1)² + (2m − 1) = {s2}.',
    'So m {sat} — a contradiction. Hence C = {em}, and the identity holds for every n ∈ ℕ. ∎'],
   gaps:{neq:{a:['≠']},ne:{o:['nonempty','empty'],a:'nonempty'},wop:{a:['WOP','Well Ordering Principle','well-ordering principle']},least:{o:['least','largest'],a:'least'},
    l0:{a:['0']},r0:{a:['0','0²']},notin:{o:['∉','∈'],a:'∉'},ih:{a:['(m−1)²']},s2:{a:['m²']},
    sat:{o:['satisfies the formula, so m ∉ C','is in C','is the largest counterexample'],a:'satisfies the formula, so m ∉ C'},em:{a:['∅']}}},
  {id:'dck2',title:'Ex1 · WOP · Σ k·2ᵏ (2024)',ru:'Ex1 2024 письменно',type:'cloze',keys:'MT1',
   brief:'The real Ex1 of 2024: Σₖ₌₀ⁿ k·2ᵏ = (n − 1)2ⁿ⁺¹ + 2. Type ^m for ᵐ.',
   lesson:'Formula for m − 1: replace n by m − 1 everywhere: (m − 2)2ᵐ + 2. Then add m·2ᵐ and collect: (2m − 2)2ᵐ = (m − 1)2ᵐ⁺¹.',
   lines:['Proof. Let C ::= {c ∈ ℕ | Σₖ₌₀ᶜ k·2ᵏ ≠ (c − 1)2ᶜ⁺¹ + 2}. By contradiction, assume C ≠ ∅; by the WOP, C has a least element m.',
    'm ≠ 0: for n = 0 the left side is 0·2⁰ = {l0} and the right side is (0 − 1)·2¹ + 2 = {r0}.',

<script>
/* ================= components ================= */
const C={};

/* a question can open a toy in the lab, prefilled: q.lab = [toyId, opt] or L.labq(q) */
function labOf(q,L,api){const spec=q.lab||(L.labq&&L.labq(q));if(!spec||!api.hasLab||!api.hasLab(spec[0]))return null;
  return h('div',{class:'row labgo'},h('button',{class:'btn mini',type:'button',onclick:()=>api.lab(spec[0],spec[1])},'🧪 Try it in the lab'));}
C.mc=function(box,L,api,done){
  let i=0;
  function show(){
    const q=L.qs[i], opts=q.opts||L.opts, shared=!q.opts;
    const order=shared?opts.map((_,k)=>k):shuffle(opts.map((_,k)=>k));
    const why=h('div',{class:'why',hidden:true});
    const next=h('button',{class:'btn primary',hidden:true,onclick:()=>{i++;if(i<L.qs.length)show();else done();}},i<L.qs.length-1?'Next question →':'Finish');
    const btns=order.map(k=>h('button',{class:'btn','data-k':k,onclick:e=>{
      if(k===q.a){btns.forEach(b=>b.disabled=true);e.currentTarget.className='btn ok';why.hidden=false;why.replaceChildren(h('b',{},'Why: '),q.why||'');next.hidden=false;next.focus();api.clear();}
      else{e.currentTarget.className='btn no';e.currentTarget.disabled=true;api.mistake(q.wrong&&q.wrong[k]?q.wrong[k]:'Not this one. Read the statement again.');}
    }},opts[k]));
    const lb=labOf(q,L,api);
    box.replaceChildren(h('div',{class:'stage-tag'},`Question ${i+1} of ${L.qs.length}`),q.fig?h('div',{class:'fig'},arrowFig(q.fig)):null,h('p',{class:'q'},q.q),h('div',{class:'opts'},btns),lb,why,h('div',{class:'row',style:'margin-top:12px'},next));
    api.onHint=()=>{const live=btns.filter(b=>!b.disabled),wrong=live.filter(b=>+b.dataset.k!==q.a),out=[];
      if(q.hint)out.push(q.hint,' ');
      if(live.length>=3&&wrong.length){const b=wrong[Math.floor(Math.random()*wrong.length)];b.disabled=true;b.classList.add('gone');out.push('One wrong option is crossed out. ');}
      if(!q.hint)out.push('Key idea: ',L.lesson);return out;};
  }
  show();
};
function arrowFig(spec){
  const sizes=spec[spec.length-1].split(',').map(Number),edges=spec.slice(0,-1),A=sizes[0],B=sizes[1];
  const an=['1','2','3','4'],bn=['x','y','z','w'],W=300,M=Math.max(A,B),Hh=40+M*46;
  const ay=k=>44+k*46+(M-A)*23,by=k=>44+k*46+(M-B)*23;
  const s=sv('svg',{viewBox:`0 0 ${W} ${Hh}`,width:W,role:'img','aria-label':'arrow diagram'});
  s.append(sv('defs',{},sv('marker',{id:'mk',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto'},sv('path',{d:'M0,0 L10,5 L0,10 z',class:'mk'}))));
  s.append(sv('text',{x:50,y:16,'text-anchor':'middle',class:'svg-m'},'A'),sv('text',{x:250,y:16,'text-anchor':'middle',class:'svg-m'},'B'));
  edges.forEach(([a,b])=>s.append(sv('line',{x1:62,y1:ay(a),x2:236,y2:by(b),class:'arr','marker-end':'url(#mk)'})));
  for(let k=0;k<A;k++){s.append(sv('circle',{cx:50,cy:ay(k),r:12,class:'dot'}),sv('text',{x:50,y:ay(k)+5,'text-anchor':'middle',class:'svg-b'},an[k]));}
  for(let k=0;k<B;k++){s.append(sv('circle',{cx:250,cy:by(k),r:12,class:'dot'}),sv('text',{x:250,y:by(k)+5,'text-anchor':'middle',class:'svg-b'},bn[k]));}
  return s;
}

C.input=function(box,L,api,done){
  let i=0;
  function show(){
    const q=L.qs[i];const inp=h('input',{type:'number',id:'ans-'+L.id+'-'+i,'aria-label':'answer'});
    const why=h('div',{class:'why',hidden:true});
    const next=h('button',{class:'btn primary',hidden:true,onclick:()=>{i++;if(i<L.qs.length)show();else done();}},i<L.qs.length-1?'Next →':'Finish');
    const check=h('button',{class:'btn primary',onclick:go},'Check');
    function go(){if(inp.value==='')return;if(Number(inp.value)===q.a){inp.disabled=true;check.disabled=true;why.hidden=false;why.replaceChildren(h('b',{},'Yes. '),q.why);next.hidden=false;next.focus();api.clear();}else{api.mistake(L.miss?`${inp.value}: ${L.miss}`:`${inp.value} is not it. Write out the first few places and count.`);inp.select();}}
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
    box.replaceChildren(h('div',{class:'stage-tag'},`Question ${i+1} of ${L.qs.length}`),h('p',{class:'q'},q.q),h('div',{class:'row',style:'margin-top:10px'},inp,check),labOf(q,L,api),why,h('div',{class:'row',style:'margin-top:12px'},next));
    api.onHint=()=>q.hint?q.hint:null;
    inp.focus();
  }
  show();
};

C.order=function(box,L,api,done){
  const lines=L.lines.map((x,i)=>({...x,i,kind:'ok'})),pool=shuffle(lines.concat(L.distractors.map(d=>({...d,kind:'bad'}))));
  let placed=0,pending=null;const used=new Set();
  function render(){
    const proof=h('ol',{class:'proof'});
    lines.slice(0,placed).forEach(l=>proof.append(h('li',{},h('span',{},l.t,l.r?h('span',{class:'rsn'},'reason: '+l.r):null))));
    if(pending){const l=pending;proof.append(h('li',{class:'pop'},h('span',{},l.t,h('span',{class:'rsn',style:'color:var(--accent)'},'reason? ↓'),
      h('div',{class:'reasons'},shuffle(L.reasons).map(r=>h('button',{class:'btn','data-r':r,onclick:e=>{if(r===l.r){placed++;pending=null;api.clear();render();if(placed===lines.length)done();}else{e.currentTarget.className='btn no';e.currentTarget.disabled=true;api.mistake(`“${r}” does not justify this line.`);}}},r))))));}
    else if(placed<lines.length)proof.append(h('li',{class:'empty'},h('span',{},'next line …')));
    const poolBox=h('div',{class:'pool'},pool.filter(p=>!used.has(p)).map(p=>h('button',{class:'btn',disabled:!!pending,'data-i':p.kind==='ok'?p.i:-1,onclick:()=>pick(p)},p.t)));
    box.replaceChildren(h('div',{class:'two'},h('div',{},h('p',{class:'h3'},'Your proof'),proof),h('div',{},h('p',{class:'h3'},'Lines to choose from'),pending?h('p',{class:'meta'},'First choose the reason for the last line.'):null,poolBox)));
  }
  api.onHint=()=>{if(pending){const b=$$('.reasons button',box).find(x=>x.dataset.r===pending.r);if(b)b.classList.add('hl');return 'The right reason is outlined.';}
    if(placed>=lines.length)return null;const b=$$('.pool button',box).find(x=>+x.dataset.i===placed);if(b){b.classList.add('hl');b.scrollIntoView({block:'nearest'});}return L.hints&&L.hints[placed]?L.hints[placed]:'The next line is outlined.';};
  function pick(p){
    if(pending)return;
    if(p.kind==='bad'){used.add(p);api.mistake(p.why);render();return;}
    if(p.i!==placed){api.mistake('Not yet: this line comes later. Which line must follow the last one?');return;}
    used.add(p);api.clear();
    if(p.r){pending=p;render();}else{placed++;render();if(placed===lines.length)done();}
  }
  render();
};

C.stages=function(box,L,api,done){
  let k=0;
  function run(){const S=L.stages[k];const inner=h('div',{});api.onHint=null;box.replaceChildren(h('div',{class:'stage-tag',style:'font-weight:600'},`${S.tag||''} · part ${k+1} of ${L.stages.length}`),inner);
    /* a part can finish only once: a second click during a delayed done() must not skip the next part */
    let fin=false;
    C[S.type](inner,{lesson:L.lesson,...S,id:L.id+'-'+k},api,()=>{if(fin)return;fin=true;k++;if(k<L.stages.length){api.info('Part done. On to the next one.');run();}else done();});}
  run();
};

/* ---- strong induction stamps ---- */
C.stamps=function(box,L,api,done){
  const DEC={12:'4 + 4 + 4',13:'4 + 4 + 5',14:'4 + 5 + 5',15:'5 + 5 + 5'};
  let cur=12;const label={};let choosing=false;
  function render(){
    const cards=[h('div',{class:'amt off'},h('div',{class:'n'},'11'),h('div',{class:'meta'},'4a + 5b? No: 11 − 5 = 6, 11 − 4 = 7, 11 − 8 = 3. So we start at 12.'))];
    for(let n=12;n<=23;n++){
      const st=n<cur?'done':n===cur?'active':'';
      const c=h('div',{class:'amt '+st},h('div',{class:'n'},n));
      if(n<cur)c.append(h('div',{class:'mono',style:'font-size:13px'},label[n]));
      if(n===cur){
        if(!choosing)c.append(h('button',{class:'btn',onclick:()=>base(n)},'Base case'),h('button',{class:'btn',onclick:()=>step(n)},`From ${n-4}, add a 4`));
        else{const opts=shuffle([DEC[n],...Object.entries(DEC).filter(([k])=>+k!==n).slice(0,2).map(([,v])=>v)]);
          c.append(h('div',{class:'meta'},`${n} = ?`),...opts.map(o=>h('button',{class:'btn mono',onclick:e=>{if(o===DEC[n]){label[n]=`${n} = ${o}  (base)`;choosing=false;next();}else{e.currentTarget.className='btn no';e.currentTarget.disabled=true;api.mistake(`${o} = ${o.split('+').reduce((a,b)=>a+ +b,0)}, not ${n}.`);}}},o)));}
      }
      cards.push(c);
    }
    box.replaceChildren(h('p',{class:'q'},'P(n) ::= n = 4a + 5b for some a, b ∈ ℕ. Prove P(12), P(13), …, P(23) in order.'),h('div',{class:'amounts',style:'margin-top:10px'},cards));
  }
  api.onHint=()=>choosing?'Use as many 4s as you can, then 5s: for example 13 = 4 + 4 + 5.':cur-4>=12?`${cur} − 4 = ${cur-4} is already proved (it is ≥ 12): use the step “from ${cur-4}, add a 4”.`:`${cur} − 4 = ${cur-4} is below 12 and not proved, so ${cur} has to be a base case.`;
  function next(){api.clear();cur++;if(cur>23){done();return;}render();}
  function base(n){if(n>=16){api.info(`True, ${n} can be written out directly. But a proof cannot list infinitely many base cases: ${n-4} is already proved, so use the step.`);return;}choosing=true;render();}
  function step(n){if(n-4<12){api.mistake(`${n} − 4 = ${n-4} is below 12, so P(${n-4}) is not proved. ${n} must be a base case.`);return;}label[n]=`${n} = (${n-4}) + 4`;next();}
  render();
};

/* ---- robot ---- */
C.robot=function(box,L,api,done){
  const N=3,Cc=48;let pos={m:0,n:0},paint=false,decl=false;
  const T=[{k:'A',m:2,n:2,ok:false},{k:'B',m:-1,n:3,ok:false},{k:'C',m:1,n:0,ok:false,imp:true}];
  const svg=sv('svg',{viewBox:`-24 -4 ${7*Cc+28} ${7*Cc+28}`,role:'img','aria-label':'board'});
  const X=m=>(m+N)*Cc,Y=n=>(N-n)*Cc;
  function draw(){
    svg.replaceChildren();
    for(let m=-N;m<=N;m++)for(let n=-N;n<=N;n++)svg.append(sv('rect',{x:X(m),y:Y(n),width:Cc,height:Cc,class:'sq '+(paint?((m+n)%2===0?'even':'odd'):'plain')}));
    for(let m=-N;m<=N;m++)svg.append(sv('text',{x:X(m)+Cc/2,y:7*Cc+16,'text-anchor':'middle',class:'svg-m'},m));
    for(let n=-N;n<=N;n++)svg.append(sv('text',{x:-8,y:Y(n)+Cc/2+4,'text-anchor':'end',class:'svg-m'},n));
    T.forEach(t=>{const c=t.ok?'done':'open';svg.append(sv('rect',{x:X(t.m)+4,y:Y(t.n)+4,width:Cc-8,height:Cc-8,rx:8,class:'tgt '+c}),sv('text',{x:X(t.m)+Cc-12,y:Y(t.n)+18,'text-anchor':'middle',class:'tgt-t '+c},t.k));});
    svg.append(sv('g',{transform:`translate(${X(pos.m)+Cc/2},${Y(pos.n)+Cc/2})`},sv('rect',{x:-13,y:-12,width:26,height:24,rx:7,class:'robot-body'}),sv('circle',{cx:-5,cy:-2,r:2.8,class:'robot-eye'}),sv('circle',{cx:5,cy:-2,r:2.8,class:'robot-eye'})));
  }
  function move(dm,dn){const a=pos.m+dm,b=pos.n+dn;if(Math.abs(a)>N||Math.abs(b)>N){api.info('Edge of the board.');return;}pos={m:a,n:b};T.forEach(t=>{if(!t.imp&&t.m===a&&t.n===b&&!t.ok){t.ok=true;api.info(`${t.k} reached.`);}});draw();status();check();}
  const st=h('div',{class:'mono',style:'font-size:14px'});
  function status(){st.textContent=tr(`robot at (${pos.m}, ${pos.n}) · m + n = ${pos.m+pos.n} · targets: ${T.map(t=>t.k+(t.ok?' ✓':'')).join('  ')}`);}
  const declBox=h('div',{class:'col'});
  function declare(t){
    if(!t.imp){api.mistake(`${t.k} = (${t.m}, ${t.n}) has m + n = ${t.m+t.n}, even like the start. It is reachable: walk there.`);return;}
    declBox.replaceChildren(h('p',{class:'q'},'Which invariant proves that C = (1, 0) is unreachable?'),...shuffle([
      ['m + n is even',true,''],['m is even',false,'Not preserved: (0, 0) → (1, 1) makes m odd.'],['m ≤ n',false,'Not preserved: (0, 0) → (1, −1) gives m > n.']]).map(([txt,ok,why])=>h('button',{class:'btn',onclick:e=>{if(ok){T[2].ok=true;decl=true;e.currentTarget.className='btn ok';api.info('Right: every move changes m + n by +2, 0 or −2, so it stays even. C has m + n = 1.');paint=true;draw();status();check();}else{e.currentTarget.className='btn no';e.currentTarget.disabled=true;api.mistake(why);}}},txt)));
  }
  function check(){if(T.every(t=>t.ok))setTimeout(done,500);}
  api.onHint=()=>{paint=true;draw();return 'The board is now painted by m + n. Every move changes m by ±1 and n by ±1. What happens to m + n? Compare the colour of C with the start.';};
  const pad=h('div',{style:'display:grid;grid-template-columns:repeat(2,56px);gap:6px'},
    h('button',{class:'btn',style:'font-size:20px;text-align:center','aria-label':'up left',onclick:()=>move(-1,1)},'↖'),h('button',{class:'btn',style:'font-size:20px;text-align:center','aria-label':'up right',onclick:()=>move(1,1)},'↗'),
    h('button',{class:'btn',style:'font-size:20px;text-align:center','aria-label':'down left',onclick:()=>move(-1,-1)},'↙'),h('button',{class:'btn',style:'font-size:20px;text-align:center','aria-label':'down right',onclick:()=>move(1,-1)},'↘'));
  box.replaceChildren(h('div',{class:'two'},h('div',{class:'board'},svg),h('div',{class:'col',style:'align-content:start;gap:12px'},st,pad,
    h('div',{},h('p',{class:'h3'},'Declare unreachable'),h('div',{class:'row'},T.map(t=>h('button',{class:'btn',onclick:()=>declare(t)},t.k+` (${t.m}, ${t.n})`)))),
    declBox,h('button',{class:'btn',onclick:()=>{paint=!paint;draw();}},'Hint: paint the board by m + n'))));
  draw();status();
};

/* ---- write mode: fill the skeleton ---- */
function nrm(x){
  return String(x).toLowerCase()
    .replace(/[’′‘`]/g,"'").replace(/″/g,"''")
    .replace(/lambda/g,'λ').replace(/forall/g,'∀').replace(/emptyset|\{\}/g,'∅')
    .replace(/<=>|<->|\biff\b/g,'⟺').replace(/=>|->|→/g,'⇒').replace(/!=|=\/=/g,'≠')
    .replace(/\bnot\s*in\b|!in\b/g,'∉').replace(/\bcap\b/g,'∩').replace(/\bcup\b/g,'∪')
    .replace(/\^([23kmn])/g,(_,c)=>({'2':'²','3':'³','k':'ᵏ','m':'ᵐ','n':'ⁿ'})[c])
    .replace(/</g,'⟨').replace(/>/g,'⟩')
    .replace(/\^2/g,'²').replace(/[−–—]/g,'-')
    .replace(/\bin\b/g,'∈').replace(/\band\b/g,'∧').replace(/&/g,'∧')
    .replace(/[.·]/g,'·')
    .replace(/[_\s"“”]/g,'')
    .replace(/[,;:·]+$/,'')
    .replace(/^(∀[a-z]+(?:∈[a-z*]+)?)[·,:]/,'$1');
}

/* ---- Nim duel ---- */
C.nim=function(box,L,api,done){

  const xr=a=>a.reduce((x,y)=>x^y,0);

  function render(){
    /* wide screen: one row of up to 18 stones per pile. Narrow screen: rows of 9, so that a stone is big enough to tap.
       Every stone also has an invisible tap area that fills its whole cell. */
    const per=window.innerWidth<640?9:18,sw=22,rh=per<18?26:46,x0=per<18?28:54,W=x0+per*sw+(per<18?4:36);
    let top=per<18?4:1;const tops=START.map(p=>{const t=top;top+=Math.ceil(p/per)*rh+(per<18?12:0);return t;}),Hh=top+(per<18?0:11);
    const svg=sv('svg',{viewBox:`0 0 ${W} ${Hh}`,class:'nimsvg',style:per<18?'max-width:420px':null,role:'group','aria-label':'piles'});
    piles.forEach((p,i)=>{svg.append(sv('text',{x:per<18?2:8,y:tops[i]+rh/2+5,class:'svg-b'},p));for(let j=0;j<p;j++){const cx=x0+(j%per)*sw,cy=tops[i]+Math.floor(j/per)*rh;
      const c=sv('circle',{cx:cx+11,cy:cy+rh/2,r:9,class:'stone'+(hint&&hint.i===i&&j>=hint.to?' hint':''),tabindex:0,role:'button','aria-label':`leave ${j} in pile ${i+1}`});const go=()=>take(i,j);svg.append(sv('rect',{x:cx,y:cy,width:sw,height:rh,class:'stone-hit',onclick:go}));c.addEventListener('click',go);c.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});svg.append(c);}});
    const s=xr(piles),b=5;
    const tb=cols?h('table',{class:'t mono',style:'max-width:360px'},h('tbody',{},piles.map(p=>h('tr',{},h('td',{},p),h('td',{},p.toString(2).padStart(b,'0')))),h('tr',{},h('td',{},h('b',{},'xor')),h('td',{},h('b',{},s.toString(2).padStart(b,'0')+` = ${s}`))))):null;
    box.replaceChildren(h('div',{class:'stage-tag'},busy?'The computer is thinking …':turn===0?'Your move: click a stone — it and every stone after it in its pile are taken.':''),h('div',{class:'scroll'},svg),
      h('div',{class:'row',style:'margin-top:10px'},h('button',{class:'btn',onclick:()=>{cols=!cols;render();}},cols?'Hide binary columns':'Show binary columns'),null),tb);
  }

  function cpu(){const w=win();if(w)piles[w.i]=w.to;else{let m=0;piles.forEach((p,k)=>{if(p>piles[m])m=k;});piles[m]-=1;}busy=false;turn=0;

/* ---- diagonal ---- */
