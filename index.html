а» из книги. Каждое доказывает ложное (или доказывает верное неправильным путём). Нажми строку, где всё ломается.","zihu3g":"Каждая строка доказательства должна следовать из предыдущих. Классические поломки: умножение на отрицательное число, деление на ноль, возведение единиц измерения в квадрат и рассуждение задом наперёд от утверждения.","yc3c2u":"Задача 1.3 (a)","1whqmlt":"Ложное утверждение: 1/8 > 1/4.","mfx68u":"log₁₀(1/2)³ > log₁₀(1/2)²","5f5mb3":"(1/2)³ > (1/2)², откуда следует 1/8 > 1/4.","14dbjt4":"3 > 2 — верно.","11m7h7y":"Это просто k·log x = log xᵏ — верно, если верна строка выше.","bcmlkg":"log₁₀ возрастает, так что этот шаг верен, если верна строка выше.","kf93qv":"log₁₀(1/2) положителен или отрицателен?","xys3ix":"log₁₀(1/2) < 0. Умножение обеих частей 3 > 2 на ОТРИЦАТЕЛЬНОЕ число переворачивает неравенство: 3 log₁₀(1/2) < 2 log₁₀(1/2).","19fqlbp":"Задача 1.3 (b)","m97owy":"Ложное утверждение: 1¢ = $1.","v3uedn":"Один цент — сотая часть доллара: верно.","1n5l8y0":"$0.1 = 10¢, значит их квадраты равны: эта строка в порядке.","1nefrba":"Верно: 100 центов составляют доллар.","1quv9mo":"Единицы измерения тоже возводятся в квадрат: какая единица у ($0.1)²?","lyz7dp":"При возведении в квадрат квадратными становятся и единицы: ($0.1)² = 0.01 квадратного доллара, а не $0.01, и (10¢)² = 100 квадратных центов, а не 100¢. Строки 2 и 4 обе теряют «квадрат» у единицы.","6lflbc":"Задача 1.3 (c)","16r3p77":"Ложное утверждение: если a и b — два равных вещественных числа, то a = 0.","14vs0li":"Умножаем обе части на a: верно.","181haw5":"Вычитаем b² из обеих частей: верно.","eha4yn":"Раскладываем обе части: верно.","1lpts6p":"Раз a + b = b, это следует.","suvvyw":"Чему равно a − b, если a = b?","1x0f4bd":"Строка 5 делит обе части на a − b. Но a = b, значит a − b = 0: деление на ноль. (a − b)(a + b) = (a − b)b верно, потому что обе части равны 0.","1boxcgk":"Задача 1.4 · среднее арифметическое ≥ среднего геометрического","17qjxll":"Верное утверждение: (a + b)/2 ≥ √(ab) для всех вещественных a, b ≥ 0 — но к доказательству есть претензия.","9op4s1":"(a + b)/2 ≥? √(ab), значит","rrwssn":"a + b ≥? 2√(ab), значит","kb4u1i":"a² + 2ab + b² ≥? 4ab, значит","10h2156":"a² − 2ab + b² ≥? 0, значит","1fh4b5y":"(a − b)² ≥ 0, а это, как мы знаем, верно.","cscckn":"Нажми строку, где логика идёт не в ту сторону.","1q7boec":"Алгебра здесь в порядке. Проблема — в НАПРАВЛЕНИИ всего рассуждения.","j4ct0q":"Алгебра в порядке. Спроси лучше: с чего начинается доказательство?","9oj0ux":"(a − b)² ≥ 0 верно — но с чего началась цепочка?","1pxn3ax":"Какое утверждение доказательство берёт за отправную точку?","13kdq0v":"Доказательство НАЧИНАЕТ с утверждения и выводит что-то верное. Это показывает «утверждение ⇒ истина», что ничего не доказывает (ложь ⇒ истина тоже истинно).","5jk0xs":"Как это исправить?","hr1141":"Пройти цепочку снизу вверх: начать с (a − b)² ≥ 0 и проверить, что каждый шаг влечёт следующий (для извлечения корня нужно a, b ≥ 0)","1r196hg":"Добавить базу","1aomqv6":"Проверить неравенство при a = b","17b7wg":"Писать «≥» вместо «≥?»","1780rbj":"Каждый шаг должен быть импликацией в том направлении, в котором ты его используешь. Здесь каждый шаг обратим — шаг с корнем потому, что a, b ≥ 0, — так что цепочка снизу вверх и есть настоящее доказательство.","t2keej":"Причал WOP","1p28tsb":"Гл. 2 · Полная упорядоченность","1jsy8x1":"Любой спуск по ℕ останавливается","24gfhc":"WOP (принцип полной упорядоченности): в любом непустом множестве натуральных чисел есть наименьший элемент. Картинка: откуда ни начни, спуск к меньшим элементам обязан остановиться — есть пол.","1isgbfp":"Множество чисел вполне упорядочено (well ordered) ровно тогда, когда в нём нет бесконечной убывающей последовательности. Минимума мало: он нужен КАЖДОМУ непустому подмножеству.","6e3vn6":"Спустись по ℕ и по {n/(n + 1)}: где ты остановишься?","cceb7b":"Спустись по {1/n} внутри ℚ≥0: почему спуск не кончается, хотя у ℚ≥0 есть минимум?","17m5pc2":"Самая левая красная клетка","1g8x18x":"Покрась каждое n в зелёный, если P(n) верно, и в красный, если нет. C — красные клетки. Доказательство через WOP говорит: пусть красная клетка есть; возьмём самую левую, m. Её левый сосед m − 1 зелёный. Покажи, что зелёный в m − 1 заставляет m быть зелёным, — противоречие.","2at8rh":"Когда утверждение ложно, самая левая красная клетка стоит ровно там, где ломается этот шаг или где не выполняется база.","1mchwia":"Выбери верное утверждение: прочитай шаг, из-за которого самой левой красной клетки быть не может.","1kgdm1a":"Выбери 2ⁿ ≥ n²: где самая левая красная клетка и почему шаг там ломается?","stxero":"Выбери «F(n) чётно»: какой базы не хватало?","15f9iv8":"Шесть строк Ex1","tjb71c":"Пиши ровно эти шесть ходов. У каждого есть устойчивая фраза; настоящая работа — только алгебра в строке 5. Без WOP ответ получает 0 баллов.","pp84w2":"Эта формула ложна. Найди в таблице наименьший контрпример m: m − 1 ещё в порядке.","bjagic":"Переключись на Σ (2k − 1) = n²: C пусто — именно это и доказывают шесть строк.","17sh1d8":"Сдвинь на c: доказательство через WOP ломается в строке 3 (m ≠ 0), на базе.","ibdj7l":"Вполне упорядочено или нет?","11o32km":"Множество вполне упорядочено (well ordered), если у КАЖДОГО его непустого подмножества есть наименьший элемент. Разложи множества.","oxrlnt":"Вполне упорядочены: ℕ (это WOP), целые с нижней границей, конечные множества, {n/(n + 1)}. Не вполне упорядочено всё, внутри чего есть бесконечная убывающая последовательность r₀ > r₁ > r₂ > … Минимума мало.","1ksekfo":"вполне упорядочено","1ms4tt3":"не вполне упорядочено","1dg780b":"Это и есть принцип полной упорядоченности (WOP).","vtk7xv":"−1 > −2 > −3 > … не имеет наименьшего элемента.","1trxrs3":"Целые с нижней границей вполне упорядочены: сдвинь на 7 — и ты в ℕ.","yhqubz":"1 > 1/2 > 1/3 > … не имеет наименьшего элемента.","1qhlqce":"ℚ≥0 — осторожно, у него есть минимум, 0","nt0fe4":"У его подмножества {1/n | n ∈ ℤ⁺} минимума нет. А он нужен КАЖДОМУ непустому подмножеству.","u9ecsp":"n/(n + 1) растёт с n, так что наименьший индекс даёт наименьший элемент (MCS §2.4.1, с. 34; мидтерм 2024, 4.2).","1pcr0et":"Целые с нижней границей: n² − 10n = (n − 5)² − 25 ≥ −25.","1uglh05":"2 > 3/2 > 4/3 > … — бесконечная убывающая последовательность внутри.","3sp3cp":"Рациональные числа больше √17 подходят к √17 сколь угодно близко: наименьшего элемента нет. (Финал 2024, 5.2)","qhw1em":"пустое множество ∅","bpy9xm":"Тривиально (vacuously): у него вообще нет непустых подмножеств.","or5mut":"Наименьший контрпример","1lp5us5":"Шаблон WOP: C = контрпримеры, наименьший m, m ≠ 0, m − 1 в порядке, значит и m в порядке — противоречие.","1kcn3cu":"C ::= {c ∈ ℕ | P(c) ложно} · предположи C ≠ ∅ · наименьший m по WOP · m ≠ 0 (вычисли обе части) · m − 1 ∉ C · покажи P(m) · противоречие · C = ∅.","6uht90":"Ты доказываешь «P(n) для каждого n ∈ ℕ» через WOP. C — это …","1gxts3m":"{c ∈ ℕ | P(c) ложно}","fxu5xz":"{c ∈ ℕ | P(c) истинно}","1sobof5":"C — множество контрпримеров. Доказательство показывает, что оно пусто.","1r4vn0x":"Утверждение: 2ⁿ ≥ n + 1 для каждого n ∈ ℕ. Множество контрпримеров — это …","sxwjkd":"Отрицай ≥ точно: не (2ᶜ ≥ c + 1) — это 2ᶜ < c + 1.","1uxhp6j":"Ты предположил C ≠ ∅ и взял m — его наименьший элемент. Что ты знаешь?","bff96d":"P(k) верно для каждого k < m из ℕ","bq4pk7":"P(m) верно","1piaje4":"P(m + 1) ложно","5jvdjv":"Каждое меньшее k вне C — иначе m не был бы наименьшим.","1jpgia7":"Зачем показывать m ≠ 0 до того, как используешь m − 1?","d7v75d":"Чтобы m − 1 ∈ ℕ: при m = 0 никакого m − 1 нет","1hvbgri":"Потому что 0 никогда не бывает контрпримером","14akebm":"Это только вопрос стиля","1qa9aub":"При m = 0 шаг говорит о −1, а его нет в ℕ. Поэтому n = 0 проверяют напрямую: вычисли ОБЕ части.","1q879cs":"Ложное доказательство «каждое число Фибоначчи чётно»: наименьший контрпример m, и F(m) = F(m − 1) + F(m − 2) — чётное + чётное. Где ломается?","j29die":"При m = 1: шагу нужно F(−1), которого нет (а F(1) = 1 нечётно)","67icls":"При m = 0","rl6jfl":"Нигде","kvhjt0":"База должна покрыть каждое m, при котором шаг вышел бы из ℕ: здесь m = 0 и m = 1.","7370r":"Ex1 говорит «докажи с помощью принципа полной упорядоченности». Ты сдаёшь верное доказательство обычной индукцией. Баллы?","190ocgc":"0: без WOP ответ не получает баллов","583jpe":"Полный балл: индукция и WOP эквивалентны","1u4bvlt":"Половина баллов","zz808b":"Метод — часть задания в мидтерме 1, Ex1.","asbq8a":"Человек говорит: «Сегодня — не первый день, когда я это говорю». Рыцари всегда говорят правду, лжецы всегда лгут. Он …","1weu1a5":"лжец","34gmxl":"рыцарь","1damxfv":"определить невозможно","1l6qo1y":"Дни, когда он это говорит, образуют непустое множество натуральных, значит по WOP есть первый такой день. В этот день утверждение ложно — рыцарь никогда бы так не сказал.","1agxqkd":"Числа в доказательстве","w6vreo":"Быстрые вычисления, которые нужны внутри доказательств через WOP. Введи число.","1ey0k8h":"Не то. Посчитай на бумаге, шаг за шагом.","1lgotom":"Вычисляй ОБЕ части на базе. Шагу, который использует m − 3, нужны 3 базовых значения; у утверждения «для n ≥ 4» база в 4.","h9p286":"Наименьший контрпример m к «n² + n + 41 простое для каждого n ∈ ℕ»?","1hrckkz":"40² + 40 + 41 = 1681 = 41². При n = 0, …, 39 значения простые.","1kwbjdu":"В Σₖ₌₀ⁿ k·2ᵏ = (n − 1)2ⁿ⁺¹ + 2: правая часть при n = 0?","1cnt3du":"(0 − 1)·2¹ + 2 = 0, а левая часть 0·2⁰ = 0. Части совпадают, значит 0 ∉ C.","11em159":"Вычисли Σₖ₌₀³ k·2ᵏ.","1ry31zv":"0 + 2 + 8 + 24 = 34 = (3 − 1)·2⁴ + 2. Проверка, а не доказательство.","1ugiqvh":"Наименьший элемент {n² − 10n | n ∈ ℕ}?","1f6jd4k":"n² − 10n = (n − 5)² − 25, минимум при n = 5.","ege4h6":"Почтовые марки: каждое n ≥ 8 есть 3a + 5b с a, b ∈ ℕ. Шаг WOP использует m − 3. Сколько базовых значений надо проверить?","180yz8b":"8 = 3 + 5, 9 = 3·3, 10 = 5 + 5. При m ≥ 11 число m − 3 ≥ 8 не контрпример.","btd6qm":"n² ≤ 2ⁿ для каждого целого n ≥ 4. Какое значение проверяешь первым как базу?","9etelq":"4² = 16 ≤ 16 = 2⁴. Тогда m ≥ 5, так что m − 1 ≥ 4 ещё в пределах.","1vk0kom":"Босс: Ex1 2024","1d4lyp5":"мидтерм 2024","iul669":"Докажи Σₖ₌₀ⁿ k·2ᵏ = (n − 1)2ⁿ⁺¹ + 2 для каждого n ∈ ℕ — с помощью принципа полной упорядоченности. Строки по порядку, обоснования шагов, обходи ловушки.","95hk88":"C = контрпримеры (≠) · наименьший m · m ≠ 0, обе части вычислены · m − 1 ∉ C даёт формулу для m − 1 · прибавь m·2ᵐ · алгебра до формулы для m · противоречие · C = ∅.","1cg35hk":"Доказательство. Пусть C ::= {c ∈ ℕ | Σₖ₌₀ᶜ k·2ᵏ ≠ (c − 1)2ᶜ⁺¹ + 2} — множество контрпримеров.","1x9t3da":"От противного: пусть C ≠ ∅. Тогда в C есть наименьший элемент m.","1mmaqz":"m ≠ 0: при n = 0 левая часть 0·2⁰ = 0, а правая (−1)·2 + 2 = 0.","1n3mpk5":"вычисляем обе части","15zfq7x":"Значит m ≥ 1, m − 1 ∈ ℕ и m − 1 ∉ C, то есть Σₖ₌₀ᵐ⁻¹ k·2ᵏ = (m − 2)2ᵐ + 2.","88e686":"m — наименьший элемент C","1b2o0pb":"прибавляем слагаемое m·2ᵐ","91mk5k":"= (2m − 2)2ᵐ + 2 = (m − 1)2ᵐ⁺¹ + 2, значит m ∉ C — противоречие.","62ypd2":"Следовательно, C = ∅, и тождество верно для каждого n ∈ ℕ. ∎","pndu2c":"Предположим P(m) и докажем P(m + 1).","i2h7en":"Это шаг индукции. Ex1 требует WOP: наименьший контрпример и противоречие.","5fvwsg":"Пусть C ::= {c ∈ ℕ | Σₖ₌₀ᶜ k·2ᵏ = (c − 1)2ᶜ⁺¹ + 2}.","x37pwd":"C должно собирать КОНТРпримеры: ≠, а не =.","fbftjr":"Раз m ∈ C, то и m − 1 ∈ C.","srgtdp":"Наоборот: m — НАИМЕНЬШИЙ элемент C, значит m − 1 НЕ лежит в C.","1o3fn4g":"По WOP в C есть наибольший элемент m.","1linzcw":"WOP даёт наименьший элемент. У множества натуральных наибольшего может и не быть.","1bw9k58":"по IH","4m77rr":"Марки по 10¢ и 15¢","bbap3z":"задача из книги","1r5ur41":"Заполни шаблон WOP из книги: любая сумма, набранная марками по 10¢ и 15¢, делится на 5. S(n) ::= ровно n центов можно набрать. Утверждение: S(n) IMPLIES 5 | n для всех n ∈ ℕ. Выбери каждый пропущенный кусок.","dac8i7":"Шаблон WOP: C ::= контрпримеры · предположи C ≠ ∅ · наименьший m · m — не база · что-то меньшее не лежит в C · противоречие · C = ∅.","sswdkq":"Все числа Фибоначчи чётные?","147qnel":"F(0) = 0, F(1) = 1, F(n) = F(n − 1) + F(n − 2) при n > 1. Раз F(1) = 1, утверждение ложно — значит, в этом доказательстве через WOP есть ошибка. Найди её.","1p028m3":"Шаг WOP или индукции должен работать для КАЖДОГО возможного m — включая самые маленькие, где m − 2 или рекурсивного случая может не быть.","e0bj8y":"Задача 2.2","11h3x5a":"Ложное утверждение: каждое число Фибоначчи чётно. (Все переменные — неотрицательные целые.)","8zu2ko":"Доказательство — через WOP.","wtm7rz":"Пусть EF(n) означает, что F(n) чётно.","1m8ew1l":"Пусть C ::= {n ∈ ℕ | NOT(EF(n))} — множество контрпримеров.","1g23kzk":"Докажем от противного, что C пусто. Итак, предположим, что C не пусто.","1wdxuvp":"По WOP есть наименьшее неотрицательное целое m ∈ C.","o58u1p":"Тогда m > 0, так как F(0) = 0 — чётное число.","1u53y0x":"Так как m — минимальный контрпример, F(k) чётно для всех k < m.","1pnmsi4":"В частности, F(m − 1) и F(m − 2) оба чётны.","1s659q8":"Но по определению F(m) равно сумме F(m − 1) + F(m − 2) двух чётных чисел, а значит, тоже чётно.","14hm933":"То есть EF(m) истинно.","uafl58":"Это противоречит условию из определения m, что NOT(EF(m)) выполнено.","vkq211":"Это противоречие означает, что C должно быть пустым. Следовательно, F(n) чётно для всех n ∈ ℕ.","1p9vdiw":"Наименьший контрпример — m = 1. Прочитай строки 8 и 9 при m = 1.","1w6v7zk":"В порядке: WOP даёт наименьший элемент непустого C ⊆ ℕ.","1hcfe8p":"Верно: F(0) = 0 чётно, так что 0 ∉ C и m > 0.","1q2bote":"Верно, по выбору m.","q5gl0u":"Строка 8 предполагает m ≥ 2. При m = 1 число m − 2 = −1 не натуральное, а строка 9 использует F(m) = F(m − 1) + F(m − 2), что определение даёт только при m > 1. Случай m = 1 не разобран — а m = 1 И ЕСТЬ наименьший контрпример, ведь F(1) = 1 нечётно.","wxsd7a":"Прилив истинности","emy6uq":"Гл. 3 · Логические формулы","7om1kf":"Формула — это дерево","1x2frvj":"Приоритет строит дерево: ¬ связывает сильнее всего, затем ∧, ∨, ⊕, →, ↔. Каждый узел — связка; её значение берётся из детей.","l57uqi":"Переключи переменную и смотри, как изменение поднимается к корню. Одна подстановка значений = одна строка таблицы истинности.","16dbqxa":"Прочитай, как разобрана формула ¬P ∨ Q ∧ R → S ↔ T.","1da76nd":"Тапай строки таблицы: какие переменные могут поменять корень?","d2sbf6":"Общезначима, выполнима, эквивалентна","1fzhsqg":"Общезначима (valid): корень T в каждой строке. Выполнима (satisfiable): хотя бы в одной. Эквивалентны (equivalent): у двух формул одинаковый столбец.","1tw8qk7":"Для «не общезначима» нужна ОДНА опровергающая строка — эта строка и есть весь ответ к Ex2.2. Для «общезначима» нужны все строки или разбор случаев.","1oe6wb4":"Загружено Ex2.2: найди его опровергающие строки. Потом загрузи Ex2.1.","1evdway":"Сравни (P ∧ Q) → R с P → (Q → R), затем с (P → Q) → R.","whemu7":"Кванторы — это строки и столбцы","1yph517":"Нарисуй P(x, y) как сетку: строка x, столбец y. ∀x ∃y = в каждой строке есть закрашенная клетка. ∃y ∀x = один столбец закрашен целиком.","1yz23vr":"Полный столбец даёт клетку в каждой строке, так что ∃y∀x ⇒ ∀x∃y общезначимо. Диагональ заполняет каждую строку без полного столбца, так что обратное — нет.","crbbpn":"¬ переворачивает каждый квантор: ¬∀x∃y.P ≡ ∃x∀y.¬P = какая-то строка пуста.","1xoc7hb":"Сделай ∀x ∃y истинным, а ∃y ∀x ложным.","1vrhs9e":"Попробуй сделать ∃y ∀x истинным, а ∀x ∃y ложным. Почему не выходит?","7efogz":"Заполни таблицу","dcy3qz":"Заполни пустые клетки, проверь таблицу, потом прочитай, что она говорит.","q20lnt":"X → Y равно F только в строке T → F. Последний столбец весь T: общезначима · есть T: выполнима · нет T: невыполнима. Одинаковые столбцы: эквивалентные формулы.","13kbpw4":"Сравни ¬P ∨ Q и P → Q","2a7cwn":"Сравни столбцы ¬P ∨ Q и P → Q:","935n8w":"одинаковы в каждой строке: формулы эквивалентны","3yet84":"различаются в одной строке","yuwimv":"различаются в двух строках","1s4gt2h":"P → Q ≡ ¬P ∨ Q. Это закон, которым превращают → в ∨ при построении DNF.","9ahsre":"Закон Пирса: ((P → Q) → P) → P","17zxwum":"О, В или Н?","gr6w26":"Общезначима (valid) = истинна при любой подстановке · выполнима (satisfiable) = хотя бы при одной · невыполнима (unsatisfiable) = ни при какой. Если надо, разбери на бумаге.","q4nrso":"Для «не общезначима» достаточно одной опровергающей подстановки. Для «общезначима» нужны все случаи: таблица или разбор случаев по переменной. P общезначима ⟺ ¬P невыполнима.","1058009":"выполнима, но не общезначима","aqwhn9":"Если Q истинно, P → Q истинно; если Q ложно, истинно Q → P.","120umij":"P = T делает её истинной; P = Q = F даёт T → F = F.","3vgip0":"P = T делает её истинной; P = F, Q = T даёт (T → T) → F = F.","1ig12de":"Modus tollens: если Q ложно и P → Q выполнено, P обязано быть ложным.","125jq1p":"P = F, Q = T: (T ∧ T) → F = F. Утверждение следствия — не корректное правило.","1oip8zn":"Если P истинно, Q → P истинно. Если P ложно, импликация истинна.","opj53h":"P = Q = T даёт T → F = F; P = T, Q = F даёт T.","1gl3fy3":"Никогда не истинна.","ijg2cx":"Законы и отрицания","lkgbhd":"Эквивалентности, приоритет связок, законы де Моргана для кванторов, нормальные формы, SAT.","zatd03":"P → Q ≡ ¬P ∨ Q · ¬(P → Q) ≡ P ∧ ¬Q · де Морган меняет ∧ и ∨ · ¬∀x ≡ ∃x¬ · приоритет ¬, ∧, ∨, ⊕, →, ↔ · DNF: по одной конъюнкции на каждую строку с T.","f8csei":"Ложно только при P = T и Q = F — ровно как ¬P ∨ Q.","n7t0zz":"Единственная ложная строка P → Q.","3l2jvt":"Де Морган: отрицание меняет ∨ и ∧ местами.","xfwvqx":"Экспортирование: (P ∧ Q) → R ≡ P → (Q → R). Третий вариант — это (P ∨ Q) → R.","1tnduv2":"Расставь все скобки: ¬P ∨ Q ∧ R → S ↔ T","hmpzkm":"Приоритет от сильного к слабому: ¬, ∧, ∨, ⊕, →, ↔.","1878gdg":"P ⊕ Q ⊕ R истинно ровно тогда, когда …","1eriq0s":"истинно нечётное число из P, Q, R","113lojq":"истинно ровно одно из них","1lak4dp":"истинно хотя бы одно","1umuvag":"Когда все три истинны: (T ⊕ T) ⊕ T = F ⊕ T = T, так что «ровно одно» — неверно.","bycc1p":"Отрицание ∀x ∃y.(x < y ∧ P(y)) — это …","1lki6ty":"Переверни каждый квантор, потом отрицай тело по де Моргану.","gjot8p":"Полная DNF для P ↔ Q — это …","1iv1c7k":"По одной конъюнкции на каждую строку с T: TT и FF. Две другие описывают P ⊕ Q.","umimfg":"Соглашение курса: DNF невыполнимой формулы — это …","vk5umr":"её не существует","grqufa":"Строк с T нет, значит нет и конъюнкций: пустая дизъюнкция равна F.","ls1bu9":"Если у SAT есть полиномиальный алгоритм, то …","thld76":"SAT ∉ NP","jg3748":"ничего не следует","l3irm5":"Каждая задача из NP сводится к SAT за полиномиальное время. Верно ли, что P = NP, — до сих пор открытая проблема.","y48jhr":"Английский → логика","1okdru1":"Выбери формулу, которая говорит ровно то же самое.","8cark8":"«Q if P» = P → Q · «Q only if P» = Q → P · «All X are Y» = ∀x.(X → Y) · «Some X is Y» = ∃x.(X ∧ Y) · ∃∀ ⇒ ∀∃, но не обратно.","13r7vnp":"«You may enter only if you have a ticket» — «войти можно, только если есть билет». (E: войти, T: билет)","1xo2jco":"«Q only if P» — это Q → P: для входа нужен билет.","1bkq2r9":"«You may enter if you have a ticket» — «войти можно, если есть билет».","qvyy4s":"«Q if P» — это P → Q: билета достаточно.","1cbmpdh":"«Билет необходим, но не достаточен для входа».","18kruid":"Необходим: E → T. Не достаточен: не (T → E).","t2y64i":"«All X are Y» — «все X являются Y».","1vf48vm":"С ∧ это значило бы, что всё подряд является и X, и Y.","1quv0wb":"«Some X is Y» — «некоторый X является Y».","1ba7eo1":"С → любое x, не являющееся X, делает формулу истинной, так что она почти ничего не говорит.","menip2":"«No X is Y» — «ни один X не является Y».","vvt3y":"Каждый X не является Y.","i1ihpe":"«Everyone has some dream» — «у каждого есть какая-то мечта». (dreams(p, d))","11mlmiu":"∃d ∀p говорит, что одна мечта общая для всех. Порядок кванторов важен.","1thqjzo":"«If you can solve any one of the exercises, you pass» — «если ты можешь решить хоть одно из упражнений, ты сдал».","15submd":"Здесь «any one» значит «хотя бы одно»: достаточно решить одно упражнение. Само по себе «any» может значить и «каждое», так что проверяй, что имеется в виду.","1ax8wcb":"«Ни одну лекцию не посетили все студенты». (A(s, l): s посетил l)","1njltke":"¬∃l ∀s. A(s, l), затем внеси ¬ внутрь: переверни каждый квантор, отрицай тело.","16uptpw":"Лаборатория контрмоделей","lbozep":"Домен ℕ. Выбери, что означают P и Q, потом вычисли. Цель: сделать всю формулу ЛОЖНОЙ — это и есть контрмодель (counter-model). Если никакой выбор этого не даёт, формула общезначима: так и скажи.","1vyhy6m":"Контрмодель для α → β: сделай α истинной, а β ложной. Простых предикатов на ℕ (чётное/нечётное, x = 0, x < y) почти всегда хватает. ∀ не распределяется по ∨, ∃ — по ∧; ∃y∀x ⇒ ∀x∃y общезначимо, обратное — нет.","81rbx7":"Пусть P и Q поделят ℕ между собой так, чтобы ни одно не выполнялось везде.","ywxrdb":"P = чётное, Q = нечётное: каждое x чётно или нечётно (T), но не выполняется ни ∀x.P, ни ∀x.Q (F). ∀ не распределяется по ∨.","1fah7ig":"Нужно одно x с P, но без Q, и другое x с Q, но без P.","15s8m46":"P = чётное, Q = нечётное: x = 0 ломает P → Q, а x = 1 ломает Q → P. (Мидтерм 2024, 4.4: «есть контрмодель» — ВЕРНО. С ∀ снаружи всей дизъюнкции было бы общезначимо.)","f3sfwo":"Общезначима: свидетель x₀ с P(x₀) ∧ Q(x₀) — одновременно свидетель и для ∃x.P, и для ∃x.Q. Никакая интерпретация это не сломает.","kwyz2w":"Свидетели могут быть разными числами.","pkdk1p":"P = (x = 0), Q = (x > 0): у каждого есть свидетель, но ни одно x не обладает обоими. ∃ не распределяется по ∧ — это обратное к предыдущему.","m15hs":"Пусть y зависит от x — например, «y больше x».","1vd95n5":"P(x, y) ::= x < y: у каждого x есть y побольше (T), но ни одно y не больше всех x (F).","1vs36c8":"Общезначима: если одно y₀ подходит для каждого x, то для каждого x просто возьми y = y₀.","bbxe45":"Босс: Ex2 2024","1p5jhxu":"Ex2.1: докажи, что (P → Q) → ((P → R) → (P → (Q ∧ R))) общезначима. Ex2.2: покажи, что ((P → Q) → (P → R)) → (P → (Q ∧ R)) не общезначима.","1gvx5d1":"Общезначима: разбор случаев по ключевой переменной (или таблица), истинна в каждом случае, «случаи исчерпывающие». Не общезначима: ОДНА опровергающая подстановка, вычисленная явно.","o86vig":"Ex2.1 · общезначимость разбором случаев","1tctm47":"Доказательство. Разбор случаев по P, затем по Q.","m4kf0x":"Случай P = F: каждая импликация с посылкой P истинна, так что формула равна T → (T → T) = T.","1sjvwud":"ложная посылка ⇒ импликация истинна","1y76zeo":"Случай P = T, Q = F: P → Q = F, значит у главной импликации ложная посылка и она равна T.","1cuesd6":"Случай P = T, Q = T: P → R имеет значение R, и P → (Q ∧ R) имеет значение R; формула равна T → (R → R) = T.","zvyh6s":"T → X имеет значение X","1whm62q":"Случаи исчерпывающие, и в каждом формула истинна, значит она общезначима. ∎","5lkiqi":"Возьмём P = Q = R = T: формула истинна, значит она общезначима.","1awmtwj":"Одна выполняющая подстановка показывает только ВЫПОЛНИМОСТЬ. Для общезначимости нужны все подстановки.","1rjg6wz":"Случай P = F: тогда P → Q ложно.","1h1f0mp":"При P = F импликация P → Q ИСТИННА: ложная посылка.","1ek4fz2":"Де Морган","3z95f4":"Ex2.2 · таблица","1e2suqb":"Ex2.2 · что ты пишешь","jn7s9p":"Ex2.2 стоит 1 балл. Что ты пишешь?","19ow64e":"P = T, Q = F, R любое: P → Q = F, значит (P → Q) → (P → R) = T; Q ∧ R = F, значит P → (Q ∧ R) = F; формула равна T → F = F — не общезначима.","12aj712":"«Таблица слишком большая, но очевидно, что не общезначима».","1jz0rwu":"«Не общезначима, потому что Ex2.1 общезначима».","sxbzqw":"Одна опровергающая подстановка, и каждая подформула вычислена. Это и есть весь ответ.","pgpyb0":"Упрости условие if","pyb35p":"история из книги","2jggfq":"Из книги: в программе написано  if ( x > 0 || (x <= 0 && y > 100) ). Пусть A — «x > 0», а B — «y > 100». Эквивалентно ли условие более простому A OR B?","sd231a":"Логика высказываний упрощает настоящий код: A OR (NOT(A) AND B) ≡ A OR B. Проверь таблицей истинности или разбором случаев по A.","15f5sum":"Таблица истинности","np7lh7":"A ∨ (¬A ∧ B)   против   A ∨ B","azqwsr":"Сравни два последних столбца. Два условия …","136a39j":"эквивалентны: одинаковое значение в каждой строке","1r894ue":"не эквивалентны","q2bfq4":"эквивалентны, только когда A истинно","1b56ivn":"Столбцы совпадают во всех четырёх строках, значит формулы эквивалентны и программу можно упростить.","tcqvlh":"Обратно к коду","5adw5w":"Значит, строку  if ( x > 0 || (x <= 0 && y > 100) )  можно заменить на …","vn6w4d":"A OR (NOT(A) AND B) ≡ A OR B, где A = (x > 0) и B = (y > 100).","rlpw9b":"В книге это доказано и разбором случаев. Если A = F, то A ∨ (¬A ∧ B) превращается в …","1fl57ud":"F ∨ (T ∧ B), что эквивалентно B — как и A ∨ B","basz60":"всегда T","7eyjge":"всегда F","1g671em":"Случай A = T: обе части равны T. Случай A = F: обе части сводятся к B. Все случаи совпадают, значит формулы эквивалентны.","1kk2zff":"Отмели множеств","17q81tu":"Гл. 4 · Множества, отношения, подсчёт","ovl4km":"Множества — это переодетая логика","1wdznzw":"x ∈ A ∩ B ⟺ x ∈ A ∧ x ∈ B. Так же ∪ — это ∨, A − B — «и не», дополнение — ¬. Поэтому каждое тождество множеств — это эквивалентность высказываний про «x ∈ …».","1gld5fp":"Одна картинка ⟺ одно множество. Погоня за элементом (element chasing) записывает, ПОЧЕМУ картинки совпадают; отличающаяся область даёт контрпример.","1y1bqso":"Дистрибутивность и де Морган: картинки одинаковые?","i1mhyn":"(A − B) ∪ B против A: положи элемент в красную область — вот и контрпример.","10w32s9":"Четыре свойства стрелок","pwuqzm":"Считай стрелки, ВЫХОДЯЩИЕ из каждой левой точки: ≤ 1 — функция, ≥ 1 — тотальное (total). Считай стрелки, ВХОДЯЩИЕ в каждую правую точку: ≤ 1 — инъективное (injective), ≥ 1 — сюръективное (surjective).","dtjf16":"Разверни все стрелки (R⁻¹): выход становится входом, так что функция ↔ инъективность и тотальность ↔ сюръективность меняются местами.","1fh0p35":"|A| = 4, |B| = 3: попробуй построить тотальную инъективную функцию.","1xbl1w5":"Сделай её тотальной и сюръективной, но не инъективной. Потом разверни.","1f9v4td":"|A| = 0: почему пустое отношение — тотальная функция?","1v50k1d":"Подсчёт = независимые выборы","7vs7sb":"Тотальная функция A → B — это слово: по одной букве из B на каждый элемент A. k позиций по n букв дают nᵏ слов.","1eltep5":"Инъективна = буквы не повторяются: n(n − 1)⋯(n − k + 1). Подмножества A = битовые строки длины |A|: 2^|A|.","rcwv0a":"k = 0: сколько функций и какие?","vqjxmy":"Инъективные при k > n: почему 0?","1tetszv":"Элемент или подмножество?","12kz1i4":"∈ спрашивает «это один из элементов?», ⊆ спрашивает «все ли его элементы внутри?». Истина или ложь?","vykbzz":"Элемент ≠ одноэлементное множество: 1 ≠ {1}, ∅ ≠ {∅}. ∅ — подмножество любого множества. Элементы pow(X) — это подмножества X. В множествах порядок и повторы не важны, а в последовательностях важны.","1tjyq6t":"В {∅} ровно один элемент, и это ∅.","1s3ypdf":"∅ — подмножество любого множества (тривиально, vacuously).","1p6lq3j":"|∅| = 0, но |{∅}| = 1.","5h13p1":"Элементы — это 1 и 2; множество {1} среди них нет. ({1} ⊆ {1, 2} — верно.)","wat52b":"Элементы — это множества {1} и {2}, а не число 1.","14i88r1":"{1} — один из двух элементов.","wj8thx":"Элементы pow(X) — подмножества X, а {1, 2} ⊆ {1, 2, 3}.","121q1vv":"{∅} ⊆ pow(X) для любого множества X","jmgb03":"Его единственный элемент ∅ лежит в pow(X), так как ∅ ⊆ X.","1y46lc9":"pow(∅) = {∅}, значит pow(pow(∅)) = {∅, {∅}}.","7lpnj7":"В последовательности порядок важен. Как множества, {1, 2} = {2, 1}.","x0lxou":"В множестве порядок и повторы не важны.","nf850r":"Художник Венна","12uw5ue":"Закрась ровно области этого множества. Тапни область на картинке или её кнопку ниже; повторный тап снимает заливку. D — домен.","1gplait":"Одна картинка = одно множество: это и доказывает погоня за элементом строка за строкой. ∩ → и, ∪ → или, − → и не, дополнение → не (нужен домен D).","3qrsvl":"Внутри A, и внутри B или C.","u3bp2w":"Та же картинка, что A ∩ (B ∪ C): дистрибутивность, Th 4.1.2.","yl0pl7":"Только часть A вне B и вне C.","f20i1y":"Та же картинка, что A − (B ∪ C): внутри де Морган.","1j6ny5o":"Всё, кроме линзы A ∩ B, — и внешняя область тоже. Де Морган: это равно (D − A) ∪ (D − B).","lycigt":"Так верно ли (A − B) ∪ B = A для всех множеств?","44i43t":"Нет: на картинке A ∪ B. Контрпример: A = ∅, B = {1}","pnwk1l":"Да, всегда","1w1p6e6":"При A = ∅, B = {1}: левая часть {1}, правая ∅. Один конкретный элемент только с одной стороны опровергает тождество.","ghswmd":"Правила стрелок","1rqtir0":"Сначала зафиксируй область и кообласть, потом проверяй: тотальность (≥ 1 выход), функция (≤ 1 выход), инъективность (≤ 1 вход), сюръективность (≥ 1 вход).","pfcw90":"функция [≤ 1 выход] · тотальна [≥ 1 выход] · инъективна [≤ 1 вход] · сюръективна [≥ 1 вход] · биекция (bijection): тотальная инъективная сюръективная функция. Каждый ✗ требует одного конкретного контрпримера. Та же формула меняет свойства вместе с доменом.","dw8jmn":"тотальная функция: инъективна, не сюръективна","1h7sfc5":"тотальная функция: сюръективна, не инъективна","19o69c":"тотальная функция: ни инъективна, ни сюръективна","fiuvsg":"функция, но не тотальна","1fbtnxz":"не функция","1rjoc7e":"S: ℤ → ℤ, x S y iff x = 100 − y","pwdghr":"У каждого x ровно один y = 100 − x, и каждый y получается ровно из одного x. (Мидтерм 2024, 4.5)","qi6j2y":"R: ℕ → ℕ, x R y iff x = 100 − y","1gb1s09":"Для x = 101 понадобился бы y = −1 ∉ ℕ. У каждого x не больше одного y, так что это функция — не тотальная.","1p7sqqa":"T: ℤ → ℤ, x T y iff x = 100y","hdxusd":"x = 17 не равно 100y ни для какого целого y.","1wyzhep":"Попадаем только в нечётные: 0 пропущен. На ℝ та же формула — биекция.","uw2qt2":"Строго возрастает, но значения только положительные: −1 пропущено.","xziyrx":"0 и 1 обе идут в 0; в каждое m попадаем — из 2m.","17bfguo":"1 и −1 обе идут в 1; в −1 не попадаем никогда.","15yre0l":"R: ℝ → ℝ, x R y iff y² = x","106zrck":"У x = 1 два значения: y = 1 и y = −1.","1f5a3hw":"На положительных вещественных она строго убывает и попадает в каждое y (x = 1/√y). На ℝ та же формула даже не тотальна (x = 0).","hctjxu":"E: ∅ → {1, 2}, пустое отношение","1umbejg":"При пустом домене любое отношение — тотальная функция (тривиально) и инъективно; но в 1 и 2 никто не попадает.","18hxlz5":"Посчитай","fy7t8p":"Сколько? Введи число.","1ohmz0u":"Не то. Считай независимые выборы: k выборов по n вариантов дают nᵏ.","h8i1q4":"|pow(A)| = 2^|A| · |A × B| = |A|·|B| · тотальных функций |B|^|A| · отношений 2^(|A|·|B|) · инъекций n(n − 1)… · принцип Дирихле (pigeonhole): m объектов в b ящиках — в каком-то ящике ⌈m/b⌉.","368yx7":"|A| = 3, |B| = 4. Сколько тотальных функций A → B?","7nljua":"4·4·4 = 4³: по одному значению на каждый из 3 элементов.","ue0t1a":"Те же множества. Сколько отношений A → B?","1p8btwr":"Отношение — это его график, подмножество A × B: 2^(3·4) = 2¹² = 4096.","n63t87":"Те же множества. Сколько тотальных инъективных функций A → B?","m4eedu":"4·3·2: у каждого следующего элемента на один вариант меньше.","1vnidgy":"Сколько подмножеств {1, …, 10} содержат 1?","1u626tv":"1 внутри; остальное выбираем свободно среди 2, …, 10: 2⁹ = 512.","v2zsmc":"A = {1, 2, 3}, B = {2, 3, 4}. |pow(A × B)| = ?","jb2rvp":"|A × B| = 9, значит 2⁹ = 512.","1vr78o4":"Сколько тотальных функций ∅ → {1, 2}?","1hd8bvn":"Ровно одна — пустая функция: |B|⁰ = 1. (Ex3 2024, часть 2)","185tw9y":"Сколько минимум целых чисел гарантируют, что у двух из них одинаковый остаток по модулю 4?","dntf90":"Принцип Дирихле: 5 объектов в 4 ящиках — в каком-то ящике ⌈5/4⌉ = 2. Четыре целых могут все различаться (0, 1, 2, 3).","149t7ov":"Босс: погоня за элементом","auagdc":"Докажи A − (B ∪ C) = (A − B) ∩ (A − C) цепочкой iff, потом ответь на вопросы Ex3.","64m1nn":"Для каждого x: x ∈ LHS ⟺ … ⟺ x ∈ RHS · разверни операции в ∧ ∨ ¬ · назови закон логики · сверни обратно · «каждое звено — iff». Примеры опровергают тождества, но никогда их не доказывают.","1mjpvsv":"Шаг 1 · цепочка","1bitopr":"Покажем, что для каждого x: x ∈ A − (B ∪ C) iff x ∈ (A − B) ∩ (A − C).","17bnzn6":"опр. − и ∪","l6j4cn":"идемпотентность, ассоц., коммут. ∧","171ody7":"опр. − и ∩","fudg36":"Каждое звено — iff, значит A − (B ∪ C) = (A − B) ∩ (A − C). ∎","13w4w2o":"Возьмём A = {1, 2}, B = {1}, C = {2}: обе части равны ∅, значит тождество верно.","1liwef6":"Пример — не доказательство. Примеры могут только ОПРОВЕРГНУТЬ тождество.","jr7y6z":"Де Морган превращает ¬(X ∨ Y) в ¬X ∧ ¬Y, а не в ∨.","t7am50":"Ошибка типов: ∧ и ¬ — для высказываний. Пересекают МНОЖЕСТВА; пиши x ∈ … в каждой строке.","19nh1l1":"Шаг 2 · Ex3 и две ловушки","1d4iupu":"Ex3 2024: |A| = k, |B| = n. Почему число тотальных функций A → B равно n · n ⋯ n = nᵏ?","1ovchbq":"Тотальная функция выбирает ровно одно значение f(aᵢ) ∈ B для каждого из k элементов: k независимых выборов по n вариантов, и разные выборы дают разные функции","1vn8sht":"Потому что в каждый элемент B попадают ровно один раз","1ajdyh8":"Потому что |A × B| = k·n","1apz8rd":"Иначе говоря, f ↦ (f(a₁), …, f(aₖ)) — биекция из B^A в Bᵏ.","1lb2y5y":"Ex3 2024, часть 2: а если A = ∅?","10e7ekh":"|B^A| = 1: пустое отношение — тотальная функция (тривиально)","1rcyufb":"|B^A| = 0: отображать нечего","1aa9um4":"Это не определено","1dof3o9":"|B|⁰ = 1, и действительно функция ровно одна — пустая.","3gi74d":"(A ∪ B) × (C ∪ D) = (A × C) ∪ (B × D) для всех множеств?","1e987wo":"Ложь: A = {1}, B = {2}, C = {3}, D = {4}; (1, 4) есть только слева","10ckxm4":"Истина: × распределяется по ∪","1a719f9":"Слева две координаты выбираются независимо. (Задача 4.15)","10inv35":"Мидтерм 2024, 4.6: «Существует конечное множество A с |A| = |pow(A)|».","1w7hm6s":"Ложь: |pow(A)| = 2ⁿ > n","z8qryf":"Истина: возьми A = ∅","1r5kkx1":"|pow(∅)| = 1 ≠ 0, и n < 2ⁿ для каждого n.","1rg1g8m":"Ложная цепочка iff","1ig4lxq":"Ложная теорема: (A ∪ B) × (C ∪ D) = (A × C) ∪ (B × D). Доказательство — цепочка iff, и одно звено на самом деле лишь импликация в одну сторону. Найди его.","13o863v":"В цепочке iff КАЖДОЕ звено должно выполняться в обе стороны. Одно звено, которое лишь ⇒, превращает цепочку в доказательство ⊆, а не =.","oa2ifl":"Задача 4.15 (b)","1saitjb":"L ::= (A ∪ B) × (C ∪ D),  R ::= (A × C) ∪ (B × D).  «Доказательство», что L = R:","1c5v27c":"iff (x, y) ∈ (A × C) ∪ (B × D)","1i4pcup":"iff (x, y) ∈ A × C или (x, y) ∈ B × D","orl5y2":"iff (x ∈ A и y ∈ C) или же (x ∈ B и y ∈ D)","1u9lf59":"iff (x ∈ A или x ∈ B) и (y ∈ C или y ∈ D)","as732e":"iff x ∈ A ∪ B и y ∈ C ∪ D","wexx8t":"Определение R: верно.","f1tqed":"Определение ∪: верно.","aoju8w":"Определение ×: верно.","14b0xjo":"Возьми x только в A и y только в D. Какая строка ещё верна, а какая уже нет?","182t1qb":"(x ∈ A ∧ y ∈ C) ∨ (x ∈ B ∧ y ∈ D) влечёт (x ∈ A ∨ x ∈ B) ∧ (y ∈ C ∨ y ∈ D), но не наоборот: x ∈ A, y ∈ D удовлетворяет второму и не удовлетворяет первому. Так что цепочка доказывает только R ⊆ L.","1ouqjtb":"A = {1}, B = {2}, C = {3}, D = {4}. Какая пара лежит в L, но не в R?","195sidr":"1 ∈ A ∪ B и 4 ∈ C ∪ D, значит (1, 4) ∈ L. Но (1, 4) ∉ A × C (4 ∉ C) и ∉ B × D (1 ∉ B).","5cl0jk":"Разверни стрелки","12mkr6l":"R⁻¹ — это R, у которого развернули каждую стрелку: b R⁻¹ a iff a R b. Выходящие стрелки R становятся входящими стрелками R⁻¹. Заполни таблицу из книги.","k6q8hr":"Разворот стрелок меняет «выход» и «вход»: тотальность (≥ 1 выход) ↔ сюръекция (≥ 1 вход), функция (≤ 1 выход) ↔ инъекция (≤ 1 вход), биекция ↔ биекция.","1gr18q4":"функцией","p4liqy":"сюръекцией","15xfm2r":"инъекцией","1s41zpr":"биекцией","1je17ry":"R тотально iff R⁻¹ является …","46q2ci":"Тотальность: у каждого a ≥ 1 стрелки НАРУЖУ. После разворота в каждое a входит ≥ 1 стрелка: R⁻¹ — сюръекция (пример из книги).","kct4zh":"R — функция iff R⁻¹ является …","prn3la":"Функция: из каждого a выходит ≤ 1 стрелки. После разворота в каждое a входит ≤ 1 стрелки — инъекция.","b6bvvz":"R — сюръекция iff R⁻¹ является …","g9ylgy":"Сюръекция: в каждое b входит ≥ 1 стрелки. После разворота из каждого b выходит ≥ 1 стрелки — R⁻¹ тотально.","1rbn99s":"R — инъекция iff R⁻¹ является …","1oc2u8s":"Инъекция: в каждое b входит ≤ 1 стрелки. После разворота из каждого b выходит ≤ 1 стрелки — R⁻¹ функция.","1es1950":"R — биекция iff R⁻¹ является …","1mf8p6t":"Биекция — это ровно одна стрелка из каждого a и ровно одна в каждое b. Разворот сохраняет «ровно одну» с обеих сторон.","161i7yl":"Док скелетов","plv9cd":"Режим письма · мидтерм 1","k1s83z":"Та же сумма, что в скелете индукции, — теперь через WOP. Заполни пропуски; можно и ASCII: != для ≠, ^2 для ², emptyset для ∅.","ls3z3x":"C с ≠ · непусто · WOP · наименьший m · база: обе части в 0 · m − 1 ∉ C · прибавь последнее слагаемое · m удовлетворяет формуле · противоречие · C = ∅.","b84xws":"Настоящий Ex1 2024: Σₖ₌₀ⁿ k·2ᵏ = (n − 1)2ⁿ⁺¹ + 2. Набери ^m для ᵐ.","w9tiu8":"Формула для m − 1: замени n на m − 1 везде: (m − 2)2ᵐ + 2. Потом прибавь m·2ᵐ и собери: (2m − 2)2ᵐ = (m − 1)2ᵐ⁺¹.","mn0661":"От противного · √5 иррационально","1bevmqu":"Скелет для √2, но с 5. Назови факт, который используешь, когда 5 | a².","1yzpcfp":"Для простого p: p | a² ⇒ p | a (лемма Евклида). Для √6 используй простое 2: a² = 6b² ⇒ a чётно ⇒ 2k² = 3b² ⇒ b чётно.","wspf1u":"Ex2 · общезначимость разбором случаев (2024 Ex2.1)","hkxuaa":"(P → Q) → ((P → R) → (P → (Q ∧ R))) общезначима. Заполни доказательство разбором случаев.","1b3sym6":"Выбери переменную, которая «убивает» больше всего импликаций (здесь P). Скажи, почему каждый случай даёт T, потом — «случаи исчерпывающие».","121djlo":"Ex2 · не общезначима (2024 Ex2.2)","1eg28u2":"((P → Q) → (P → R)) → (P → (Q ∧ R)) не общезначима. Напиши ответ на 1 балл.","ob8or9":"Сделай заключение ложным (P = T и Q ∧ R = F), потом сделай посылку истинной (Q = F «убивает» P → Q). Вычисли каждую подформулу.","2miint":"B^A = тотальные функции A → B. Часть 1 (2 балла) для k, n ≥ 1; часть 2 (1 балл) для A = ∅. Набери ^k для ᵏ.","1xqcrg":"Тотальная функция = ровно одна стрелка из каждого элемента = k независимых выборов по n вариантов = nᵏ. Если A = ∅, пустое отношение — единственная тотальная функция: n⁰ = 1.","ds1zmf":"Погоня за элементом · A ∩ (B − C)","utzryt":"Докажи A ∩ (B − C) = (A ∩ B) − C. ASCII: iff для ⟺, cap для ∩, notin для ∉.","1afs1l":"Разверни (∩ → ∧, − → ∧ ¬), перегруппируй по названному закону, сверни обратно. Только звенья iff, потом «множества равны».","12gbiyv":"Берег домино","1ws8g0t":"Гл. 5 · Индукция","wrhs2g":"Индукция — это ряд домино","mnfhtb":"База: толкни первое домино. Шаг: каждое домино роняет следующее. Вместе: падают все — P(n) для каждого n.","zc7ggn":"Сильная индукция: домино может нуждаться в нескольких более ранних (n − 4 для марок). Тогда нужно столько же баз.","m1s85r":"Обычная: толкни 0 и смотри. Теперь сломай шаг в 2 — это ошибка про лошадей.","1p4sk9m":"Марки: если толкнуть только 12, какие останутся стоять? Добавляй базы, пока не упадут все.","1t0xd4f":"Два назад: почему две базы?","patfb0":"Шаг = добавить следующий кусок","yzdiip":"В доказательстве для суммы шаг отщепляет последнее слагаемое: Σ до n + 1 = (Σ до n) + новое слагаемое; потом используется IH.","1wf4i6i":"Представь: нечётные числа — это уголки (L), которые наращивают квадрат.","7ncc3u":"Увеличивай n: какого цвета новый уголок и сколько клеток он добавляет?","1ngtdu3":"Скелет","1tj6y7j":"Выбери верную формулу: база ✓ и шаг ✓ везде.","961m8v":"Сдвинь правую часть на c = 1: строка шага остаётся ✓, ломается только база.","1dbfvhz":"Выбери Σ k² = n²(n + 1)/2: шаг ломается — и появляется наименьший контрпример.","g9tiw0":"Марки по 4 и 5","bayiea":"Любую сумму n ≥ 12 можно оплатить марками по 4 и 5 центов. Докажи это сумма за суммой, как это делает сильная индукция: либо это база (распиши её), либо она получается из n − 4 добавлением одной марки в 4 цента.","1tr47xl":"Шаг тянется назад на 4 места, поэтому нужно 4 базы (12, 13, 14, 15). 11 оплатить нельзя вообще, поэтому утверждение начинается с 12. Это сильная индукция: P(n+1) использует P(n−3), а не P(n).","1dbbik3":"Найди ошибку","kmy8ey":"Каждое «доказательство» ниже сломано. Выбери настоящую проблему.","pni5g2":"Доказательству по индукции нужна верная база, соответствующая утверждению, и шаг, работающий для каждого n начиная с базы, включая самое маленькое.","152hxhs":"«Все лошади одного цвета». Шаг: из n + 1 лошадей убираем первую → n лошадей, один цвет (IH); убираем последнюю → один цвет (IH); группы пересекаются, значит все n + 1 одного цвета. Где ошибка?","2itma4":"База n = 1 ложна","urudfy":"Шаг не работает при n = 1: группы {h₁} и {h₂} не пересекаются","5vxz4t":"IH нельзя использовать дважды","w1lll":"Лошадей нельзя посчитать","b9ts3s":"При n + 1 = 2 в каждой группе одна лошадь, и общих нет, так что ничто не связывает два цвета. Шаг должен работать для каждого n ≥ базы.","cza232":"Утверждение: n² + n + 1 чётно для каждого n ∈ ℕ. Шаг: если n² + n + 1 чётно, то (n+1)² + (n+1) + 1 = (n² + n + 1) + 2(n + 1) чётно. Что не так?","1uldyfe":"Всё в порядке, доказательство верное","13aw4bf":"Алгебра в шаге неверна","14zymne":"Нет базы, а P(0) ложно: 1 нечётно","mes67b":"Нужна сильная индукция","pu2tz8":"Шаг верен, но шаг без верной базы ничего не доказывает. На самом деле n² + n + 1 = n(n + 1) + 1 всегда нечётно.","3f4p6":"Сильная индукция: база P(0); шаг: P(n + 1) доказывается из P(n − 1) для каждого n ≥ 1. Чего не хватает?","cgn86i":"Ничего","1212wuy":"Базы P(1): от P(0) шаг доходит только до 2, 4, 6, …","jv3as2":"IH должно быть только P(n)","1jeimxt":"Утверждение должно начинаться с 1","1487l7l":"Каждый шаг прыгает на 2. От P(0) доходишь только до чётных, так что P(1) нужна своя база.","1seee0d":"«Предположим, P(n) верно для всех n ∈ ℕ. Тогда P(n + 1) верно, значит утверждение доказано». Что не так?","19jvnsw":"IH — это само утверждение: порочный круг","iicuii":"Надо было написать n ≥ 1","1hittzm":"Надо было использовать WOP","12j04bi":"IH — это P(n) для одного фиксированного n. Предполагать его для всех n — значит предполагать то, что доказываешь.","15lhcc8":"Обычная или сильная?","i6pxq0":"Для каждого утверждения: хватает ли предыдущего случая P(n), или P(n + 1) нужны случаи ещё раньше?","pkpbd6":"Сильная индукция — то же доказательство с бо́льшим IH: P(0), …, P(n). Используй её, когда n + 1 зависит от n − 3, от двух предыдущих значений или от делителей n + 1.","1dmdbwj":"хватает обычной","18rf3jl":"нужна сильная","1jva8i":"Σ до n + 1 = Σ до n + (n + 1): используется только P(n).","rtojj4":"Каждое n ≥ 12 есть 4a + 5b, доказательство «по маркам»: n + 1 = (n − 3) + 4","1fyxl0k":"Это доказательство строит n + 1 из n − 3, то есть использует P(n − 3), а не P(n): сильная индукция с базовыми случаями 12–15. (Шаг только из P(n) тоже существует: замени одну 4 на 5 или три 5 на четыре 4.)","1c06mnm":"Каждое n ≥ 2 — произведение простых","1b5ts5n":"Если n + 1 = a·b, нужны P(a) и P(b) для меньших a, b — любых.","c8g1wx":"2ⁿ⁺¹ = 2·2ⁿ ≥ 2(n + 1) ≥ n + 2 использует только P(n).","1tz1i7l":"Фибоначчи: F(n) < 2ⁿ","18fgblb":"F(n + 1) = F(n) + F(n − 1) требует двух предыдущих случаев.","1mg76te":"3 делит n³ + 2n","qk3ssy":"(n+1)³ + 2(n+1) = (n³ + 2n) + 3(n² + n + 1): только P(n).","xfuz4y":"Босс: сумма степеней двойки","1dfpbyq":"Собери доказательство Σₖ₌₀ⁿ 2ᵏ = 2ⁿ⁺¹ − 1 для всех n ∈ ℕ. Нажимай строки в правильном порядке; после строки с равенством выбери обоснование. Некоторые строки — ловушки.","3pq08c":"Метод · предикат · база для первого n · IH отмечено · шаг отщепляет последнее слагаемое и использует IH · вывод с ∎.","avyror":"Доказательство. Индукцией по n, с P(n) ::= Σₖ₌₀ⁿ 2ᵏ = 2ⁿ⁺¹ − 1.","155doqs":"База n = 0: Σₖ₌₀⁰ 2ᵏ = 2⁰ = 1 и 2¹ − 1 = 1, значит P(0) верно.","1v3cpwk":"Шаг индукции: пусть n ≥ 0, и предположим P(n) (IH).","6oytdn":"отщепляем последнее слагаемое","1fmxnqk":"= 2·2ⁿ⁺¹ − 1 = 2ⁿ⁺² − 1, значит P(n + 1) верно.","herrzz":"По индукции P(n) верно для всех n ∈ ℕ. ∎","11he9or":"Предположим, P(n) верно для всех n ∈ ℕ.","1nea2lk":"Это само утверждение (порочный круг). IH — это P(n) для одного фиксированного n.","std1fk":"База n = 1: 1 + 2 = 3 = 2² − 1.","1xx9is0":"Утверждение начинается с n = 0, значит база — n = 0.","p6ujzx":"Проверим n = 0, 1, 2, 3: работает, значит работает всегда.","uodyde":"Примеры — не доказательство.","10juzfi":"по WOP","1mcgp0i":"по определению P","1gixen3":"Двор с памятником Биллу","zqrrp2":"Двор 2ⁿ × 2ⁿ надо замостить L-образными плитками, оставив одну центральную клетку для статуи Билла. Замости сам, посмотри, почему очевидная индукция застревает, а потом — как работает более сильное утверждение.","t81v4u":"Если шаг индукции застрял, попробуй БОЛЕЕ СИЛЬНОЕ предположение: «Билл где угодно» вместо «Билл в центре». Более сильное P(n) даёт больше того, чем можно пользоваться в шаге, — а исходная теорема становится частным случаем.","1j3fkpo":"Замости · n = 2","d38zi9":"Обречённая попытка","1jiwbb2":"P(n) ::= «существует замощение двора 2ⁿ × 2ⁿ с Биллом в центре». Почему шаг индукции застревает?","153ubl4":"Разрежь двор 2ⁿ⁺¹ на четыре четверти 2ⁿ: ни в одной Билл не стоит в ЕЁ центре, так что P(n) о них ничего не говорит","8x0i65":"База P(0) ложна","1k0aoym":"4ⁿ⁺¹ − 1 не делится на 3","i4woie":"L-плитки нельзя поворачивать","5gf3lo":"Билл стоит в углу одной четверти, а в остальных четвертях Билла нет вовсе. P(n) говорит только о дворах с Биллом в центре, поэтому к четвертям его не применить.","1bi24j4":"Что делает книга вместо этого?","wqicif":"Усиливает P(n): для КАЖДОГО положения Билла остаток можно замостить","ymgdxn":"Ослабляет P(n): только для n ≤ 3","all2zo":"Использует сильную индукцию с тем же P(n)","4btrcu":"Доказывает через WOP с тем же P(n)","1rixkb8":"С «Биллом где угодно» каждая четверть становится меньшим двором ровно с одной занятой клеткой — и P(n) применимо ко всем четырём.","e25o2o":"Смотри, как работает сильное утверждение · n = 3","1qoi4r8":"Подсчёт","1pdsxcu":"Сколько L-плиток покрывает двор 2⁴ × 2⁴ = 16 × 16 (Билл занимает одну клетку)?","hy6hgm":"Каждая плитка покрывает 3 клетки, а свободных клеток 16·16 − 1.","dy2esn":"Игра в разборку стопки","ksxzfn":"Стопка из 10 коробок. Ход делит одну стопку на две высотой a и b и приносит a·b очков. Сыграй дважды, двумя разными стратегиями, и сравни.","qv9zgf":"Любой способ разобрать n коробок приносит n(n − 1)/2 очков. Доказательство — СИЛЬНАЯ индукция: первый разрез даёт a и b с a + b = n + 1, и нужны P(a) и P(b) для любых меньших a, b.","1ksx8fo":"Игра · n = 10","1lhfu8a":"Предскажи","1c4u4ch":"Сколько очков ты наберёшь за стопку из 20 коробок?","izdsci":"n(n − 1)/2 = 20·19/2 = 190, что бы ты ни делал.","b7zl3j":"Обе твои игры с 10 коробками дали 45 = 10·9/2.","1njeovm":"Доказательство","fnkgjr":"Какая индукция доказывает «любой способ разобрать n коробок даёт n(n − 1)/2 очков»?","1rcm4ow":"Сильная индукция: первый разрез даёт стопки размеров a и b, и доказательству нужны P(a) и P(b)","10yqof9":"Обычная индукция от P(n) к P(n + 1)","1vwn2zi":"Никакая: достаточно проверить n = 1, …, 10","tyang6":"a и b могут быть любыми с a + b = n + 1, поэтому шагу нужно P(k) для каждого k ≤ n: сильная индукция.","1v2sktf":"В шаге: ab + a(a − 1)/2 + b(b − 1)/2 равно …","15k79l0":"ab + (a² − a + b² − b)/2 = ((a + b)² − (a + b))/2 = (n + 1)n/2. Это и есть P(n + 1).","1ff56mu":"Лошади и пропавшая единица","1eg77hb":"Два доказательства по индукции ложных теорем из книги. В обоих шаг тихо ломается при одном маленьком n. Найди строку.","1gwr3wp":"Шаг P(n) → P(n + 1) должен работать для КАЖДОГО n начиная с базы. Проверь самое маленькое n руками: «…» и «остальные слагаемые» прячут случаи, когда не остаётся ничего.","4q7iy3":"§5.1.6 · Ложная теорема 5.1.3","fb5qre":"Ложная теорема: в любом множестве из n ≥ 1 лошадей все лошади одного цвета.","1685u2y":"База n = 1: в множестве из одной лошади лошадь одного цвета сама с собой.","1gn8d5e":"Шаг индукции: предположим P(n) для некоторого n ≥ 1 и возьмём n + 1 лошадей h₁, h₂, …, hₙ, hₙ₊₁.","bk31bx":"По P(n) первые n лошадей h₁, …, hₙ одного цвета.","yi6pi5":"По P(n) последние n лошадей h₂, …, hₙ₊₁ одного цвета.","l8ldce":"Значит, h₁ того же цвета, что и остальные лошади, кроме hₙ₊₁, то есть h₂, …, hₙ — и hₙ₊₁ тоже.","1xjn6rg":"Следовательно, все n + 1 лошадей одного цвета, и P(n + 1) верно.","2ofodr":"База верна.","2f3j4a":"Это правильное применение P(n): здесь n лошадей.","w8abuu":"Возьми n = 1: лошади — это только h₁ и h₂. Кто такие «остальные лошади»?","1152o4r":"При n = 1 никаких «остальных лошадей» h₂, …, hₙ нет: группы {h₁} и {h₂} не имеют общих, так что ничто не связывает их цвета. Шаг P(1) → P(2) не работает, и цепочка домино рвётся сразу после первого.","dsj0d2":"Студент говорит: «Ошибка в том, что P(n) ложно при n ≥ 2, а доказательство его предполагает». Почему за это не дают баллов?","41v3zv":"Предполагать P(n) — ровно то, что делает шаг индукции; ошибка в том, что импликация P(1) → P(2) не доказана","njuwkn":"Потому что P(n) на самом деле верно","4518ka":"Потому что база должна быть n = 0","sjiv5b":"Потому что студенту надо было использовать сильную индукцию","1ppqdzj":"Шаг индукции доказывает P(n) → P(n + 1); предполагать P(n) в нём можно. Настоящая дыра — одно конкретное n, для которого эта импликация не показана.","13i1a5s":"Задача 5.7","136hy4g":"Ложная теорема: для всех n ≥ 0 верно 2 + 3 + 4 + ⋯ + n = n(n + 1)/2.","byeqs5":"Пусть P(n) ::= 2 + 3 + 4 + ⋯ + n = n(n + 1)/2.","tpsfj5":"База: P(0) верно, так как обе части равны 0 (сумма без слагаемых равна 0).","he6gs2":"Шаг индукции: пусть P(n) верно для некоторого n ≥ 0.","8c3wrw":"= n(n + 1)/2 + (n + 1), по P(n)","1gjoqrn":"= (n + 1)(n + 2)/2, значит P(n + 1) верно. По индукции P(n) для всех n ∈ ℕ.","1hna4kz":"Строго говоря, это верно: при n = 0 в сумме нет слагаемых, значит она равна 0, и 0·1/2 = 0.","oewc5k":"Шаг начинается именно с предположения P(n) для одного n.","2b5y3n":"Раз верна строка выше, это просто P(n).","qaluc8":"Алгебра верна.","sz2xdu":"Прогони шаг при n = 0. Какие слагаемые есть в сумме 2 + 3 + ⋯ + (n + 1), когда n + 1 = 1?","tpnzui":"При n = 0 левая часть — «2 + ⋯ + 1», сумма БЕЗ слагаемых, то есть 0, — а не [2 + ⋯ + 0] + 1 = 1. Шаг с разбиением неверен при n = 0, так что P(0) → P(1) не доказано. И действительно, P(1) говорит 0 = 1.","fq0iab":"Гавань инвариантов","qih9ch":"Гл. 6.1–6.3 · Автоматы","1gme55c":"Инвариант — это цвет, с которого не уйти","1tq6qo1":"Сохраняемый предикат P (preserved invariant): если P верно в состоянии, оно верно и после любого хода. Если оно верно и в начале, то верно в каждом достижимом состоянии.","1at21ay":"Раскрась состояния по P: прогулка никогда не меняет цвет, значит цель другого цвета недостижима.","12n1tg9":"Диагональные ходы: попробуй добраться до (1, 0).","17cw1w":"Переключись на прямые ходы: держится ли цвет? Почему из-за этого (1, 0) становится достижимой?","hfrh5i":"Кувшины: НОД никогда не меняется","1qymi3k":"Каждое новое количество собирается из старых количеств и объёмов кувшинов через + и −, поэтому НОД(a, b) всегда делит то, что в кувшинах.","9iptl7":"A = 5, B = 3: получи 4 литра.","qlhnkh":"A = 12, B = 6: какие количества вообще появляются?","1nmxw67":"Производные переменные — это датчики","1xrf21j":"Производная переменная (derived variable) — число, вычисляемое по состоянию. Для завершения нужна переменная со значениями в ℕ, которая строго убывает при каждом ходе.","ratci9":"Запусти программу из книги: y·xᶻ остаётся равным aᵇ в каждой строке, а z только уменьшается.","14qjd4u":"Включи ошибку: инвариант ломается в одной строке, и ответ неверен.","vwf52s":"Поставь b = 0: машина сразу останавливается с y = 1 = a⁰.","1paljql":"Робот-слон","16fuka6":"Робот ходит только по диагонали: (±1, ±1). Посети цели A и B. Одна цель недостижима никогда: объяви её и выбери инвариант, который это доказывает.","12raajz":"P ::= «m + n чётно». Каждый ход меняет m + n на +2, 0 или −2, P(0, 0) верно, значит P верно в каждом достижимом состоянии. У (1, 0) m + n = 1, значит она недостижима.","qudkjt":"Кувшины из «Крепкого орешка»","17io4h7":"Часть 1: кувшины на 5 л и 3 л. Получи ровно 4 л в большом кувшине. Часть 2: кувшины на 18 л и 12 л. Можно ли получить 4 л? Если нет, скажи почему.","13l3w81":"Новые количества — всегда суммы и разности старых количеств и объёмов кувшинов, поэтому «НОД(a, b) делит оба количества» сохраняется. НОД(5, 3) = 1 позволяет получить 4; НОД(18, 12) = 6 — никогда.","xo9j9e":"Читай датчики","1efckqq":"Производная переменная — число, вычисляемое по состоянию. Классифицируй каждую: что с ней делает каждый возможный ход? Выбирай самое сильное из верных свойств.","i32ny7":"Для «ничего из этого» нужен один ход вверх и один вниз. Для ↑s, ↑w и const нужна алгебра для каждого типа хода. Для завершения нужна строго убывающая переменная со значениями в ℕ.","9iljp0":"↑s строго возрастает","n20xhv":"↑w нестрого возрастает","529jx6":"↓s строго убывает","116efxt":"↓w нестрого убывает","1wdffch":"Монеты (h орлов, t решек). Ходы: перевернуть x орлов и y решек при x + y = 10; или, если h ≥ 1, добавить h + 1 решек. Переменная C = h + t.","w051cf":"Переворот: (h − x + y) + (t + x − y) = h + t, без изменений. Добавление: рост на h + 1. Никогда вниз, и не ↑s, потому что переворот сохраняет значение.","1tk8fpm":"Монеты. Переменная H = h.","1e2g40c":"Переверни 10 орлов: h уменьшается на 10. Переверни 10 решек: h увеличивается на 10.","3olm7x":"Монеты. Переменная H mod 2.","h37soi":"Переворот: новое h = h + 2y − 10, разница чётна. Добавление: h не меняется. Значит, чётность h никогда не меняется.","9ymw66":"Монеты. Переменная C mod 2.","qqyymo":"Переворот сохраняет C. Добавление меняет C на h + 1: при чётном h чётность C переключается туда и обратно (0 → 1 → 0).","qv0eml":"Евклид: (x, y) → (y, x mod y), пока y > 0. Переменная y.","1ps82o5":"x mod y < y. Это обратный отсчёт, который доказывает завершение.","13z5jyh":"Евклид. Переменная x + y.","adcwi5":"y + (x mod y) ≤ y + x, но (12, 18) → (18, 12) сохраняет 30.","tc6683":"Евклид. Переменная x.","1gxukj9":"(12, 18) → (18, 12) увеличивает x; (48, 18) → (18, 12) уменьшает.","11k9qwh":"Копилка: начало 0, ходы +2 и +3. Переменная n.","7ul70g":"Каждый ход прибавляет 2 или 3, оба > 0.","fq6rw9":"Босс: один одинокий орёл","1tonqco":"Из (98 орлов, 4 решки) ходами «перевернуть 10» и «добавить h + 1 решек» докажи, что состояние ровно с одним орлом недостижимо.","tbegkq":"Доказательство инвариантом: назови P · покажи, что каждый тип хода сохраняет P · P(начало) · принцип инварианта · цель нарушает P.","1aqbqaq":"Пусть P((h, t)) ::= «h чётно».","u0f5o4":"Переворачиваем x орлов и y решек (x + y = 10): новое h равно h − x + y = h + 2y − 10.","taz411":"опр. хода","7d8qc":"Разность 2y − 10 чётна, значит h сохраняет чётность.","2nz169":"Добавляем h + 1 решек: h не меняется.","w30bfi":"Итак, P сохраняется, и P((98, 4)) верно, потому что 98 чётно.","1cjq82d":"Значит, P верно в каждом достижимом состоянии.","79s6lb":"принцип инварианта","pa5vy9":"Ровно один орёл — это h = 1, а это нечётно, так что это состояние недостижимо. ∎","ixdc6a":"Мы сделали 50 случайных ходов и ни разу не получили одного орла.","10fzrkl":"Эксперименты — не доказательство.","17g7y8u":"H = h строго убывает, поэтому никогда не дойдёт до 1.","1n4eocz":"Неверно: переворот 10 решек увеличивает h. А убывание только облегчило бы попадание в 1.","8mflk":"P сохраняется, потому что верно в каждом достижимом состоянии.","lo739i":"Порочный круг: достижимые состояния — это то, что принцип инварианта даёт в самом конце.","1icgkym":"Быстрое возведение в степень","152bf4x":"Регистровая машина из книги вычисляет aᵇ за очень малое число умножений. Прогони её вручную на a = 2, b = 13, потом найди инвариант, который доказывает правильность, и производную переменную, которая доказывает остановку.","176ozy8":"Частичная корректность: сохраняемый инвариант z ∈ ℕ AND y·xᶻ = aᵇ, верный в начале (1·aᵇ) и в конце (z = 0 даёт y = aᵇ). Завершение: z со значениями в ℕ строго убывает (Th 6.3.2).","1mjy444":"Прогони машину · a = 2, b = 13","1h02uo0":"Почему это верно","wod5ac":"Какая производная переменная одинакова во всех состояниях?","uyzrdt":"Последний столбец твоей таблицы: y·xᶻ = 2¹³ = 8192 в каждой строке. Вместе с z ∈ ℕ это сохраняемый инвариант (6.1).","1ct0as9":"Нечётный случай: (x, y, z) → (x², xy, (z − 1)/2). Почему y·xᶻ сохраняется?","1gp59q6":"Потому что z нечётно","64n1u5":"Потому что x² > x","1vkrtw2":"В нечётном случае не сохраняется","1s53vxq":"Вычисление из книги, с. 184: множитель x, который уходит в y, — это ровно тот x, который теряется в показателе.","gvomy0":"Почему машина всегда останавливается?","1nse63k":"z — натуральное число и строго убывает при каждом переходе","ci6nr9":"x растёт, поэтому она должна остановиться","cj6epg":"y·xᶻ постоянно","dzkj1a":"Потому что b конечно","1rkfgdk":"Строго убывающая производная переменная со значениями в ℕ допускает не больше f(начало) переходов (Th 6.3.2). Здесь z каждый раз уменьшается хотя бы вдвое.","1935k2s":"Невозможная «пятнашка»","x2zx7g":"Фишки 1 … 15 в рамке 4 × 4. Можно ли получить «невозможное» — все фишки в обратном порядке? Инвариант из книги: p(L) = число пар не по порядку в списке при чтении, i = номер строки пустой клетки, чётность = (p(L) + i) mod 2.","1sl7n16":"Чётность (p(L) + i) mod 2 — сохраняемый инвариант: ходы вбок ничего не меняют, ходы вверх/вниз меняют p(L) на нечётное число, а i — на 1. В начале чётность 0, у цели 1, значит цель недостижима.","f2lein":"Играй и следи за чётностью","110nshp":"Цель","1ktrm6e":"«Невозможное» читается как 15, 14, 13, …, 2, 1. Сколько пар не по порядку в этом списке?","88t6th":"Каждая пара не по порядку: 15·14/2 = 105.","qjgqtk":"Какие пары в убывающем списке стоят не по порядку?","1uk4w32":"Вывод","19e2lc0":"Пустая клетка «невозможного» в строке 4. Его чётность равна …","g9m97p":"1, так как 105 + 4 = 109 нечётно","1u0qhj1":"0, так как 105 нечётно, а 4 чётно","wlh8rf":"0, как у начала","b4xh6i":"(105 + 4) mod 2 = 1, а у начала (0 + 4) mod 2 = 0.","n6wfpm":"Значит, «невозможное» недостижимо, потому что …","8okqe":"каждый ход сохраняет чётность, а у начала и у цели чётности разные","13ggiir":"на это нужно слишком много ходов","1behu4w":"пустая клетка не может попасть в строку 4","1xsk1n4":"105 — слишком много","okf108":"Принцип инварианта: у каждого достижимого состояния чётность начала, 0. У цели — 1.","1bep7sf":"Бухта балконов","982lnr":"Гл. 6.4 · Устойчивые паросочетания","h5thc2":"Ритуал, день за днём","1festev":"Каждый день каждый ухажёр идёт к лучшей партнёрше, которая ему ещё не отказала; каждая из выбирающих оставляет фаворита и отказывает остальным. Когда никому не отказали, все женятся.","1rgefmk":"Те же списки могут дать другое паросочетание, когда серенады поёт другая сторона: ухажёры получают оптимального партнёра, выбирающие — пессимального.","1v7ahyz":"Пройди по дням экземпляр босса Ex2.","1nn5zt9":"Переключись на «поют женщины»: кто выигрывает, кто проигрывает? Сравни суммы рангов.","c995jp":"Построй своё паросочетание и найди мятежные пары.","1mo4124":"Почему результат устойчив","1ot36c":"Дневной судья","wts96x":"Днём ты — каждая из женщин. Мужчины спели серенады; у кого несколько ухажёров, та оставляет того, кто выше в ЕЁ списке. Выбери его. Два раунда: 3 пары, потом 4.","1bemkd9":"Поют мужчины, поэтому каждый мужчина получает оптимальную жену, а каждая женщина — пессимального мужа (Th 6.4.9), даже если мужчина получает последний вариант из своего списка.","r53djd":"Раунд 1 · 3 пары","qy2jsd":"Раунд 2 · 4 пары","sgkh7e":"Разбор","1lsgnw4":"Во втором раунде Adam женился на Zoe — ПОСЛЕДНЕМ имени в своём списке. Zoe — его оптимальная жена?","y7o6wb":"Да: пели мужчины, значит каждый мужчина получает оптимальную жену — ни одно устойчивое паросочетание не даёт Adam никого лучше","18yvart":"Нет: оптимальная — значит первый выбор","19rw239":"Только если Zoe любит его больше всех","k1dbxt":"Оптимальная = лучшая среди ДОПУСТИМЫХ жён (тех, что встречаются в каком-то устойчивом паросочетании), а не первый выбор.","1ch5js5":"Охотник на мятежников","fw4jgc":"Четыре паросочетания, те же люди. Для каждого найди мятежную пару (нажми мужчину, потом женщину) или объяви паросочетание устойчивым.","14u71c9":"Проверяй построчно: для каждого мужчины и каждой женщины, которую он предпочитает своей жене, — предпочитает ли она его своему мужу? Одно «да» — мятежная пара.","1a79921":"Верно или нет","1qsowyi":"Факты о брачном ритуале. Это баллы Ex4.","eru6bs":"Её ухажёр только улучшается · если ухажёр появился, он есть всегда · вычеркнутые имена не возвращаются · ухажёры оптимальны, выбирающие пессимальны.","1q4a3vd":"Если у женщины появился ухажёр, то в каждый следующий день у неё есть ухажёр.","ta2vyl":"Она отказывает мужчине, только когда рядом есть лучший.","1ysj3tl":"Ухажёр женщины может стать хуже от одного дня к другому.","12n3135":"Она оставляет лучшего; новый заменяет его, только если он для неё лучше.","ifko83":"Мужчина может петь серенаду женщине, которую раньше вычеркнул.","bz5znk":"Вычеркнутые имена не возвращаются.","1jrfo7q":"Если поют мужчины, каждая женщина получает оптимального мужа.","1nu40df":"Она получает ПЕССИМАЛЬНОГО мужа. Поют женщины ⇒ оптимальны женщины.","1arkmig":"Мужчина и женщина, которые друг для друга первый выбор, женаты в каждом устойчивом паросочетании.","1sy4r0m":"Иначе они были бы мятежной парой.","b9k1i6":"При n мужчинах и n женщинах ритуал может закончиться тем, что кто-то останется без пары.","118absz":"Инвариант: если w отказала m, у неё есть ухажёр. Значит, у каждой женщины в конце есть ухажёр, и все женаты.","1b3kngz":"Босс: Ex2","4j9uub":"Новые списки. Прогони ритуал, где ухажёры — мужчины (можно на бумаге), впиши свадьбы, потом выбери фразу, которая приносит баллы.","1008hm7":"Ex2 = таблица по дням + «По Th 6.4.9 каждый мужчина женат на своей оптимальной жене». Одна устойчивость ещё не значит оптимальность.","y7xsga":"Шаг 1 · свадьбы","11ikjc0":"Шаг 2 · фраза","j3067t":"Какая фраза доказывает «каждый мужчина получает оптимальную жену»?","1709any":"Брачный ритуал с мужчинами-ухажёрами заканчивается этим паросочетанием; по Th 6.4.9 каждый мужчина женат на своей оптимальной жене.","1lfaxd9":"Это паросочетание устойчиво, значит у каждого мужчины оптимальная жена.","1jxm0si":"Каждый мужчина получил свой первый выбор, значит оно оптимально.","2xwc8q":"Одной устойчивости мало: устойчивых паросочетаний может быть несколько. Оптимальность даёт теорема о ритуале, где поют мужчины.","1qt20j5":"Какой ритуал даёт каждой ЖЕНЩИНЕ оптимального мужа?","b7fgxh":"поют женщины","3plrzb":"поют мужчины","tx1cao":"любой","14hvujo":"Ухажёры получают оптимального партнёра.","mfi5kb":"Риф рекурсии","6apelo":"Гл. 7 · Рекурсивные данные","1tmjtun":"Строки — это вложенные коробки","1nde96f":"A* определено рекурсивно: λ или ⟨a, s′⟩. Каждая функция на строках (длина, ·, f*) задаётся теми же двумя случаями, и каждая структурная индукция идёт по ним.","5qmvp2":"Проследи |s · t| = |s| + |t| коробка за коробкой.","6sqgfp":"Сделай s пустой: какая строка — база?","3r2u19":"RecMatch: построй, потом посчитай","jbl4fu":"Для «если s ∈ RecMatch, то …» делай индукцию по определению RecMatch: база λ, конструктор [u]v с двумя IH — P(u) и P(v).","uyxelt":"[[]][] и [[][]]: каждая коробка сбалансирована.","y0eo5s":"][ имеет равные счётчики, но не лежит в RecMatch. Какое направление утверждения это убивает?","ynsz69":"Распаковка","15g6l1w":"Строка — это ⟨a, s⟩ (буква слева от меньшей строки) или λ. Выбери следующий шаг переписывания.","1s8ac7m":"Каждое правило «съедает» самую левую букву: ⟨a, s⟩ · t = ⟨a, s · t⟩ · |⟨a, s⟩| = 1 + |s| · f*(⟨a, s⟩) = ⟨f(a), f*(s)⟩.","195n1bh":"⟨a, ⟨b, λ⟩⟩ · «c»: первый шаг?","fxtdax":"⟨a, ⟨b, λ⟩ · «c»⟩ — опр. ·","84l6o7":"⟨a, ⟨b, «c»⟩⟩ одним прыжком","4ex0f0":"⟨a, s⟩ · t = ⟨a, s · t⟩: левая буква остаётся снаружи, · уходит внутрь.","odutms":"⟨a, ⟨b, λ⟩ · «c»⟩: дальше?","1g2hx07":"⟨a, ⟨b, λ · «c»⟩⟩ — опр. ·","1f50p04":"То же правило для внутреннего ⟨b, λ⟩ · «c».","gzv74b":"⟨a, ⟨b, λ · «c»⟩⟩: последний шаг?","9od3l":"⟨a, ⟨b, «c»⟩⟩ = «abc» — λ · t = t","14nmlx7":"⟨a, ⟨b, λ⟩⟩ — t исчезает","1azoijw":"Базовое правило ·.","w040be":"|⟨a, ⟨b, λ⟩⟩|: первый шаг?","1azjb1k":"|⟨a, s⟩| = 1 + |s|. |a| не определено: a — буква, а не строка.","n9u6cm":"f* применяет f к первой букве и рекурсивно идёт по остатку.","2mmx6f":"По какой переменной?","1mz48q":"Прежде чем писать структурную индукцию, реши, по чему вести индукцию и что тебе понадобится. Включает ловушку мидтерма с «если … то».","1hstrin":"Веди индукцию по той переменной, по которой рекурсивны определения. Если утверждение начинается с «если s лежит в рекурсивно определённом множестве», веди индукцию по конструкторам этого множества — и «если» исчезает.","1d2a8ik":"(r · s) · t = r · (s · t). Индукция по …","o8g0vs":"· рекурсивно по левому аргументу; r — самая левая строка в обеих частях.","7htq11":"Случай конструктора для |s · t| = |s| + |t|. В какой строке используется IH?","101bpo0":"Все остальные строки — определения. На экзамене отметь строку с IH.","t9gzrf":"rev(s · t) = rev(t) · rev(s). Какие леммы нужны сначала?","hawmdz":"ассоциативность · и t · λ = t","1e6r7gp":"База: rev(t) = rev(t) · λ. Шаг: (rev(t) · rev(s′)) · ⟨a, λ⟩ нужно перегруппировать.","1uysk8r":"«Если s ∈ RecMatch, то в s столько же [, сколько ]». По чему ведёшь индукцию?","foxpv4":"Структурная индукция по определению RecMatch: случаи λ и [u]v","ip8gru":"Структурная индукция по s ∈ A* со случаями λ и ⟨a, s′⟩","dhvxkl":"Обычная индукция по числу [","1b1pffs":"Ни по чему — это очевидно","12o1nhb":"Посылка сама определена рекурсивно. Индукция по её конструкторам убирает «если»: в случае [u]v получаешь P(u) и P(v) как два IH.","nq5jhf":"Утверждение Q(s) ⇒ R(s), индукцией по s ∈ A*. В случае конструктора ты предполагаешь Q(⟨a, s′⟩). Что нужно получить, прежде чем можно применить IH?","ct7yyx":"Q(s′) — IH говорит лишь Q(s′) ⇒ R(s′)","torye0":"ничего, применяй IH сразу","icr2du":"IH — это импликация. Ей можно пользоваться только после того, как показана её посылка для меньшей строки.","yypce2":"Корректно определено?","bgm8uj":"Корректно ли каждое рекурсивное определение (well-defined)? Если сомневаешься, посчитай в уме f(1), f(2), f(3).","8r7kr3":"База · каждый вызов на меньшем аргументе · не выходит из домена · пересекающиеся случаи согласованы. И осторожно: произведение с базой 0 навсегда 0.","14eok2y":"✓ корректно определено","15dmjlh":"✗ аргумент растёт","qycenq":"✗ нет базы","ix4zr1":"✗ выходит из ℕ","gz7vh6":"✗ случаи конфликтуют","s42luq":"f(0) = 1;  f(n) = 2·f(n + 1) + 1 при n ≥ 1","13njomh":"f(1) нужно f(2), которому нужно f(3), …","3zbwvd":"h(n + 1) = 2·h(n) + 1, и никаких других правил","d45wv6":"h(0) нигде не задано; каждый выбор h(0) даёт другую функцию.","171j3gu":"p(0) = 0;  p(n) = p(n − 2) + 1 при n ≥ 1","7x4ia2":"p(1) = p(−1) + 1, а −1 ∉ ℕ.","qiea49":"Оба вызова меньше n + 1: q(1) = 3, q(2) = 5, q(3) = 11.","1hyezsg":"F(0) = 0, F(1) = 1;  F(n) = F(n − 1) + F(n − 2) при n ≥ 2","1dvvc0o":"Две базы, два вызова на меньших аргументах.","krvl3j":"g(0) = 1;  g(n) = g(n/2) + 1 при n ≥ 1","9s54k6":"g(1) = g(1/2) + 1, а 1/2 ∉ ℕ.","apyt2n":"k(0) = 1;  k(n + 1) = 2·k(n), если n чётно;  k(n + 1) = k(n) + 1 для каждого n","1adtlwf":"Для чётного n действуют оба правила: k(3) было бы и 2·3 = 6, и 3 + 1 = 4.","1piobkn":"a(0) = 0;  a(n + 1) = a(n)·(n + 1). (Здесь вопрос о значениях.) Корректно ли определено?","yw0dnp":"✓ корректно, но все значения равны 0","rqj87t":"✗ определено некорректно","3faudu":"✓ это n!","lv91rl":"✓ это (n + 1)!","1kz55oj":"0 · что угодно = 0. Ловушка мидтерма: с базой 0 все такие последовательности-произведения — одна и та же последовательность 0, 0, 0, …","ui6c37":"Дуэль в ним","16hb9wl":"Кучки 6, 12, 18. Ты ходишь первым; кто берёт последний камень, тот выигрывает. Компьютер играет идеально. Победи.","19lvyzm":"Сложи кучки по xor поразрядно. s ≠ 0: ходящий выигрывает, оставляя s = 0 (кучка t → t xor s). s = 0: любой ход это ломает.","1bdk95y":"Босс: Ex1","ulz7mn":"Два доказательства структурной индукцией. Нажимай строки по порядку и давай обоснование каждому равенству. Во втором есть «если … то», как на мидтерме.","1p7o49b":"Предикат · база λ · конструктор с отмеченным IH · обоснования в каждой строке · вывод. Для «если s ∈ RecMatch» веди индукцию по конструкторам RecMatch: два IH для [u]v.","16vlcds":"Доказательство 1 · (g ∘ f)*(s) = g*(f*(s)) — мидтерм 2024","175shhv":"Доказательство. Структурной индукцией по s ∈ A*, с P(s) ::= (g ∘ f)*(s) = g*(f*(s)).","1xyd5go":"База s = λ: (g ∘ f)*(λ) = λ = g*(λ) = g*(f*(λ)), значит P(λ) верно.","ka3qwp":"опр. *","19xgqmm":"Случай конструктора s = ⟨a, t⟩: предположим P(t) (IH).","15x4q2e":"опр. ∘ и IH","1n3nsrk":"опр. g*, справа налево","5hd16":"= g*(f*(⟨a, t⟩)), значит P(⟨a, t⟩) верно.","17ivhyn":"опр. f*, справа налево","11a7sza":"По структурной индукции P(s) верно для всех s ∈ A*. ∎","n9nh5g":"Случай конструктора s = ⟨a, t⟩: предположим P(⟨a, t⟩) (IH).","942mt1":"IH — про меньшую строку t, а не про ⟨a, t⟩.","5cv8kh":"База s = ⟨a, λ⟩.","ux4g82":"База A* — это λ.","6e6m26":"только по IH","1rabxtm":"опр. ·","17osfhp":"Доказательство 2 · если s ∈ RecMatch, то #[(s) = #](s)","x2uzmh":"Доказательство. Структурной индукцией по определению RecMatch, с P(s) ::= #[(s) = #](s).","yyufgn":"База s = λ: #[(λ) = 0 = #](λ), значит P(λ) верно.","1ycgyay":"Случай конструктора s = [u]v, где u, v ∈ RecMatch: предположим P(u) и P(v) (IH).","1jo8k08":"считаем скобки","1v91fjk":"IH для u и для v","jf7y6i":"= #]([u]v), значит P([u]v) верно.","1c8wl0u":"По структурной индукции P(s) верно для каждого s ∈ RecMatch. ∎","2vsua3":"Случай конструктора s = ⟨a, s′⟩ с a ∈ {[, ]}: предположим P(s′).","19g6gti":"Это индукция по всем строкам, а «]» сама по себе не лежит в RecMatch. Используй собственный конструктор RecMatch [u]v.","fr4q2y":"Случай конструктора s = [u]v: предположим P(u).","1vwergv":"У [u]v две части, так что нужен IH и для u, и для v.","lqbacm":"IH только для u","uf9z0u":"Плохие определения","1tfrq8c":"Четыре «определения» функций из книги, которые выглядят нормально, но таковыми не являются. Для каждого скажи, что не так. В лаборатории каждое можно развернуть.","fr27ox":"Рекурсивное определение хорошее, когда следует рекурсивной структуре типа данных: базы, и каждый рекурсивный вызов — на аргументе, построенном РАНЬШЕ. Нет базы, вызовы идут вверх, случаи пересекаются — каждое ломает единственность или существование.","347jeu":"f1(n) ::= 2 + f1(n − 1). Что не так?","f8i010":"Нет базы: f1(n) = 2n + c подходит при ЛЮБОЙ константе c, так что f1 определена неоднозначно","yxgohf":"Оно противоречиво","1q2xc5b":"Всё в порядке: f1(n) = 2n","1q7c5lz":"Не определено только в 0","impva0":"Если какая-то f1 удовлетворяет уравнению, то и f1 + c тоже. Ничто не фиксирует значение.","187alux":"f2(n) ::= 0 при n = 0 и f2(n + 1) иначе. Что не так?","cx1tda":"Вызовы идут ВВЕРХ: подходит любая функция, равная 0 в 0 и постоянная в остальных точках, а вычисление никогда не кончается","1b892ck":"У него нет базы","18ktgf7":"Оно противоречиво при n = 6","rbl6qr":"Всё в порядке: f2 тождественно 0","g01tny":"f2(1) = f2(2) = f2(3) = … никогда не доходит до базы. Как программа, она не определена нигде, кроме 0.","mlla8k":"f3(n) ::= 0, если 2 | n;  1, если 3 | n;  2 иначе. Что не так?","rwza41":"Противоречиво: f3(6) = 0 и f3(6) = 1, так что ни одна функция ему не удовлетворяет","1ts60y5":"Нет базы","ovqyvu":"Неединственно: таких функций много","1umsx02":"Первые два случая пересекаются на кратных 6 и требуют разных значений.","1w9fzy6":"f4(n) ::= 1, если n ≤ 1;  f4(n/2), если n > 1 чётно;  f4(3n + 1), если n > 1 нечётно (Коллатц). Каков честный статус?","asjdnf":"Константа 1 ему удовлетворяет, но никто не знает, ЕДИНСТВЕННАЯ ли это такая функция: нечётный случай вызывает больший аргумент","1g1wpvz":"Это совершенно нормальное рекурсивное определение на ℕ","1caqczs":"Так как 3n + 1 > n, индукция по ℕ не может обосновать определение. Его проверили для чисел больше 10¹⁸, но не доказали.","1jcugic":"Диагональная бездна","jcdzf4":"Гл. 8 · Бесконечность и остановка","1ifzdmn":"Счётное = список, который доходит до каждого","1vd7a8x":"Множество счётно (countable), если его можно выписать списком так, что каждый элемент получит конечное место. ℕ × ℕ счётно — если обходить правильно.","1b7lpub":"Обход по диагоналям: какое место у (2, 3)?","1uyojuu":"Построчно: почему (1, 0) так и не получает места?","h7p23k":"Диагональ ускользает от любого списка","twp7sh":"Для ЛЮБОГО списка бесконечных 0/1-последовательностей переверни диагональ: d(n) = 1 − sₙ(n). d отличается от каждой строки, значит, её в списке нет. Поэтому {0,1}^ω и pow(ℕ) несчётны (uncountable).","2q7ane":"Та же самоссылка показывает, что No-halt не распознаваемо (not recognizable).","nn62y1":"Переверни клетку на диагонали: d меняется ровно там.","vhqaev":"Добавь d в список. Полон ли новый список?","1hq1swq":"Стрелки сравнивают размеры","1ej59ci":"A surj B означает: есть сюръективная функция A → B, так что A не меньше B. Для бесконечных множеств размеры сравнивают именно так.","1vr8pfz":"|A| = 4, |B| = 3: можно ли сделать сюръективную функцию? А тотальную инъективную?","o0wel0":"Формы стрелок","ooous6":"На каждой картинке — стрелки из A (слева) в B (справа). Назови форму.","1jgouyc":"функция: ≤ 1 стрелки наружу · тотальна: ≥ 1 наружу · инъективна: ≤ 1 внутрь · сюръективна: ≥ 1 внутрь · биективна: ровно 1 наружу и 1 внутрь. A surj B значит, что A не меньше B.","f34ehw":"Что это?","1rf3e6l":"Из каждого a одна стрелка наружу, в каждое b одна стрелка внутрь.","fd4ddz":"В каждое b попадают, но в x — дважды.","1kzdt5w":"Ни в какое b не попадают дважды, но в y не попадают вовсе.","s7buac":"Из элемента 1 выходят две стрелки: это не функция (а из 3 — ни одной).","ur34dz":"Существует сюръективная функция A → B. Значит …","z11eze":"A не меньше B (A surj B)","13gnyuw":"B не меньше A","1r0gt8j":"A и B одного размера","514mb3":"A покрывает всё B, так что в A элементов не меньше.","d9b3t2":"Кантор: не существует сюръекции A → pow(A). Значит …","tu9gvi":"pow(A) строго больше A, для любого A","48894c":"только для конечного A","b61lsv":"для бесконечного A они одного размера","19o8zk1":"A больше pow(A)","fv6q0x":"Верно для любого множества; поэтому pow(ℕ) несчётно.","1ixlwm4":"Выстрой в ряд","5hkngf":"Счётное значит: список, в котором каждый элемент получает конечное место. Места нумеруются с 0.","151z7kv":"ℤ: зигзаг 0, −1, 1, −2, 2, … · ℕ × ℕ: по диагоналям m + n = 0, 1, 2, …; место (m, n) = (m+n)(m+n+1)/2 + m.","1yx3045":"ℤ выписано как 0, −1, инается с 0","c00l7t":"Какой бы список ты ни дал, диагональ построит последовательность, которой в нём нет.","et9ouz":"Самоссылка","imcvs0":"Программы — это строки, так что программу можно запустить на её собственном коде. No-halt = {s | P_s НЕ останавливается на s}.","11j41ax":"Если бы D распознавала No-halt, то D останавливается на своём коде d ⟺ d ∈ No-halt ⟺ D не останавливается на d. Значит, No-halt не распознаваемо (Th 8.2.2). А его дополнение распознаваемо.","1bzzaiz":"P_halt останавливается на любом входе. Лежит ли её код в No-halt?","r60sth":"Нет: она останавливается на своём коде","1dudzcg":"Да","16pzjvv":"Для No-halt нужно НЕ остановиться на своём коде.","femg6z":"P_loop работает вечно на любом входе. Лежит ли её код в No-halt?","r5wqai":"Нет","1bn20wn":"Она не останавливается на своём коде.","111kbjo":"Пусть D распознаёт No-halt. Запусти D на её собственном коде d. Если D останавливается на d, то …","a2pv7h":"d ∈ No-halt, значит D НЕ останавливается на d — противоречие","m7pkcs":"ничего особенного не происходит","1beu5yz":"D лежит в Always-halt","yiec45":"D останавливается ровно на No-halt. Остановка на d кладёт d в No-halt, а это значит, что D на d не останавливается.","1b1imkc":"Какое множество ЯВЛЯЕТСЯ распознаваемым?","14zo51s":"дополнение No-halt","1va9k5w":"Запусти P_s на s; если остановилась — остановись.","4cwh8":"В доказательстве того, что L не распознаваемо, ты строишь s′ из …","1a9xdw6":"s — кода, который может лежать или не лежать в No-halt","x0nvpc":"распознавателя для No-halt","1vok36i":"пустой строки","1iq7pdm":"только M","1pnxe1g":"Направление всегда от No-halt к L.","1atl1s0":"Босс: Ex3","1riconv":"Докажи, что Empty-halt = {s | lang(P_s) = ∅} не распознаваемо, потом ответь на вопрос-ловушку 2024 года.","1mdcxds":"Предположи распознаватель Q · построй s′ из s · два случая · s ∈ No-halt ⟺ s′ ∈ L · «вычисли s′, запусти Q» распознаёт No-halt · противоречие с Th 8.2.2.","yk6r5b":"Шаг 1 · конструкция","oao61d":"Какую программу s′ ты строишь из const RU_TPL=[["${} tiles = (4${} − 1)/3. First tile: the centre, in the three quarters without Bill. That leaves four ${} × ${} courtyards, each with exactly one occupied square — four smaller copies of the SAME problem with Bill anywhere. That is the stronger P(n).","{1} плиток = (4{2} − 1)/3. Первая плитка: центр, в трёх четвертях без Билла. Остаются четыре двора {3} × {4}, в каждом ровно одна занятая клетка — четыре уменьшенные копии ТОЙ ЖЕ задачи с Биллом где угодно. Это и есть более сильное P(n)."],["d differs from s0 at place 0, from s1 at place 1, …, from s${} at place ${}. Add d as a new row and the new d differs from it on the next diagonal place. No list catches every infinite 0/1 sequence: {0,1}^ω is uncountable.","d отличается от s0 в месте 0, от s1 в месте 1, …, от s{1} в месте {2}. Добавь d новой строкой — и новая d отличается от неё в следующем месте диагонали. Никакой список не ловит все бесконечные 0/1-последовательности: {0,1}^ω несчётно."],["|s · t| = ${} = ${} + ${} = |s| + |t|. Every recursive definition peels one box (constructor ⟨a, s′⟩) until λ (base). A structural induction proof follows exactly the same path: base λ, then ⟨a, s′⟩ with the IH for s′.","|s · t| = {1} = {2} + {3} = |s| + |t|. Каждое рекурсивное определение снимает по одной коробке (конструктор ⟨a, s′⟩), пока не дойдёт до λ (база). Доказательство структурной индукцией идёт ровно тем же путём: база λ, потом ⟨a, s′⟩ с IH для s′."],["The parity flips: with ${} moves m + n changes by an odd amount, so “m + n is even” is NOT preserved — and (1, 0) becomes reachable. An invariant depends on the moves, not on the board.","Чётность переключается: ходом «{1}» m + n меняется на нечётное число, так что «m + n чётно» НЕ сохраняется — и (1, 0) становится достижимой. Инвариант зависит от ходов, а не от доски."],["Every move makes the new amounts from old amounts and the jug sizes by + and −, so “gcd(${}, ${}) divides both amounts” is an invariant: only multiples of ${} ever appear.${}","Каждый ход строит новые количества из старых и объёмов кувшинов через + и −, так что «НОД({1}, {2}) делит оба количества» — инвариант: появляются только кратные {3}.{4}"],["Each colour is one L-shape: layer k has 2k + 1 cells. Adding the next L turns an n × n square into an (n + 1) × (n + 1) square: n² + (2n + 1) = (n + 1)².","Каждый цвет — один уголок: в слое k 2k + 1 клеток. Следующий уголок превращает квадрат n × n в квадрат (n + 1) × (n + 1): n² + (2n + 1) = (n + 1)²."],["Here #[ = ${} = #], yet s ∉ RecMatch: the converse “equal counts ⇒ RecMatch” is FALSE. The claim to prove is only “s ∈ RecMatch ⇒ #[ = #]”.","Здесь #[ = {1} = #], но s ∉ RecMatch: обратное «равные счётчики ⇒ RecMatch» ЛОЖНО. Доказывать нужно только «s ∈ RecMatch ⇒ #[ = #]»."],["${} checks passed, then n = ${} gives ${} = ${}. Any number of passed checks proves nothing about every n; one counterexample disproves the claim.","Пройдено проверок: {1}, а потом n = {2} даёт {3} = {4}. Сколько бы проверок ни прошло, это ничего не доказывает про все n; один контрпример опровергает утверждение."],["Every box has #[ = #]. That is the structural induction: λ has 0 = 0, and [u]v adds one [ and one ] to two boxes that already balance.","В каждой коробке #[ = #]. Это и есть структурная индукция: у λ 0 = 0, а [u]v добавляет одну [ и одну ] к двум уже сбалансированным коробкам."],["z = 0: the machine returns y = ${} = ${}^${}. Now look at the new last column, y·xᶻ: it has the same value in every row. That is the invariant.","z = 0: машина возвращает y = {1} = {2}^{3}. Теперь посмотри на новый последний столбец y·xᶻ: в каждой строке одно и то же значение. Это и есть инвариант."],["Nothing in ${} is smaller than ${}. However you walk down here, you stop after finitely many steps — that is what “well ordered” means.","В {1} нет ничего меньше {2}. Как ни спускайся здесь, остановишься через конечное число шагов — это и значит «вполне упорядочено»."],["${} left points, ${} right points: a total injective function is im а»."],["There is always a smaller element: ${} > … is an infinite decreasing sequence, so ${} is NOT well ordered.","Всегда есть элемент меньше: {1} > … — бесконечная убывающая последовательность, так что {2} НЕ вполне упорядочено."],["I do not understand “${}”. Variables are capital letters; connectives ¬ ∧ ∨ ⊕ → ↔ (or ~ & | ^ -> <->).","Не понимаю «{1}». Переменные — заглавные буквы; связки ¬ ∧ ∨ ⊕ → ↔ (или ~ & | ^ -> <->)."],["The prime ${} needs m/n = ${}, the prime ${} needs m/n = ${}. One fraction cannot be both: ${} is irrational.","Простое {1} требует m/n = {2}, простое {3} требует m/n = {4}. Одна дробь не может быть и тем, и другим: {5} иррационален."],["Look at ${} (selected): one of the women he prefers to his wife also prefers him to her husband.","Посмотри на {1} (он выбран): одна из женщин, которых он предпочитает своей жене, тоже предпочитает его своему мужу."],["${} region(s) wrong — their numbers are red. Test one point of each region: is it in the set?","Неверных областей: {1} — их номера красные. Проверь по одной точке каждой области: лежит ли она в множестве?"],["${} left and ${} right points: for a total function here, injective ⟺ surjective (pigeonhole).","Левых точек {1} и правых {2}: для тотальной функции здесь инъективна ⟺ сюръективна (принцип Дирихле)."],["Tap three squares that form an L to lay a tile; tap a tile to lift it. Squares left: ${}.","Тапни три клетки уголком, чтобы положить плитку; тапни плитку, чтобы снять её. Клеток осталось: {1}."],["Click a box: the stack is cut just above it. A cut of a + b scores a·b. Game ${}.","Нажми коробку: стопка режется прямо над ней. Разрез a + b приносит a·b очков. Игра {1}."],["Your games: ${} points. n(n − 1)/2 = ${} for n = ${} — the strategy does not matter.","Твои игры: {1} очков. n(n − 1)/2 = {2} при n = {3} — стратегия не важна."],["${} of ${} gaps right. Copy the model into your notes if anything was missing.","Верно {1} из {2} пропусков. Перепиши образец в конспект, если чего-то не хватал const app=$('#app');
let view={v:'map'};

function starsOf(id){return prog[id]||0;}
const isMain=L=>L.type!=='explore'&&!L.side;

function starStr(n){return h('span',{class:'stars','aria-label':n+' of 3 stars'},h('b',{},'★'.repeat(n)),'★'.repeat(3-n));}
function renderHeader(){$('#brand-h').textContent=tr('Proof Archipelago');$('#brand-p').replaceChildren('Course quest · chapters 1–8',' · ',`${WORLDS.length} islands, ${allLevels().length} levels`);document.title=tr('Proof Archipelago');

/* ---- navigation with browser history: the system Back button goes level → island → map instead of leaving
   the game, and a reload (or a shared link such as …/#prf/prf1) opens the same place.
   Every history entry carries {pa:1, view, n}; n = how many entries right below it are its own ancestors. */
const depth=v=>v.v==='map'?0:v.v==='island'?1:2;
const hashOf=v=>v.v==='map'?'':'#'+v.w+(v.v==='level'?'/'+v.l:'');
function okView(v){
  const W=v&&v.v!=='map'?WORLDS.find(w=>w.id===v.w):null;if(!W)return {v:'map'};
  if(v.v==='level'){const i=W.levels.findIndex(l=>l.id===v.l);if(i>=0&&unlocked(W,i))return {v:'level',w:W.id,l:v.l};}
  return {v:'island',w:W.id};}
function viewOfHash(){let m=null;try{m=/^#([\w-]+)(?:\/([\w-]+))?$/.exec(location.hash);}catch(e){}
  return okView(m?(m[2]?{v:'level',w:m[1],l:m[2]}:{v:'island',w:m[1]}):null);}
let histOK=true,pend=null,pendT=0;
function hset(push,v,n){if(!histOK)return;const st={pa:1,view:v,n},f=push?'pushState':'replaceState';
  try{history[f](st,'',location.pathname+location.search+hashOf(v));}catch(e){try{history[f](st,'');}catch(e2){histOK=false;}}}
function hstate(){try{const s=histOK&&history.state;return s&&s.pa===1?s:null;}catch(e){return null;}}
function show(v){view=v;render();window.scrollTo({top:0});}
function go(v){
  if(pend)return;
  const d=depth(v),c=depth(view),st=hstate(),n=st?st.n:0;
  if(d<c&&st&&n>=c-d){ /* going up: step back to the ancestor entry, then show v there */
