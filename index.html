<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#d6e5ee">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1826">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Proofs">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Proof Archipelago</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a sea chart. Map view = five chapter islands on one voyage route; island view = a trail of level nodes;
   level view = a play board with hearts, an instruction card and live feedback. Island colours follow the chapter tabs. */
:root{
  --sea:#d6e5ee; --sea-line:#c1d5e1; --paper:#fbfcfc; --ink:#13213a; --pencil:#556378; --rule:#d0dae3;
  --accent:#1e5bd0; --on-accent:#ffffff; --accent-soft:#e0e9fb;
  --good:#13804a; --good-soft:#dcf1e4; --bad:#c2372c; --bad-soft:#f9e1de; --gold:#c98f0a; --heart:#d93a52;
  --i-ind:#e9785f; --i-ind-s:#fbe3dc; --i-mac:#dda722; --i-mac-s:#f8edc9; --i-rit:#ec8636; --i-rit-s:#fbe4cf;
  --i-str:#4b9fd4; --i-str-s:#dbeefa; --i-inf:#8a72d0; --i-inf-s:#e9e3f8; --i-skl:#2a9a8a; --i-skl-s:#d6f0eb;
  --sq-a:#d9e3fa; --sq-b:#f6eac6; --water:#4f8fdc; --glass:#eef3f9;
  --f-disp:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sea:#0d1826; --sea-line:#16263b; --paper:#16212f; --ink:#e7edf5; --pencil:#9cadc4; --rule:#27364c;
    --accent:#7ea6ff; --on-accent:#0c1430; --accent-soft:#1f2b48;
    --good:#58cf8c; --good-soft:#143224; --bad:#ff7d72; --bad-soft:#3b1d1c; --gold:#f3c34f; --heart:#ff6f86;
    --i-ind:#f08f78; --i-ind-s:#3a2420; --i-mac:#eec04e; --i-mac-s:#352c14; --i-rit:#f6a15a; --i-rit-s:#3a2716;
    --i-str:#6cb8ea; --i-str-s:#14303f; --i-inf:#a593ea; --i-inf-s:#272240; --i-skl:#4cc3b2; --i-skl-s:#12302c;
    --sq-a:#25304d; --sq-b:#3a321e; --water:#3f80cc; --glass:#1f2633;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sea:#0d1826; --sea-line:#16263b; --paper:#16212f; --ink:#e7edf5; --pencil:#9cadc4; --rule:#27364c;
  --accent:#7ea6ff; --on-accent:#0c1430; --accent-soft:#1f2b48;
  --good:#58cf8c; --good-soft:#143224; --bad:#ff7d72; --bad-soft:#3b1d1c; --gold:#f3c34f; --heart:#ff6f86;
  --i-ind:#f08f78; --i-ind-s:#3a2420; --i-mac:#eec04e; --i-mac-s:#352c14; --i-rit:#f6a15a; --i-rit-s:#3a2716;
  --i-str:#6cb8ea; --i-str-s:#14303f; --i-inf:#a593ea; --i-inf-s:#272240; --i-skl:#4cc3b2; --i-skl-s:#12302c;
  --sq-a:#25304d; --sq-b:#3a321e; --water:#3f80cc; --glass:#1f2633;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--sea);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.5;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;margin-bottom:14px}
.brand h1{font-family:var(--f-disp);font-weight:800;font-size:clamp(28px,5vw,42px);line-height:1;margin:0;letter-spacing:-.02em}
.brand p{margin:6px 0 0;color:var(--pencil);font-size:14px}
.score{display:flex;gap:14px;font-family:var(--f-disp);font-weight:700;font-size:18px;align-items:center}
.score .star{color:var(--gold)}
.ru{color:var(--pencil);font-size:.88em}
p.ru{margin:3px 0 0}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:18px clamp(14px,2.6vw,26px)}
.btn{font:inherit;font-size:14.5px;color:var(--ink);background:var(--paper);border:1.5px solid var(--rule);border-radius:10px;padding:8px 14px;cursor:pointer;line-height:1.25;text-align:left;touch-action:manipulation}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.ok{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:700}
.btn.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.btn.sel{border-color:var(--accent);background:var(--accent-soft)}
.btn:focus-visible,select:focus-visible,input:focus-visible,.isl:focus-visible,.node:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.col{display:grid;gap:8px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
input[type=number],input[type=text],select{font:inherit;font-family:var(--f-mono);padding:7px 10px;border:1.5px solid var(--rule);border-radius:9px;background:var(--paper);color:var(--ink)}
input[type=number]{width:6em}

/* map */
.sea{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--sea-line);background:var(--sea)}
.sea svg{display:block;width:100%;height:auto}
.wave{fill:none;stroke:var(--sea-line);stroke-width:2}
.route{fill:none;stroke:var(--pencil);stroke-width:2.5;stroke-dasharray:2 9;stroke-linecap:round;opacity:.7}
.isl{cursor:pointer}
.isl .land{stroke:var(--ink);stroke-width:2.2}
.isl:hover .land{stroke-width:3.4}
.isl .ring{fill:none;stroke:var(--ink);stroke-width:1;opacity:.25}
.isl-name{font-family:var(--f-disp);font-weight:800;font-size:22px;fill:var(--ink)}
.isl-sub{font-family:var(--f-mono);font-size:12px;fill:var(--pencil)}
.isl-stars{font-family:var(--f-disp);font-weight:700;font-size:15px;fill:var(--ink)}
.ship{fill:var(--paper);stroke:var(--ink);stroke-width:2}
.legend-list{display:grid;gap:8px;margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.legend-list button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border-left:6px solid var(--ic)}
.legend-list .t{font-family:var(--f-disp);font-weight:700;font-size:16px}
.tip{margin-top:14px;font-size:14px}
.reset{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--pencil)}

/* island */
.band{border-radius:16px;padding:18px clamp(14px,2.6vw,26px);background:var(--ics);border:1.5px solid var(--ic);margin-bottom:16px}
.band h2{font-family:var(--f-disp);font-weight:800;font-size:clamp(26px,4.4vw,36px);margin:0;line-height:1.05;letter-spacing:-.01em}
.band .ch{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--pencil);margin-bottom:4px}
.trail{list-style:none;margin:0;padding:0;display:grid;gap:12px;position:relative}
.trail::before{content:"";position:absolute;left:35px;top:20px;bottom:20px;border-left:3px dotted var(--pencil);opacity:.5}
.node{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;background:var(--paper);border:1.5px solid var(--rule);border-radius:14px;padding:10px 14px 10px 10px;font:inherit;color:var(--ink);text-align:left;cursor:pointer;position:relative}
.node:hover:not(:disabled){border-color:var(--ic)}
.node:disabled{cursor:not-allowed;opacity:.55}
.node .num{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:19px;background:var(--ics);border:2px solid var(--ic);margin-left:4px}
.node.boss .num{border-radius:12px;background:var(--ic);color:var(--paper)}
.node .tt{font-family:var(--f-disp);font-weight:700;font-size:18px;line-height:1.15}
.node .meta{font-size:13px;color:var(--pencil)}
.stars{font-size:18px;letter-spacing:2px;color:var(--rule);white-space:nowrap}
.stars b{color:var(--gold);font-weight:400}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;padding:1px 7px;border-radius:99px;background:var(--bad-soft);color:var(--bad);margin-left:6px;vertical-align:middle}

/* level */
.lvbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}
.lvbar h2{font-family:var(--f-disp);font-weight:800;font-size:clamp(22px,3.6vw,30px);margin:0;line-height:1.1}
.hearts{font-size:24px;letter-spacing:3px;color:var(--heart)}
.hearts .lost{color:var(--rule)}
.brief{background:var(--ics);border:1.5px solid var(--ic);border-radius:14px;padding:12px 16px;margin-bottom:14px}
.brief p{margin:0}
.stage-tag{font-family:var(--f-mono);font-size:12px;color:var(--pencil);margin-bottom:8px}
.feedback{min-height:1.6em;margin-top:12px;padding:10px 14px;border-radius:10px;font-size:14.5px}
.feedback:empty{display:none}
.feedback.bad{background:var(--bad-soft);color:var(--ink);border-left:5px solid var(--bad)}
.feedback.good{background:var(--good-soft);color:var(--ink);border-left:5px solid var(--good)}
.feedback.info{background:var(--accent-soft);color:var(--ink);border-left:5px solid var(--accent)}
.q{font-size:17px;font-weight:700;margin:0 0 4px}
.opts{display:grid;gap:8px;margin-top:12px}
.why{margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--good-soft);font-size:14.5px}
.fig{margin:8px 0}
.fig svg{display:block;max-width:100%;height:auto}
.proof{counter-reset:ln;display:grid;gap:6px;margin:0;padding:0;list-style:none}
.proof li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start;padding:8px 10px;border-radius:9px;background:var(--good-soft);font-size:14.5px}
.proof li::before{counter-increment:ln;content:counter(ln);font-family:var(--f-mono);color:var(--good);font-weight:600}
.proof li.empty{background:transparent;border:1.5px dashed var(--rule);color:var(--pencil)}
.proof .rsn{display:block;font-family:var(--f-mono);font-size:12.5px;color:var(--good);margin-top:2px}
.pool{display:grid;gap:8px}
.reasons{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.reasons .btn{font-family:var(--f-mono);font-size:13px;padding:6px 10px}
.two{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.h3{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--pencil);margin:0 0 8px}
.result{text-align:left}
.result .big{font-family:var(--f-disp);font-weight:800;font-size:clamp(28px,5vw,40px);margin:0;line-height:1.05}
.result .stars{font-size:38px}
.lesson{margin-top:12px;padding:12px 16px;border-radius:12px;background:var(--accent-soft)}
.lesson b{color:var(--accent)}

/* custom boards */
.board svg{display:block;width:100%;max-width:420px;height:auto}
.sq{stroke:var(--rule);stroke-width:1}
.sq.plain{fill:var(--paper)} .sq.even{fill:var(--sq-a)} .sq.odd{fill:var(--sq-b)}
.robot-body{fill:var(--accent);stroke:var(--ink);stroke-width:1.5}
.robot-eye{fill:var(--on-accent)}
.tgt{fill:none;stroke-width:2.5}
.tgt.open{stroke:var(--bad)} .tgt.done{stroke:var(--good)}
.tgt-t{font-family:var(--f-disp);font-weight:800;font-size:15px}
.tgt-t.open{fill:var(--bad)} .tgt-t.done{fill:var(--good)}
.svg-m{fill:var(--pencil);font-family:var(--f-mono);font-size:11px}
.svg-b{fill:var(--ink);font-family:var(--f-mono);font-size:14px;font-weight:600}
.svg-t{fill:var(--ink);font-family:var(--f-body);font-size:13px}
.jug-glass{fill:var(--glass);stroke:var(--ink);stroke-width:2}
.jug-water{fill:var(--water)}
.amounts{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.amt{border:1.5px solid var(--rule);border-radius:12px;padding:10px;background:var(--paper);display:grid;gap:6px;align-content:start;min-height:96px}
.amt .n{font-family:var(--f-disp);font-weight:800;font-size:24px;line-height:1}
.amt.done{border-color:var(--good);background:var(--good-soft)}
.amt.off{opacity:.55}
.amt.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.amt .btn{font-size:13px;padding:6px 9px}
.wcards{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.wcard{border:1.5px solid var(--rule);border-radius:12px;padding:10px 12px;background:var(--paper);display:grid;gap:6px}
.wcard.need{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.wcard .nm{font-family:var(--f-disp);font-weight:800;font-size:18px}
.chip{display:inline-block;font-family:var(--f-mono);font-size:12.5px;padding:2px 8px;border-radius:7px;background:var(--sea);border:1px solid var(--rule);margin:0 3px 3px 0}
.chip.x{text-decoration:line-through;opacity:.5}
.chip.keep{background:var(--good-soft);border-color:var(--good)}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th,table.t td{border-bottom:1px solid var(--rule);padding:5px 8px;text-align:left;vertical-align:top}
table.t th{font-size:12px;color:var(--pencil);font-weight:600}
.scroll{overflow-x:auto}
.mline{stroke:var(--accent);stroke-width:4;stroke-linecap:round}
.pname{cursor:pointer}
.pname rect{fill:var(--paper);stroke:var(--ink);stroke-width:1.5}
.pname.sel rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:3}
.stone{fill:var(--pencil);stroke:var(--ink);stroke-width:1;cursor:pointer}
.stone:hover{fill:var(--bad)}
.stone.hint{fill:var(--bad-soft);stroke:var(--bad);stroke-width:2}
.bitc{fill:var(--paper);stroke:var(--rule);cursor:default}
.bitc.dg{stroke:var(--accent);stroke-width:2.5}
.bitc.d{fill:var(--good-soft);stroke:var(--good);cursor:pointer}
.bitc.dbad{fill:var(--bad-soft);stroke:var(--bad);cursor:pointer}
.arr{stroke:var(--ink);stroke-width:1.8;fill:none}
.mk{fill:var(--ink)}
.dot{fill:var(--paper);stroke:var(--ink);stroke-width:1.5}
/* write mode */
.keys{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:5px;padding:8px 0 10px;background:var(--paper);border-bottom:1px solid var(--rule);margin-bottom:12px}
.btn.key{font-family:var(--f-mono);font-size:16px;min-width:38px;padding:6px 8px;text-align:center}
.cloze{display:grid;gap:10px}
.cl{margin:0;font-family:var(--f-mono);font-size:14px;line-height:2.1}
.gapw{display:inline;white-space:normal}
.gap{font-family:var(--f-mono);font-size:14px;padding:3px 7px;border:1.5px dashed var(--accent);border-radius:7px;background:var(--accent-soft);color:var(--ink);max-width:100%}
select.gap{font-family:var(--f-body)}
.gapw.ok .gap{border:1.5px solid var(--good);background:var(--good-soft)}
.gapw.self .gap{border:1.5px solid var(--good);background:var(--good-soft);border-style:dashed}
.gapw.miss .gap{border:1.5px solid var(--bad);background:var(--bad-soft)}
.gapw.ask .gap{border:1.5px solid var(--gold)}
.model{display:inline;font-family:var(--f-mono);font-size:13px;color:var(--good);margin-left:6px}
.gapw.miss .model{color:var(--bad)}
.btn.mini{font-size:12px;padding:3px 8px;margin-left:4px}
.modelproof{margin-top:12px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--good);background:var(--paper)}
.modelproof p{margin:0 0 4px;font-family:var(--f-mono);font-size:13.5px}
.tag.write{background:var(--i-skl-s);color:var(--i-skl)}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
.pop{animation:pop .28s ease-out}
@media (prefers-reduced-motion: reduce){.pop{animation:none}}
</style>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{min-height:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
</style>

<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Proof Archipelago</h1>
      <p>Midterm 2 quest · chapters 5–8 · six islands, 34 levels · <span class="ru">квест по главам 5–8 + режим письма</span></p>
    </div>
    <div class="score" id="score" aria-live="polite"></div>
  </header>
  <main id="app"></main>
</div>

<script>
/* ================= helpers ================= */
const $=(q,r=document)=>r.querySelector(q), $$=(q,r=document)=>[...r.querySelectorAll(q)];
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on')&&typeof v==='function')e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v);}for(const c of kids.flat(9)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}return e;}
const SVGNS='http://www.w3.org/2000/svg';
function sv(tag,attrs,...kids){const e=document.createElementNS(SVGNS,tag);for(const[k,v]of Object.entries(attrs||{})){if(v==null||v===false)continue;if(k.startsWith('on')&&typeof v==='function')e.addEventListener(k.slice(2),v);else e.setAttribute(k,v);}for(const c of kids.flat(9)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}return e;}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const gcd=(a,b)=>{while(b)[a,b]=[b,a%b];return Math.abs(a);};
const ru=t=>t?h('span',{class:'ru',style:'display:block'},t):null;

/* ================= ritual engine ================= */
function ritualRun(pm,pw){const cr=pm.map(()=>new Set()),days=[];for(let g=0;g<200;g++){const target=pm.map((L,i)=>L.find(j=>!cr[i].has(j)));const by={};target.forEach((j,i)=>(by[j]=by[j]||[]).push(i));const keep={},rej=[];for(const j in by){const L=pw[j];const best=by[j].reduce((a,b)=>L.indexOf(a)<=L.indexOf(b)?a:b);keep[j]=best;by[j].forEach(i=>{if(i!==best)rej.push(i);});}days.push({target,by,keep,rej});if(!rej.length)return{days,wife:target};rej.forEach(i=>cr[i].add(target[i]));}return null;}
function rogues(pm,pw,wife){const hus=[];wife.forEach((w,m)=>hus[w]=m);const out=[];pm.forEach((L,m)=>{for(const w of L){if(w===wife[m])break;if(pw[w].indexOf(m)<pw[w].indexOf(hus[w]))out.push([m,w]);}});return out;}

<script>
/* ================= components ================= */
const C={};

C.mc=function(box,L,api,done){

function arrowFig(spec){

C.input=function(box,L,api,done){

C.order=function(box,L,api,done){

    if(pending){const l=pending;proof.append(h('li',{class:'pop'},h('span',{},l.t,h('span',{class:'rsn',style:'color:var(--accent)'},'reason? ↓'),
      h('div',{class:'reasons'},shuffle(L.reasons).map(r=>h('button',{class:'btn',onclick:e=>{if(r===l.r){placed++;pending=null;api.clear();render();if(placed===lines.length)done();}else{e.currentTarget.className='btn no';e.currentTarget.disabled=true;api.mistake(`“${r}” does not justify this line.`);}}},r))))));}

    const poolBox=h('div',{class:'pool'},pool.filter(p=>!used.has(p)).map(p=>h('button',{class:'btn',disabled:!!pending,onclick:()=>pick(p)},p.t)));
    box.replaceChildren(h('div',{class:'two'},h('div',{},h('p',{class:'h3'},'Your proof · твоё доказательство'),proof),h('div',{},h('p',{class:'h3'},'Lines to choose from · строки'),pending?h('p',{class:'ru'},'Сначала выбери причину для последней строки.'):null,poolBox)));

/* ---- strong induction stamps ---- */
C.stamps=function(box,L,api,done){
  const DEC={12:'4 + 4 + 4',13:'4 + 4 + 5',14:'4 + 5 + 5',15:'5 + 5 + 5'};
  let cur=12;const label={};let choosing=false;
  function render(){
    const cards=[h('div',{class:'amt off'},h('div',{class:'n'},'11'),h('div',{class:'ru'},'4a + 5b? нет: 11 − 5 = 6, 11 − 4 = 7, 11 − 8 = 3. Начинаем с 12.'))];
    for(let n=12;n<=23;n++){
      const st=n<cur?'done':n===cur?'active':'';
      const c=h('div',{class:'amt '+st},h('div',{class:'n'},n));
      if(n<cur)c.append(h('div',{class:'mono',style:'font-size:13px'},label[n]));
      if(n===cur){
        if(!choosing)c.append(h('button',{class:'btn',onclick:()=>base(n)},'Base case'),h('button',{class:'btn',onclick:()=>step(n)},`From ${n-4}, add a 4`));
        else{const opts=shuffle([DEC[n],...Object.entries(DEC).filter(([k])=>+k!==n).slice(0,2).map(([,v])=>v)]);
          c.append(h('div',{class:'ru'},`${n} = ?`),...opts.map(o=>h('button',{class:'btn mono',onclick:e=>{if(o===DEC[n]){label[n]=`${n} = ${o}  (base)`;choosing=false;next();}else{e.currentTarget.className='btn no';e.currentTarget.disabled=true;api.mistake(`${o} = ${o.split('+').reduce((a,b)=>a+ +b,0)}, not ${n}.`);}}},o)));}
      }

  }
  function next(){api.clear();cur++;if(cur>23){done();return;}render();}

  function step(n){if(n-4<12){api.mistake(`${n} − 4 = ${n-4} is below 12, so P(${n-4}) is not proved. ${n} must be a base case.`);return;}label[n]=`${n} = (${n-4}) + 4`;next();}
  render();
};

/* ---- robot ---- */

  }
  function check(){if(T.every(t=>t.ok))setTimeout(done,500);}

    h('button',{class:'btn',style:'font-size:20px;text-align:center','aria-label':'up left',onclick:()=>move(-1,1)},'↖'),h('button',{class:'btn',style:'font-size:20px;text-align:center','aria-label':'up right',onclick:()=>move(1,1)},'↗'),

    h('div',{},h('p',{class:'h3'},'Declare unreachable · объявить недостижимой'),h('div',{class:'row'},T.map(t=>h('button',{class:'btn',onclick:()=>declare(t)},t.k+` (${t.m}, ${t.n})`)))),

  const D=DATA[L.data],n=D.men.length,cr=D.pm.map(()=>new Set());let day=0,target,by,decided;
  function morning(){day++;target=D.pm.map((Lm,i)=>Lm.find(j=>!cr[i].has(j)));by={};target.forEach((j,i)=>(by[j]=by[j]||[]).push(i));decided={};render();}

    const allDone=con.every(j=>decided[j]!=null);

/* ---- write mode: fill the skeleton ---- */
function nrm(x){
  return String(x).toLowerCase()
    .replace(/[’′‘`]/g,"'").replace(/″/g,"''")
    .replace(/lambda/g,'λ').replace(/forall/g,'∀').replace(/emptyset|\{\}/g,'∅')
    .replace(/<=>|<->|\biff\b/g,'⟺').replace(/=>|->/g,'⇒').replace(/!=|=\/=/g,'≠')
    .replace(/</g,'⟨').replace(/>/g,'⟩')

    .replace(/[_\s"“”]/g,'')
    .replace(/[,;:·]+$/,'')
    .replace(/^(∀[a-z]+(?:∈[a-z*]+)?)[·,:]/,'$1');

  const lines=L.lines.map(t=>{const p=h('p',{class:'cl'});t.split(/\{(\w+)\}/).forEach((part,i)=>{
    if(i%2===0){if(part)p.append(part);return;}
    const g=L.gaps[part];let el;
    if(g.o){el=h('select',{id:`cz-${L.id}-${part}`,class:'gap','aria-label':'choose'},h('option',{value:''},'…'),shuffle(g.o).map(o=>h('option',{value:o},o)));}

/* ---- Nim duel ---- */
C.nim=function(box,L,api,done){

  const xr=a=>a.reduce((x,y)=>x^y,0);

    piles.forEach((p,i)=>{const y=24+i*46;svg.append(sv('text',{x:8,y:y+5,class:'svg-b'},p));for(let j=0;j<p;j++){const c=sv('circle',{cx:56+j*sw+9,cy:y,r:9,class:'stone'+(hint&&hint.i===i&&j>=hint.to?' hint':''),tabindex:0,role:'button','aria-label':`leave ${j} in pile ${i+1}`});const go=()=>take(i,j);c.addEventListener('click',go);c.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});svg.append(c);}});
    const s=xr(piles),b=5;
    const tb=cols?h('table',{class:'t mono',style:'max-width:360px'},h('tbody',{},piles.map(p=>h('tr',{},h('td',{},p),h('td',{},p.toString(2).padStart(b,'0')))),h('tr',{},h('td',{},h('b',{},'xor')),h('td',{},h('b',{},s.toString(2).padStart(b,'0')+` = ${s}`))))):null;
    box.replaceChildren(h('div',{class:'stage-tag'},busy?'The computer is thinking …':turn===0?'Your move: click a stone — it and every stone to its right are taken.':''),h('div',{class:'scroll'},svg),
      h('div',{class:'row',style:'margin-top:10px'},h('button',{class:'btn',onclick:()=>{cols=!cols;render();}},cols?'Hide binary columns':'Show binary columns'),h('button',{class:'btn',onclick:()=>{hint=win();render();if(!hint)api.info('No winning move here: Nim-sum is 0.');}},'Hint')),tb);

  function cpu(){const w=win();if(w)piles[w.i]=w.to;else{let m=0;piles.forEach((p,k)=>{if(p>piles[m])m=k;});piles[m]-=1;}busy=false;turn=0;
    if(piles.every(p=>!p)){api.mistake('The computer took the last stone. Leave Nim-sum 0 after every move of yours. New game.');piles=[6,12,18];}
    else if(xr(piles)!==0&&!w){api.info('The computer had no winning move: you left Nim-sum 0. Keep doing that.');}
    render();}
  render();
};
